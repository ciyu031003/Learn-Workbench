-baseline:central">low&gt;high，查找结束</text><text x="495" y="360" text-anchor="middle" dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">插入位置为 low=2</text></g><g style="fill:#fcfcfb;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="40" y="394" width="600" height="64" rx="8" stroke-width=".5" style="fill:#fcfcfb;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="340" y="414" text-anchor="middle" dominant-baseline="central" style="fill:#0b0b0b;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">共同点：确定位置后</text><text x="340" y="436" text-anchor="middle" dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">都需将其后元素顺序后移，再插入该元素</text></g></svg>