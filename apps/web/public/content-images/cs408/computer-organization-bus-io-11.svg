<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif"><defs><linearGradient id="dCpu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f1ff"/><stop offset="100%" stop-color="#c1d7ff"/></linearGradient><linearGradient id="dMem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf7ee"/><stop offset="100%" stop-color="#bde3c9"/></linearGradient><linearGradient id="dDev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f6f9"/><stop offset="100%" stop-color="#a9d3de"/></linearGradient><linearGradient id="dDma" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4d6"/><stop offset="100%" stop-color="#ffd97a"/></linearGradient><linearGradient id="dPipe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6a6a6"/><stop offset="50%" stop-color="#f37676"/><stop offset="100%" stop-color="#f6a6a6"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4a5568"/></marker><marker id="ah_red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c53030"/></marker><marker id="ah_blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2b6cb0"/></marker><marker id="ah_green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f855a"/></marker><filter id="shd" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity=".15"/></filter></defs><g filter="url(#shd)"><rect x="290" y="30" width="200" height="90" rx="10" fill="url(#dCpu)" stroke="#3b5a92" stroke-width="1.5"/><text x="390" y="60" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a66">CPU</text><text x="390" y="82" text-anchor="middle" font-size="12" fill="#3a5a88">运行主程序（与 DMA 并行）</text><g><rect x="305" y="92" width="80" height="20" rx="4" fill="#fff" stroke="#3b5a92"/><text x="345" y="107" text-anchor="middle" font-size="11" fill="#1e3a66">① 预处理</text></g><g><rect x="395" y="92" width="80" height="20" rx="4" fill="#fff" stroke="#3b5a92"/><text x="435" y="107" text-anchor="middle" font-size="11" fill="#1e3a66">④ 后处理</text></g></g><text x="200" y="65" font-size="12" fill="#556170">仅参与</text><text x="200" y="82" font-size="12" fill="#556170">首尾两端</text><path d="M245 72h40" stroke="#8a94a5" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#ah)"/><g filter="url(#shd)"><rect x="300" y="200" width="180" height="80" rx="10" fill="url(#dDma)" stroke="#a17419" stroke-width="1.6"/><text x="390" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#5a3f0d">DMA 控制器</text><text x="390" y="252" text-anchor="middle" font-size="11" fill="#7a5814">接管总线 · 自动搬运</text><text x="390" y="268" text-anchor="middle" font-size="11" fill="#7a5814">MAR · DR · DC · CR</text></g><path d="M345 120v80" stroke="#2b6cb0" stroke-width="2" marker-end="url(#ah_blue)"/><text x="255" y="150" font-size="12" fill="#2b6cb0" font-weight="bold">② 初始化参数</text><text x="255" y="167" font-size="11" fill="#2b6cb0">地址/长度/方向</text><path d="M435 2e2V120" stroke="#2f855a" stroke-width="2" marker-end="url(#ah_green)"/><text x="490" y="150" font-size="12" fill="#2f855a" font-weight="bold">③ 完成中断</text><text x="490" y="167" font-size="11" fill="#2f855a">通知 CPU 校验/收尾</text><g filter="url(#shd)"><rect x="60" y="215" width="160" height="70" rx="10" fill="url(#dDev)" stroke="#2f6673" stroke-width="1.5"/><text x="140" y="243" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c4550">外设</text><text x="140" y="266" text-anchor="middle" font-size="11" fill="#2f6673">如：磁盘 / 网卡</text></g><g filter="url(#shd)"><rect x="560" y="215" width="160" height="70" rx="10" fill="url(#dMem)" stroke="#2f7a48" stroke-width="1.5"/><text x="640" y="243" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e5133">内存</text><text x="640" y="266" text-anchor="middle" font-size="11" fill="#2f7a48">主存 (RAM)</text></g><rect x="220" y="240" width="80" height="20" rx="6" fill="url(#dPipe)" opacity=".9"/><rect x="480" y="240" width="80" height="20" rx="6" fill="url(#dPipe)" opacity=".9"/><line x1="230" y1="250" x2="292" y2="250" stroke="#7c1d1d" stroke-width="2.2" marker-end="url(#ah_red)"/><line x1="488" y1="250" x2="552" y2="250" stroke="#7c1d1d" stroke-width="2.2" marker-end="url(#ah_red)"/><text x="390" y="306" text-anchor="middle" font-size="13" fill="#c53030" font-weight="bold">数据通路（不经过 CPU 寄存器/执行单元）</text><g><rect x="60" y="325" width="660" height="150" rx="10" fill="#fafbfd" stroke="#cbd2dc" stroke-width="1" stroke-dasharray="4,3"/><text x="80" y="350" font-size="13" font-weight="bold" fill="#2d3748">核心思想</text><g font-size="12" fill="#2d3748"><text x="80" y="374"><tspan font-weight="bold" fill="#2b6cb0">① 预处理：</tspan><tspan>CPU 配置 DMA 参数（源地址、目标地址、长度、方向）</tspan></text><text x="80" y="396"><tspan font-weight="bold" fill="#7c1d1d">② 数据传输：</tspan><tspan>DMA 控制器接管总线，在外设与内存之间</tspan><tspan font-weight="bold" fill="#c53030">直接搬运数据</tspan><tspan>，CPU 同时执行其他指令</tspan></text><text x="80" y="418"><tspan font-weight="bold" fill="#2f855a">③ 后处理：</tspan><tspan>传输完成后 DMA 发中断，CPU 进行数据校验与收尾</tspan></text><text x="80" y="446" font-style="italic" fill="#4a5568">⇒ CPU 只在两端参与，数据传输与主程序<tspan font-weight="bold" fill="#c53030">并行</tspan>进行，适用于块设备的高吞吐传输</text></g></g></svg>