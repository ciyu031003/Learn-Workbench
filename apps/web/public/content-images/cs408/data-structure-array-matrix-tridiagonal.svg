<text x="66" y="462" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13.5" fill="#263238">压缩后只需保存三条对角线：主对角线 n 个 + 上对角线 n−1 个 + 下对角线 n−1 个</text>
<text x="66" y="494" font-family="Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="14" font-weight="bold" fill="#1976d2">n + (n − 1) + (n − 1) = 3n − 2<tspan font-weight="normal" font-size="13" fill="#263238">　个存储单元（普通二维数组要 n<tspan font-size="10" dy="-5">2</tspan><tspan dy="5"> 个）</tspan></tspan></text>
