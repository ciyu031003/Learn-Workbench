<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">三对角矩阵的压缩存储</title>
<desc id="figDesc">左侧是一个 5 阶三对角矩阵，只有主对角线、上对角线、下对角线上的元素可能非零；右侧是 diag、upper、lower 三个一维数组，分别保存这三条对角线上的元素。</desc>
