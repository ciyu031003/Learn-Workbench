<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif"><rect width="820" height="560" fill="#f8f9fa" rx="8"/><rect x="16" y="16" width="380" height="256" fill="#fff" rx="8" stroke="#dde" stroke-width="1.5"/><text x="206" y="40" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">隐藏节点问题</text><text x="206" y="56" text-anchor="middle" font-size="11" fill="#888">（CSMA/CD 在无线网络中失效的根因）</text><circle cx="206" cy="155" r="22" fill="#4a90d9" stroke="#2b6cb0" stroke-width="2"/><text x="206" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">AP</text><text x="206" y="165" text-anchor="middle" font-size="9" fill="#dce"/>`<circle cx="90" cy="155" r="18" fill="#48bb78" stroke="#276749" stroke-width="2"/><text x="90" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">A</text><text x="90" y="163" text-anchor="middle" font-size="9" fill="#fff">STA</text><circle cx="322" cy="155" r="18" fill="#ed8936" stroke="#c05621" stroke-width="2"/><text x="322" y="151" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">C</text><text x="322" y="163" text-anchor="middle" font-size="9" fill="#fff">STA</text><circle cx="90" cy="155" r="128" fill="none" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="6,4" opacity=".6"/><circle cx="322" cy="155" r="128" fill="none" stroke="#ed8936" stroke-width="1.5" stroke-dasharray="6,4" opacity=".6"/><line x1="110" y1="152" x2="182" y2="152" stroke="#48bb78" stroke-width="2" marker-end="url(#arrowG)"/><line x1="302" y1="152" x2="230" y2="152" stroke="#ed8936" stroke-width="2" marker-end="url(#arrowO)"/><line x1="108" y1="162" x2="200" y2="210" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/><line x1="304" y1="162" x2="212" y2="210" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/><text x="90" y="188" text-anchor="middle" font-size="10" fill="#276749">在范围内</text><text x="322" y="188" text-anchor="middle" font-size="10" fill="#c05621">在范围内</text><text x="206" y="228" text-anchor="middle" font-size="11" fill="#e53e3e" font-weight="bold">A 与 C 互相"看不见"</text><text x="206" y="244" text-anchor="middle" font-size="10" fill="#555">各自以为信道空闲 → 同时发送 → 碰撞</text><text x="206" y="260" text-anchor="middle" font-size="10" fill="#555">且碰撞发生在 AP 侧，A 和 C 自己无法感知</text><rect x="412" y="16" width="392" height="256" fill="#fff" rx="8" stroke="#dde" stroke-width="1.5"/><text x="608" y="40" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CSMA/CA 的解决思路</text><text x="608" y="56" text-anchor="middle" font-size="11" fill="#888">冲突避免（Collision Avoidance）</text><circle cx="444" cy="88" r="12" fill="#4a90d9"/><text x="444" y="93" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text><text x="464" y="87" font-size="12" fill="#222" font-weight="bold">载波监听（Carrier Sense）</text><text x="464" y="101" font-size="11" fill="#555">发送前先"听"信道是否忙碌</text><circle cx="444" cy="132" r="12" fill="#4a90d9"/><text x="444" y="137" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text><text x="464" y="131" font-size="12" fill="#222" font-weight="bold">等待 DIFS + 随机退避</text><text x="464" y="145" font-size="11" fill="#555">信道空闲后等一段再随机延迟，错开发送时机</text><circle cx="444" cy="176" r="12" fill="#4a90d9"/><text x="444" y="181" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3</text><text x="464" y="175" font-size="12" fill="#222" font-weight="bold">发送数据帧</text><text x="464" y="189" font-size="11" fill="#555">退避结束后发送（无法边发边检测碰撞）</text><circle cx="444" cy="220" r="12" fill="#48bb78"/><text x="444" y="225" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4</text><text x="464" y="219" font-size="12" fill="#222" font-weight="bold">等待 ACK 确认</text><text x="464" y="233" font-size="11" fill="#555">ACK 到达 → 成功；超时未到 → 重发并扩大退避窗口</text><line x1="444" y1="100" x2="444" y2="120" stroke="#4a90d9" stroke-width="1.5"/><line x1="444" y1="144" x2="444" y2="164" stroke="#4a90d9" stroke-width="1.5"/><line x1="444" y1="188" x2="444" y2="208" stroke="#4a90d9" stroke-width="1.5"/><rect x="16" y="284" width="788" height="200" fill="#fff" rx="8" stroke="#dde" stroke-width="1.5"/><text x="410" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">CSMA/CD vs CSMA/CA</text><rect x="32" y="318" width="240" height="28" fill="#edf2f7" rx="4"/><text x="152" y="337" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">对比维度</text><rect x="284" y="318" width="240" height="28" fill="#bee3f8" rx="4"/><text x="404" y="337" text-anchor="middle" font-size="12" fill="#2b6cb0" font-weight="bold">CSMA/CD（有线以太网）</text><rect x="540" y="318" width="248" height="28" fill="#fefcbf" rx="4"/><text x="664" y="337" text-anchor="middle" font-size="12" fill="#744210" font-weight="bold">CSMA/CA（无线 802.11）</text><line x1="32" y1="346" x2="788" y2="346" stroke="#e2e8f0" stroke-width="1"/><text x="152" y="362" text-anchor="middle" font-size="11" fill="#444">冲突处理策略</text><text x="404" y="362" text-anchor="middle" font-size="11" fill="#2b6cb0">边发边检测，冲突后立即停止</text><text x="664" y="362" text-anchor="middle" font-size="11" fill="#744210">发送前退避，尽量避免冲突</text><line x1="32" y1="370" x2="788" y2="370" stroke="#e2e8f0" stroke-width="1"/><text x="152" y="386" text-anchor="middle" font-size="11" fill="#444">确认机制</text><text x="404" y="386" text-anchor="middle" font-size="11" fill="#2b6cb0">无需 ACK（冲突直接感知）</text><text x="664" y="386" text-anchor="middle" font-size="11" fill="#744210">必须等待 ACK 确认成功</text><line x1="32" y1="394" x2="788" y2="394" stroke="#e2e8f0" stroke-width="1"/><text x="152" y="410" text-anchor="middle" font-size="11" fill="#444">帧长最小限制</text><text x="404" y="410" text-anchor="middle" font-size="11" fill="#2b6cb0">有（确保碰撞可被检测到）</text><text x="664" y="410" text-anchor="middle" font-size="11" fill="#744210">无此限制</text><line x1="32" y1="418" x2="788" y2="418" stroke="#e2e8f0" stroke-width="1"/><text x="152" y="434" text-anchor="middle" font-size="11" fill="#444">信道预约</text><text x="404" y="434" text-anchor="middle" font-size="11" fill="#2b6cb0">无</text><text x="664" y="434" text-anchor="middle" font-size="11" fill="#744210">可选 RTS/CTS 预约信道</text><line x1="32" y1="442" x2="788" y2="442" stroke="#e2e8f0" stroke-width="1"/><text x="152" y="458" text-anchor="middle" font-size="11" fill="#444">适用场景</text><text x="404" y="458" text-anchor="middle" font-size="11" fill="#2b6cb0">有线局域网（以太网）</text><text x="664" y="458" text-anchor="middle" font-size="11" fill="#744210">无线局域网（Wi-Fi / 802.11）</text><line x1="276" y1="318" x2="276" y2="466" stroke="#e2e8f0" stroke-width="1"/><line x1="532" y1="318" x2="532" y2="466" stroke="#e2e8f0" stroke-width="1"/><rect x="32" y="318" width="756" height="148" fill="none" rx="4" stroke="#cbd5e0" stroke-width="1"/><rect x="16" y="496" width="788" height="48" fill="#fff5f5" rx="6" stroke="#feb2b2" stroke-width="1.2"/><text x="28" y="515" font-size="11" fill="#c53030" font-weight="bold">考点提示：</text><text x="28" y="533" font-size="11" fill="#555">"冲突避免"不代表完全消除冲突，只是尽量降低概率；CSMA/CA 无法"检测"冲突，只能通过 ACK 超时"感知"失败。</text><defs><marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#48bb78"/></marker><marker id="arrowO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#ed8936"/></marker></defs></svg>