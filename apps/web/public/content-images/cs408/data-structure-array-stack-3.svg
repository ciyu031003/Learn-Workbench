<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 335" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13"><style>.title{font-weight:600;font-size:13px;text-anchor:middle}.lbl{font-size:11px;fill:#555}.cell{fill:#fff;stroke:#444}.used{fill:#e3f2fd;stroke:#1565c0}.ptr{font-weight:700;fill:#c62828}.ax{stroke:#888}.note{font-size:11px;fill:#666;text-anchor:middle}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c62828"/></marker></defs><text x="410" y="22" text-anchor="middle" font-weight="700" font-size="14">顺序栈 top 指针状态变化（约定 top=-1 表示空栈）</text><g transform="translate(40,55)"><text class="title" x="80" y="0">① 空栈 (top=-1)</text><g transform="translate(20,20)"><rect class="cell" x="0" y="0" width="32" height="32"/><rect class="cell" x="32" y="0" width="32" height="32"/><rect class="cell" x="64" y="0" width="32" height="32"/><rect class="cell" x="96" y="0" width="32" height="32"/><rect class="cell" x="128" y="0" width="32" height="32"/><text class="lbl" x="16" y="48" text-anchor="middle">0</text><text class="lbl" x="48" y="48" text-anchor="middle">1</text><text class="lbl" x="80" y="48" text-anchor="middle">2</text><text class="lbl" x="112" y="48" text-anchor="middle">3</text><text class="lbl" x="144" y="48" text-anchor="middle">4</text></g><text class="ptr" x="20" y="105" text-anchor="end">top → -1</text><path d="M30 1e2.0 80" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text class="note" x="100" y="135">isEmpty: top == -1</text></g><g transform="translate(240,55)"><text class="title" x="80" y="0">② push(5) (top=0)</text><g transform="translate(20,20)"><rect class="used" x="0" y="0" width="32" height="32"/><text x="16" y="16" text-anchor="middle">5</text><rect class="cell" x="32" y="0" width="32" height="32"/><rect class="cell" x="64" y="0" width="32" height="32"/><rect class="cell" x="96" y="0" width="32" height="32"/><rect class="cell" x="128" y="0" width="32" height="32"/><text class="lbl" x="16" y="48" text-anchor="middle">0</text><text class="lbl" x="48" y="48" text-anchor="middle">1</text><text class="lbl" x="80" y="48" text-anchor="middle">2</text><text class="lbl" x="112" y="48" text-anchor="middle">3</text><text class="lbl" x="144" y="48" text-anchor="middle">4</text></g><path d="M36 85V55" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text class="ptr" x="36" y="100" text-anchor="middle">top=0</text><text class="note" x="100" y="135">先 ++top，再写入 a[top]</text></g><g transform="translate(440,55)"><text class="title" x="80" y="0">③ push(7) (top=1)</text><g transform="translate(20,20)"><rect class="used" x="0" y="0" width="32" height="32"/><text x="16" y="16" text-anchor="middle">5</text><rect class="used" x="32" y="0" width="32" height="32"/><text x="48" y="16" text-anchor="middle">7</text><rect class="cell" x="64" y="0" width="32" height="32"/><rect class="cell" x="96" y="0" width="32" height="32"/><rect class="cell" x="128" y="0" width="32" height="32"/><text class="lbl" x="16" y="48" text-anchor="middle">0</text><text class="lbl" x="48" y="48" text-anchor="middle">1</text><text class="lbl" x="80" y="48" text-anchor="middle">2</text><text class="lbl" x="112" y="48" text-anchor="middle">3</text><text class="lbl" x="144" y="48" text-anchor="middle">4</text></g><path d="M68 85V55" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text class="ptr" x="68" y="100" text-anchor="middle">top=1</text><text class="note" x="100" y="135">栈顶始终指向最新元素</text></g><g transform="translate(640,55)"><text class="title" x="80" y="0">④ pop()→7 (top=0)</text><g transform="translate(20,20)"><rect class="used" x="0" y="0" width="32" height="32"/><text x="16" y="16" text-anchor="middle">5</text><rect class="cell" x="32" y="0" width="32" height="32" stroke-dasharray="3 3"/><text x="48" y="16" text-anchor="middle" fill="#aaa">7</text><rect class="cell" x="64" y="0" width="32" height="32"/><rect class="cell" x="96" y="0" width="32" height="32"/><rect class="cell" x="128" y="0" width="32" height="32"/><text class="lbl" x="16" y="48" text-anchor="middle">0</text><text class="lbl" x="48" y="48" text-anchor="middle">1</text><text class="lbl" x="80" y="48" text-anchor="middle">2</text><text class="lbl" x="112" y="48" text-anchor="middle">3</text><text class="lbl" x="144" y="48" text-anchor="middle">4</text></g><path d="M36 85V55" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text class="ptr" x="36" y="100" text-anchor="middle">top=0</text><text class="note" x="100" y="135">先取 a[top]，再 top--</text></g><g transform="translate(240,210)"><text class="title" x="80" y="0">⑤ 栈满 (top=MAX_SIZE-1=4)</text><g transform="translate(20,20)"><rect class="used" x="0" y="0" width="32" height="32"/><text x="16" y="16" text-anchor="middle">5</text><rect class="used" x="32" y="0" width="32" height="32"/><text x="48" y="16" text-anchor="middle">7</text><rect class="used" x="64" y="0" width="32" height="32"/><text x="80" y="16" text-anchor="middle">3</text><rect class="used" x="96" y="0" width="32" height="32"/><text x="112" y="16" text-anchor="middle">9</text><rect class="used" x="128" y="0" width="32" height="32"/><text x="144" y="16" text-anchor="middle">2</text></g><path d="M164 75V55" stroke="#c62828" stroke-width="1.5" fill="none" marker-end="url(#ar)"/><text class="ptr" x="164" y="90" text-anchor="middle">top=4</text><text class="note" x="100" y="115">isFull: top == MAX_SIZE-1</text></g><g transform="translate(460,225)"><rect x="0" y="0" width="340" height="96" fill="#fffde7" stroke="#f9a825"/><text x="10" y="18" font-weight="600">边界规则</text><text x="10" y="36" font-size="11">• push：if top==MAX_SIZE-1 → 满；否则 a[++top]=x</text><text x="10" y="52" font-size="11">• pop ：if top==-1 → 空；否则 x=a[top--]</text><text x="10" y="68" font-size="11">• 注意 ++top / top-- 的副作用顺序，</text><text x="10" y="84" font-size="11">　决定 top 指向 “顶端元素” 还是 “顶端后一格”</text></g></svg>