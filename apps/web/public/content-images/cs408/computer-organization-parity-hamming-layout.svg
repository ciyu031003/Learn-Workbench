<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424" role="img" aria-label="海明码码位布局：校验位放在 1、2、4、8 号位置，每个校验位负责一组位置">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.4}
    .y{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.5}
    .g{fill:#f3f7f1;stroke:#b06a00;stroke-width:1.2}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .v{font:600 12px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .o{stroke:#b06a00;stroke-width:1.5;fill:none}
  </style>

  <text class="t" x="18" y="26">海明码的码位布局：校验位放在 1、2、4、8 号位置，数据位填其余位置</text>
  <text class="n" x="18" y="46">示例：4 位数据（k=4）需要 3 个校验位（r=3），共 7 位；下面的二进制就是「分组」的依据</text>

  <!-- 位号 -->
  <text class="v" x="146" y="72">1</text>
  <text class="v" x="216" y="72">2</text>
  <text class="v" x="286" y="72">3</text>
  <text class="v" x="356" y="72">4</text>
  <text class="v" x="426" y="72">5</text>
  <text class="v" x="496" y="72">6</text>
  <text class="v" x="566" y="72">7</text>

  <!-- 码位内容 -->
  <rect class="y" x="118" y="80" width="70" height="44"/>
  <rect class="y" x="188" y="80" width="70" height="44"/>
  <rect class="b" x="258" y="80" width="70" height="44"/>
  <rect class="y" x="328" y="80" width="70" height="44"/>
  <rect class="b" x="398" y="80" width="70" height="44"/>
  <rect class="b" x="468" y="80" width="70" height="44"/>
  <rect class="b" x="538" y="80" width="70" height="44"/>
  <text class="s" x="144" y="108">P1</text>
  <text class="s" x="214" y="108">P2</text>
  <text class="s" x="284" y="108">D1</text>
  <text class="s" x="354" y="108">P4</text>
  <text class="s" x="424" y="108">D2</text>
  <text class="s" x="494" y="108">D3</text>
  <text class="s" x="564" y="108">D4</text>

  <!-- 二进制 -->
  <text class="v" x="136" y="142">001</text>
  <text class="v" x="206" y="142">010</text>
  <text class="v" x="276" y="142">011</text>
  <text class="v" x="346" y="142">100</text>
  <text class="v" x="416" y="142">101</text>
  <text class="v" x="486" y="142">110</text>
  <text class="v" x="556" y="142">111</text>

  <!-- P1 分组：橙点表示该组包含哪些位 -->
  <text class="s" x="18" y="180">P1：1,3,5,7</text>
  <circle cx="153" cy="176" r="7" fill="#b06a00"/>
  <circle cx="293" cy="176" r="7" fill="#b06a00"/>
  <circle cx="433" cy="176" r="7" fill="#b06a00"/>
  <circle cx="573" cy="176" r="7" fill="#b06a00"/>

  <!-- P2 分组 -->
  <text class="s" x="18" y="222">P2：2,3,6,7</text>
  <circle cx="223" cy="218" r="7" fill="#b06a00"/>
  <circle cx="293" cy="218" r="7" fill="#b06a00"/>
  <circle cx="503" cy="218" r="7" fill="#b06a00"/>
  <circle cx="573" cy="218" r="7" fill="#b06a00"/>

  <!-- P4 分组 -->
  <text class="s" x="18" y="264">P4：4,5,6,7</text>
  <circle cx="363" cy="260" r="7" fill="#b06a00"/>
  <circle cx="433" cy="260" r="7" fill="#b06a00"/>
  <circle cx="503" cy="260" r="7" fill="#b06a00"/>
  <circle cx="573" cy="260" r="7" fill="#b06a00"/>
  <text class="n" x="612" y="180">← 橙点 = 该组</text>
  <text class="n" x="612" y="198">包含的位</text>

  <!-- 结论 -->
  <text class="n" x="18" y="306">校验位个数：先求最小的 r 使 2ʳ ≥ k + r + 1（k=4 时 r=3，因为 2³=8 ≥ 4+3+1=8）</text>
  <text class="n" x="18" y="328">分组规则：Pi 负责所有「位号的二进制第 i 位是 1」的位置 —— 上图三行就是 1、2、4 三个校验位各自的组</text>
  <text class="n" x="18" y="350">发送时：每组连同 Pi 一起做偶校验，算出 Pi 填进去；接收时各组重新异或得 G1、G2、G4</text>
  <text class="n" x="18" y="372">纠错：把 G4G2G1 拼成二进制读成十进制，就是出错位号；全 0 表示没错 —— 这就是「海明码能纠 1 位错」的原理</text>
  <text class="n" x="18" y="394">也能检 2 位错（码距 3），但只能纠 1 位：两位同时错时 G 值会指向一个无关位置，所以通常只用于纠 1 检 2</text>
  <text class="n" x="18" y="416">易混：P1/P2/P4 的位置是 2 的幂次（1、2、4），不是「从前往后每隔 1 个放一个」；数据位 D1~D4 只是按顺序填空位</text>
</svg>
