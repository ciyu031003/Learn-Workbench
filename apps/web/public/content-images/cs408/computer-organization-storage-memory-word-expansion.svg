<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" role="img" aria-label="字扩展：多片同规格芯片的数据线共用，用译码器分别给出片选来扩大字数">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.5}
    .y{fill:#eaf2fb;stroke:#2b2b2b;stroke-width:1.5}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 12px "Microsoft YaHei",system-ui,sans-serif;fill:#4a4a4a}
    .l{stroke:#2b2b2b;stroke-width:1.3;fill:none}
    .s{stroke:#b06a00;stroke-width:1.6;fill:none}
    .a{fill:#2b2b2b}
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06a00"/></marker>
  </defs>

  <text class="t" x="20" y="24">字扩展：4 片 8 位 × 2ⁿ 芯片 → 8 位 × 2ⁿ⁺²（数据线全部共用，用 2-4 译码器分配片选）</text>

  <!-- 译码器 -->
  <rect class="y" x="196" y="52" width="96" height="150" rx="3"/>
  <text class="t" x="206" y="78">2-4</text>
  <text class="t" x="206" y="98">译码器</text>
  <text class="n" x="206" y="130">高位地址</text>
  <text class="n" x="206" y="150">A(n)~</text>
  <text class="n" x="206" y="168">A(n+1)</text>

  <!-- 4 片 -->
  <rect class="b" x="380" y="46"  width="240" height="40" rx="3"/>
  <rect class="b" x="380" y="102" width="240" height="40" rx="3"/>
  <rect class="b" x="380" y="158" width="240" height="40" rx="3"/>
  <rect class="b" x="380" y="214" width="240" height="40" rx="3"/>
  <text class="n" x="396" y="71">芯片 0（CS₀）</text>
  <text class="n" x="396" y="127">芯片 1（CS₁）</text>
  <text class="n" x="396" y="183">芯片 2（CS₂）</text>
  <text class="n" x="396" y="239">芯片 3（CS₃）</text>

  <!-- 译码输出到片选 -->
  <path class="s" d="M292 68 L376 66" marker-end="url(#as)"/>
  <path class="s" d="M292 108 L376 122" marker-end="url(#as)"/>
  <path class="s" d="M292 148 L376 178" marker-end="url(#as)"/>
  <path class="s" d="M292 188 L376 234" marker-end="url(#as)"/>

  <!-- 公共低地址 + 公共数据 -->
  <path class="l" d="M60 130 L192 130" marker-end="url(#ad)"/>
  <text class="n" x="18" y="124">A₀~A(n−1)</text>
  <text class="n" x="18" y="150">四片共用</text>

  <path class="l" d="M60 274 L680 274"/>
  <path class="l" d="M620 254 L620 274"/>
  <text class="n" x="400" y="294">D₀~D₇ 四片共用（同时只有一片被选中）</text>

  <text class="n" x="16" y="316">判别口诀：数据线共用、片选用译码器分开 ⇒ 字扩展（增数量不增字长）</text>
</svg>
