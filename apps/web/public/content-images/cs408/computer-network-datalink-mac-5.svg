<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" font-family="'PingFang SC','Microsoft YaHei',sans-serif"><defs><style>.h{font-size:15px;font-weight:700;fill:#212529}.lbl{font-size:13px;fill:#343a40}.sub{font-size:12px;fill:#868e96}.val{font-size:12px;font-weight:700}.big{font-size:24px;font-weight:700}.axis{font-size:11px;fill:#868e96}.pos{fill:#2f9e44}.neg{fill:#e03131}.wave{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.grid{stroke:#dee2e6;stroke-width:1;stroke-dasharray:3 3}.base{stroke:#ced4da;stroke-width:1;stroke-dasharray:4 3}</style><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#495057"/></marker></defs><rect x="530" y="20" width="14" height="14" rx="2" fill="#e6f4ea" stroke="#2f9e44"/><text x="550" y="31" class="val pos">+1</text><rect x="590" y="20" width="14" height="14" rx="2" fill="#fdeaea" stroke="#e03131"/><text x="610" y="31" class="val neg">&#8722;1</text><text x="40" y="58" class="h">&#9312; 比特时间与码片 (chip)</text><path d="M120 82V76H560v6" fill="none" stroke="#adb5bd" stroke-width="1.2"/><text x="340" y="70" text-anchor="middle" class="sub">1 个比特时间</text><rect x="120" y="90" width="440" height="46" fill="#f1f3f5" stroke="#adb5bd"/><line x1="230" y1="90" x2="230" y2="136" stroke="#adb5bd"/><line x1="340" y1="90" x2="340" y2="136" stroke="#adb5bd"/><line x1="450" y1="90" x2="450" y2="136" stroke="#adb5bd"/><text x="175" y="118" text-anchor="middle" class="lbl">码片 1</text><text x="285" y="118" text-anchor="middle" class="lbl">码片 2</text><text x="395" y="118" text-anchor="middle" class="lbl">码片 3</text><text x="505" y="118" text-anchor="middle" class="lbl">码片 4</text><text x="120" y="162" class="sub">1 个比特时间被划分为 m 个短时间槽，每个称为一个码片；码片是 CDMA 的最小时间单位（本例 m = 4）。</text><text x="40" y="212" class="h">&#9313; 码片序列 S（每个站点唯一）</text><text x="100" y="252" class="lbl" font-weight="bold">S =</text><g><rect x="130" y="230" width="64" height="42" rx="3" fill="#e6f4ea" stroke="#2f9e44"/><text x="162" y="257" text-anchor="middle" class="val pos">+1</text><rect x="202" y="230" width="64" height="42" rx="3" fill="#fdeaea" stroke="#e03131"/><text x="234" y="257" text-anchor="middle" class="val neg">&#8722;1</text><rect x="274" y="230" width="64" height="42" rx="3" fill="#fdeaea" stroke="#e03131"/><text x="306" y="257" text-anchor="middle" class="val neg">&#8722;1</text><rect x="346" y="230" width="64" height="42" rx="3" fill="#e6f4ea" stroke="#2f9e44"/><text x="378" y="257" text-anchor="middle" class="val pos">+1</text></g><text x="430" y="248" class="sub">每个站点分配一个唯一的码片序列，</text><text x="430" y="264" class="sub">不同站点的序列相互正交。</text><text x="40" y="322" class="h">&#9314; 如何用码片序列表示比特 0 和 1</text><rect x="55" y="345" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#2f9e44" stroke-width="1.5"/><text x="78" y="378" text-anchor="middle" class="big pos">1</text><text x="78" y="408" text-anchor="middle" class="sub">比特 1</text><line x1="108" y1="368" x2="140" y2="368" stroke="#495057" stroke-width="1.5" marker-end="url(#ar)"/><text x="150" y="360" class="lbl">发送原码片序列</text><text x="150" y="380" class="lbl pos" font-weight="bold">S = (+1, &#8722;1, &#8722;1, +1)</text><line x1="370" y1="368" x2="650" y2="368" class="base"/><line x1="440" y1="350" x2="440" y2="410" class="grid"/><line x1="510" y1="350" x2="510" y2="410" class="grid"/><line x1="580" y1="350" x2="580" y2="410" class="grid"/><text x="360" y="354" text-anchor="end" class="axis">+1</text><text x="360" y="410" text-anchor="end" class="axis">&#8722;1</text><path class="wave" stroke="#2f9e44" d="M370 350h70v36H580V350h70"/><text x="405" y="345" text-anchor="middle" class="val pos">+1</text><text x="475" y="400" text-anchor="middle" class="val neg">&#8722;1</text><text x="545" y="400" text-anchor="middle" class="val neg">&#8722;1</text><text x="615" y="345" text-anchor="middle" class="val pos">+1</text><rect x="55" y="455" width="46" height="46" rx="4" fill="#fdeaea" stroke="#e03131" stroke-width="1.5"/><text x="78" y="488" text-anchor="middle" class="big neg">0</text><text x="78" y="518" text-anchor="middle" class="sub">比特 0</text><line x1="108" y1="478" x2="140" y2="478" stroke="#495057" stroke-width="1.5" marker-end="url(#ar)"/><text x="150" y="470" class="lbl">发送反码（各码片取反）</text><text x="150" y="490" class="lbl neg" font-weight="bold">S&#772; = (&#8722;1, +1, +1, &#8722;1)</text><line x1="370" y1="478" x2="650" y2="478" class="base"/><line x1="440" y1="460" x2="440" y2="520" class="grid"/><line x1="510" y1="460" x2="510" y2="520" class="grid"/><line x1="580" y1="460" x2="580" y2="520" class="grid"/><text x="360" y="464" text-anchor="end" class="axis">+1</text><text x="360" y="520" text-anchor="end" class="axis">&#8722;1</text><path class="wave" stroke="#e03131" d="M370 496h70V460H580v36h70"/><text x="405" y="510" text-anchor="middle" class="val neg">&#8722;1</text><text x="475" y="455" text-anchor="middle" class="val pos">+1</text><text x="545" y="455" text-anchor="middle" class="val pos">+1</text><text x="615" y="510" text-anchor="middle" class="val neg">&#8722;1</text><text x="150" y="552" class="sub">口诀：发 1 就发原序列，发 0 就发反码；比特 0/1 被“扩展”成一串 &#177;1 码片再送入信道。</text></svg>