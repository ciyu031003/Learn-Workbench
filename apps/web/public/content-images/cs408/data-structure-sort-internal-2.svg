<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Helvetica Neue', Arial, sans-serif"><rect width="780" height="420" fill="#fafafa" rx="12"/><line x1="100" y1="40" x2="100" y2="360" stroke="#e0e0e0" stroke-width="1"/><line x1="100" y1="360" x2="680" y2="360" stroke="#ccc" stroke-width="1.5"/><text x="100" y="377" text-anchor="middle" fill="#888" font-size="11">O(n)</text><text x="280" y="377" text-anchor="middle" fill="#888" font-size="11">O(n log n)</text><text x="460" y="377" text-anchor="middle" fill="#888" font-size="11">O(n^1.5)</text><text x="640" y="377" text-anchor="middle" fill="#888" font-size="11">O(n²)</text><line x1="280" y1="40" x2="280" y2="360" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="460" y1="40" x2="460" y2="360" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><line x1="640" y1="40" x2="640" y2="360" stroke="#e8e8e8" stroke-width="1" stroke-dasharray="4,3"/><text x="390" y="400" text-anchor="middle" fill="#aaa" font-size="11">元素移动次数量级（从少到多）</text><text x="96" y="73" text-anchor="end" fill="#444" font-size="13">选择排序</text><rect x="100" y="54" width="180" height="28" rx="5" fill="#4db6ac"/><text x="285" y="73" fill="#4db6ac" font-size="12" font-weight="bold">O(n)</text><text x="540" y="73" fill="#888" font-size="11">每轮仅交换一次，移动最少</text><text x="96" y="111" text-anchor="end" fill="#444" font-size="13">桶排序</text><rect x="100" y="92" width="180" height="28" rx="5" fill="#4db6ac"/><text x="285" y="111" fill="#4db6ac" font-size="12" font-weight="bold">O(n)</text><text x="540" y="111" fill="#888" font-size="11">复制入桶，不做原地交换</text><text x="96" y="149" text-anchor="end" fill="#444" font-size="13">归并排序</text><rect x="100" y="130" width="360" height="28" rx="5" fill="#5b9cf6"/><text x="465" y="149" fill="#5b9cf6" font-size="12" font-weight="bold">O(n log n)</text><text x="576" y="149" fill="#888" font-size="11">辅助数组复制</text><text x="96" y="187" text-anchor="end" fill="#444" font-size="13">堆排序</text><rect x="100" y="168" width="360" height="28" rx="5" fill="#5b9cf6"/><text x="465" y="187" fill="#5b9cf6" font-size="12" font-weight="bold">O(n log n)</text><text x="576" y="187" fill="#888" font-size="11">堆化时原地交换</text><text x="96" y="225" text-anchor="end" fill="#444" font-size="13">快速排序</text><rect x="100" y="206" width="360" height="28" rx="5" fill="#7986cb"/><rect x="460" y="206" width="180" height="28" rx="5" fill="none" stroke="#7986cb" stroke-width="1.5" stroke-dasharray="5,3"/><text x="465" y="225" fill="#7986cb" font-size="12" font-weight="bold">均 O(n log n)</text><text x="645" y="218" fill="#7986cb" font-size="10">最坏</text><text x="645" y="230" fill="#7986cb" font-size="10">O(n²)</text><text x="96" y="263" text-anchor="end" fill="#444" font-size="13">基数排序</text><rect x="100" y="244" width="270" height="28" rx="5" fill="#a29bfe"/><text x="375" y="263" fill="#a29bfe" font-size="12" font-weight="bold">O(n·d)</text><text x="455" y="263" fill="#888" font-size="11">按位多轮计数排序复制</text><text x="96" y="301" text-anchor="end" fill="#444" font-size="13">希尔排序</text><rect x="100" y="282" width="420" height="28" rx="5" fill="#ff9f43"/><text x="525" y="301" fill="#ff9f43" font-size="12" font-weight="bold">O(n^1.3 ~ 2)</text><text x="638" y="301" fill="#888" font-size="11">难以精确界定</text><text x="96" y="339" text-anchor="end" fill="#444" font-size="13">插入排序</text><rect x="100" y="320" width="540" height="28" rx="5" fill="#ef5350"/><text x="645" y="339" fill="#ef5350" font-size="12" font-weight="bold">O(n²)</text><rect x="100" y="390" width="560" height="22" rx="5" fill="#fff3cd" stroke="#f0c040" stroke-width="1"/><text x="380" y="405" text-anchor="middle" fill="#7a5c00" font-size="11">冒泡排序：最坏 O(n²)，每次交换移动两个元素，次数最多；选择排序 &amp; 桶排序移动次数最少</text><rect x="230" y="57" width="32" height="16" rx="4" fill="#00897b"/><text x="246" y="69" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">最少</text><rect x="555" y="323" width="32" height="16" rx="4" fill="#c62828"/><text x="571" y="335" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">较多</text></svg>