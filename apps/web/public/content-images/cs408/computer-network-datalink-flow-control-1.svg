<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1e3 700"><rect width="1e3" height="700" fill="none"/><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/></marker></defs><text x="500" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#2c3e50">ARQ 协议（Automatic Repeat reQuest）</text><text x="500" y="70" text-anchor="middle" font-size="16" fill="#7f8c8d">ACK 编号表示接收方下一次期望收到的帧</text><rect x="50" y="100" width="900" height="120" fill="#e8f4f8" stroke="#3498db" stroke-width="2" rx="10"/><text x="70" y="130" font-size="18" font-weight="bold" fill="#2c3e50">核心思想：</text><text x="90" y="155" font-size="14" fill="#2c3e50">• 发送方发送数据后，根据接收方返回的 ACK 判断数据是否正确到达</text><text x="90" y="175" font-size="14" fill="#2c3e50">• ACK = n 表示编号小于 n 的帧已按要求收到，下一帧期望收到编号 n</text><text x="90" y="195" font-size="14" fill="#2c3e50">• 超时或收到重复 ACK 时，发送方重传丢失或出错的数据</text><text x="500" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">三种主要 ARQ 协议</text><g><rect x="50" y="300" width="280" height="350" fill="#fff3cd" stroke="#f39c12" stroke-width="2" rx="8"/><text x="190" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#d68910">停等 ARQ</text><text x="190" y="350" text-anchor="middle" font-size="12" fill="#b7950b">（Stop-and-Wait）</text><line x1="120" y1="380" x2="120" y2="600" stroke="#34495e" stroke-width="2"/><line x1="260" y1="380" x2="260" y2="600" stroke="#34495e" stroke-width="2"/><text x="120" y="375" text-anchor="middle" font-size="12" fill="#2c3e50">发送方</text><text x="260" y="375" text-anchor="middle" font-size="12" fill="#2c3e50">接收方</text><line x1="120" y1="400" x2="250" y2="420" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/><text x="180" y="404" font-size="10" fill="#c0392b">数据帧 0</text><line x1="260" y1="440" x2="130" y2="460" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/><text x="190" y="444" font-size="10" fill="#229954">ACK 1</text><line x1="120" y1="480" x2="250" y2="500" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/><text x="180" y="484" font-size="10" fill="#c0392b">数据帧 1</text><line x1="260" y1="520" x2="130" y2="540" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/><text x="190" y="524" font-size="10" fill="#229954">ACK 2</text><text x="70" y="620" font-size="13" fill="#d68910">特点：发送一帧，等待对应确认</text><text x="70" y="635" font-size="13" fill="#d68910">效率较低，实现简单</text></g><g><rect x="360" y="300" width="280" height="350" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2" rx="8"/><text x="500" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#138496">回退 N 帧 ARQ</text><text x="500" y="350" text-anchor="middle" font-size="12" fill="#117a8b">（Go-Back-N）</text><line x1="430" y1="380" x2="430" y2="600" stroke="#34495e" stroke-width="2"/><line x1="570" y1="380" x2="570" y2="600" stroke="#34495e" stroke-width="2"/><text x="430" y="375" text-anchor="middle" font-size="12" fill="#2c3e50">发送方</text><text x="570" y="375" text-anchor="middle" font-size="12" fill="#2c3e50">接收方</text><line x1="430" y1="400" x2="560" y2="410" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="475" y="399" font-size="9" fill="#c0392b">帧 0</text><line x1="430" y1="415" x2="560" y2="425" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="475" y="414" font-size="9" fill="#c0392b">帧 1</text><line x1="430" y1="430" x2="560" y2="440" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="475" y="429" font-size="9" fill="#c0392b">帧 2</text><line x1="430" y1="445" x2="520" y2="455" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,5"/><text x="470" y="447" font-size="9" fill="#c0392b">帧 3 丢失</text><line x1="430" y1="465" x2="560" y2="475" stroke="#95a5a6" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="465" y="465" font-size="9" fill="#7f8c8d">帧 4、5 被丢弃</text><line x1="570" y1="495" x2="440" y2="505" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/><text x="482" y="494" font-size="10" fill="#229954">ACK 3</text><line x1="570" y1="510" x2="440" y2="520" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="480" y="527" font-size="9" fill="#229954">重复 ACK 3</text><line x1="430" y1="545" x2="560" y2="555" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/><text x="455" y="543" font-size="9" fill="#d68910">重传帧 3、4、5……</text><text x="380" y="620" font-size="13" fill="#138496">特点：采用累计确认</text><text x="380" y="635" font-size="13" fill="#138496">丢帧后从缺失帧开始回退重传</text></g><g><rect x="670" y="300" width="280" height="350" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="8"/><text x="810" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#155724">选择性重传 ARQ</text><text x="810" y="350" text-anchor="middle" font-size="12" fill="#0f5132">（Selective Repeat）</text><line x1="740" y1="380" x2="740" y2="600" stroke="#34495e" stroke-width="2"/><line x1="880" y1="380" x2="880" y2="600" stroke="#34495e" stroke-width="2"/><text x="740" y="375" text-anchor="middle" font-size="12" fill="#2c3e50">发送方</text><text x="880" y="375" text-anchor="middle" font-size="12" fill="#2c3e50">接收方</text><line x1="740" y1="400" x2="870" y2="410" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="785" y="399" font-size="9" fill="#c0392b">帧 0</text><line x1="740" y1="415" x2="870" y2="425" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="785" y="414" font-size="9" fill="#c0392b">帧 1</text><line x1="740" y1="430" x2="830" y2="440" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="5,5"/><text x="775" y="432" font-size="9" fill="#c0392b">帧 2 丢失</text><line x1="740" y1="450" x2="870" y2="460" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="770" y="450" font-size="9" fill="#c0392b">帧 3 到达并缓存</text><line x1="880" y1="480" x2="750" y2="485" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="800" y="477" font-size="9" fill="#229954">ACK 1</text><line x1="880" y1="495" x2="750" y2="500" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="800" y="492" font-size="9" fill="#229954">ACK 2</text><line x1="880" y1="515" x2="750" y2="520" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrowhead)"/><text x="760" y="512" font-size="9" fill="#229954">ACK 2 + SACK 3</text><line x1="740" y1="545" x2="870" y2="555" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/><text x="780" y="543" font-size="10" fill="#d68910">只重传帧 2</text><line x1="880" y1="575" x2="750" y2="580" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/><text x="800" y="573" font-size="10" fill="#229954">ACK 4</text><text x="690" y="620" font-size="13" fill="#155724">特点：缓存失序帧，只重传缺失帧</text><text x="690" y="635" font-size="13" fill="#155724">效率最高，实现最复杂</text></g><rect x="360" y="665" width="590" height="22" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="1" rx="5"/><text x="655" y="681" text-anchor="middle" font-size="13" fill="#2d3436">回退 N 帧与选择性重传均属于连续 ARQ；图中 ACK 采用“下一期待帧编号”语义</text></svg>