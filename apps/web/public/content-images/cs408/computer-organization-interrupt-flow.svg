<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="中断处理流程：主程序运行中收到中断请求，判优后由硬件完成响应并保存断点，执行中断服务程序，最后恢复现场返回断点">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .q{font:600 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .box{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.4}
    .hw{fill:#fde3c8;stroke:#b06a00;stroke-width:1.4}
    .sw{fill:#d8ecd0;stroke:#3f7a34;stroke-width:1.4}
    .dm{fill:#fff;stroke:#2b2b2b;stroke-width:1.3}
    .ar{stroke:#2b2b2b;stroke-width:1.5;fill:none}
    .yn{font:600 10.5px "Microsoft YaHei",system-ui,sans-serif;fill:#b06a00}
    .tag{font:600 10.5px "Microsoft YaHei",system-ui,sans-serif;fill:#7a4a00}
  </style>

  <text class="t" x="18" y="26">中断处理流程：哪些是硬件做的，哪些是软件做的</text>
  <text class="n" x="18" y="46">橙色 = 硬件（中断隐指令自动完成），绿色 = 软件（中断服务程序）</text>

  <!-- 主程序 -->
  <rect class="box" x="120" y="60" width="220" height="40" rx="6"/>
  <text class="s" x="230" y="85" text-anchor="middle">主程序运行</text>

  <!-- 中断请求判断 -->
  <polygon class="dm" points="230,116 310,146 230,176 150,146"/>
  <text class="q" x="230" y="150" text-anchor="middle">有中断请求？</text>

  <!-- 判优 -->
  <rect class="hw" x="120" y="196" width="220" height="44" rx="6"/>
  <text class="s" x="230" y="215" text-anchor="middle">中断判优</text>
  <text class="n" x="230" y="232" text-anchor="middle">选出优先级最高的请求</text>

  <!-- 响应 -->
  <rect class="hw" x="120" y="258" width="220" height="60" rx="6"/>
  <text class="s" x="230" y="277" text-anchor="middle">响应（中断隐指令）</text>
  <text class="n" x="230" y="295" text-anchor="middle">关中断、保存断点 PC</text>
  <text class="n" x="230" y="311" text-anchor="middle">转入服务程序入口</text>

  <!-- 服务 -->
  <rect class="sw" x="120" y="336" width="220" height="44" rx="6"/>
  <text class="s" x="230" y="355" text-anchor="middle">执行中断服务程序</text>
  <text class="n" x="230" y="372" text-anchor="middle">保护现场、具体 I/O 处理</text>

  <!-- 返回 -->
  <rect class="sw" x="120" y="398" width="220" height="44" rx="6"/>
  <text class="s" x="230" y="417" text-anchor="middle">恢复现场、开中断、返回</text>
  <text class="n" x="230" y="434" text-anchor="middle">回到断点继续执行</text>

  <!-- 连线 -->
  <path class="ar" d="M230 100 V116" marker-end="url(#a)"/>
  <path class="ar" d="M230 176 V196" marker-end="url(#a)"/>
  <text class="yn" x="238" y="190">是</text>
  <path class="ar" d="M230 240 V258" marker-end="url(#a)"/>
  <path class="ar" d="M230 318 V336" marker-end="url(#a)"/>
  <path class="ar" d="M230 380 V398" marker-end="url(#a)"/>

  <!-- 无请求分支 -->
  <path class="ar" d="M310 146 H360 V80 H340" marker-end="url(#a)"/>
  <text class="yn" x="316" y="140">否</text>

  <!-- 返回主程序 -->
  <path class="ar" d="M120 420 H90 V80 H120" marker-end="url(#a)"/>

  <!-- 右侧注释 -->
  <text class="n" x="392" y="140">没有请求就继续执行主程序；</text>
  <text class="n" x="392" y="158">中断是异步的，随时可能来。</text>

  <text class="n" x="392" y="214">多个请求同时到达时，由</text>
  <text class="n" x="392" y="232">硬件排队器按优先级选一个。</text>

  <text class="n" x="392" y="282">"中断隐指令"不是一条真指令，</text>
  <text class="n" x="392" y="300">是硬件在响应时自动完成的一组操作，</text>
  <text class="n" x="392" y="318">断点（下一条指令地址）由此保存。</text>

  <text class="n" x="392" y="358">服务程序是软件；若允许嵌套，</text>
  <text class="n" x="392" y="376">更高优先级的中断可打断它（多重中断）。</text>

  <text class="n" x="392" y="420">恢复现场与断点后返回，</text>
  <text class="n" x="392" y="438">主程序从"被打断的那条指令之后"继续。</text>

  <!-- 底部 -->
  <text class="n" x="18" y="462">中断（外中断）与异常（内中断）的响应流程相同，区别在来源：外中断异步、与当前指令无关；异常由当前指令执行引起（如缺页、除零）。</text>
</svg>
