<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="单缓冲与双缓冲的时间轴：单缓冲中设备输入与 CPU 处理重叠、但拷贝期间缓冲区不能接收；双缓冲中设备输入与拷贝加处理完全重叠">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .c{font:600 10.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .ln{stroke:#94a3b8;stroke-width:1;fill:none}
    .tb{fill:#cfe3f7;stroke:#2563eb;stroke-width:1.2}
    .mb{fill:#fde3c8;stroke:#b06a00;stroke-width:1.2}
    .cb{fill:#d8ecd0;stroke:#3f7a34;stroke-width:1.2}
    .ax{stroke:#475569;stroke-width:1.2;fill:none}
  </style>

  <text class="t" x="18" y="26">单缓冲 vs 双缓冲：把"谁和谁能重叠"画在时间轴上</text>
  <text class="n" x="18" y="46">设 T=100 μs（磁盘→缓冲区）、M=20 μs（缓冲区→用户区）、C=50 μs（CPU 处理），画前 3 块</text>

  <!-- 图例 -->
  <rect class="tb" x="480" y="6" width="26" height="14" rx="3"/><text class="n" x="512" y="17">设备输入 T</text>
  <rect class="mb" x="590" y="6" width="26" height="14" rx="3"/><text class="n" x="622" y="17">拷贝 M</text>
  <rect class="cb" x="680" y="6" width="26" height="14" rx="3"/><text class="n" x="712" y="17">处理 C</text>

  <!-- 单缓冲 -->
  <text class="s" x="18" y="76">① 单缓冲：T 与 C 能重叠，但 M 期间缓冲区腾不出来</text>
  <text class="n" x="118" y="96" text-anchor="end">设备→缓冲 T</text>
  <rect class="tb" x="120" y="84" width="170" height="18" rx="3"/><text class="c" x="205" y="97" text-anchor="middle">T1</text>
  <rect class="tb" x="324" y="84" width="170" height="18" rx="3"/><text class="c" x="409" y="97" text-anchor="middle">T2</text>
  <rect class="tb" x="528" y="84" width="170" height="18" rx="3"/><text class="c" x="613" y="97" text-anchor="middle">T3</text>

  <text class="n" x="118" y="120" text-anchor="end">缓冲→用户 M</text>
  <rect class="mb" x="290" y="108" width="34" height="18" rx="3"/><text class="c" x="307" y="121" text-anchor="middle">M1</text>
  <rect class="mb" x="494" y="108" width="34" height="18" rx="3"/><text class="c" x="511" y="121" text-anchor="middle">M2</text>

  <text class="n" x="118" y="144" text-anchor="end">CPU 处理 C</text>
  <rect class="cb" x="324" y="132" width="85" height="18" rx="3"/><text class="c" x="366" y="145" text-anchor="middle">C1</text>
  <rect class="cb" x="494" y="132" width="85" height="18" rx="3"/><text class="c" x="536" y="145" text-anchor="middle">C2</text>
  <text class="n" x="366" y="166" text-anchor="middle">C1 与 T2 重叠</text>

  <!-- 双缓冲 -->
  <text class="s" x="18" y="196">② 双缓冲：一块在输入，另一块在"拷贝 + 处理"，设备不必等</text>
  <text class="n" x="118" y="216" text-anchor="end">设备→缓冲 T</text>
  <rect class="tb" x="120" y="204" width="170" height="18" rx="3"/><text class="c" x="205" y="217" text-anchor="middle">T1</text>
  <rect class="tb" x="290" y="204" width="170" height="18" rx="3"/><text class="c" x="375" y="217" text-anchor="middle">T2</text>
  <rect class="tb" x="460" y="204" width="170" height="18" rx="3"/><text class="c" x="545" y="217" text-anchor="middle">T3</text>

  <text class="n" x="118" y="240" text-anchor="end">缓冲→用户 M</text>
  <rect class="mb" x="290" y="228" width="34" height="18" rx="3"/><text class="c" x="307" y="241" text-anchor="middle">M1</text>
  <rect class="mb" x="460" y="228" width="34" height="18" rx="3"/><text class="c" x="477" y="241" text-anchor="middle">M2</text>

  <text class="n" x="118" y="264" text-anchor="end">CPU 处理 C</text>
  <rect class="cb" x="324" y="252" width="85" height="18" rx="3"/><text class="c" x="366" y="265" text-anchor="middle">C1</text>
  <rect class="cb" x="494" y="252" width="85" height="18" rx="3"/><text class="c" x="536" y="265" text-anchor="middle">C2</text>
  <text class="n" x="366" y="286" text-anchor="middle">M1+C1 与 T2 重叠</text>

  <!-- 时间轴 -->
  <path class="ax" d="M120 286 V296 M290 286 V296 M460 286 V296 M630 286 V296"/>
  <path class="ax" d="M120 296 H700" marker-end="url(#ar)"/>
  <text class="n" x="120" y="314" text-anchor="middle">0</text>
  <text class="n" x="290" y="314" text-anchor="middle">100</text>
  <text class="n" x="460" y="314" text-anchor="middle">200</text>
  <text class="n" x="630" y="314" text-anchor="middle">300 t/μs</text>

  <!-- 结论 -->
  <text class="n" x="18" y="342">单缓冲：第 1 块 100+20+50=170 μs；之后每块 max(T,C)+M=120 μs，10 块共 <tspan font-weight="600">1250 μs</tspan>。</text>
  <text class="n" x="18" y="362">双缓冲：每块 max(T, M+C)=100 μs，10 块共 10×100+70=<tspan font-weight="600">1070 μs</tspan>，比单缓冲少 180 μs。</text>
  <text class="n" x="18" y="384">关键差别：单缓冲里 <tspan font-weight="600">M 期间缓冲区被占用</tspan>，设备只能等；双缓冲让"输入"与"拷贝+处理"各用一块，才真正并行。</text>
  <text class="n" x="18" y="406">注意：双缓冲只在 T ≥ M+C（设备是瓶颈）时才有明显收益；若 CPU 处理慢，瓶颈就转到 CPU。</text>
</svg>
