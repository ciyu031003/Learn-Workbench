<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="Arial, sans-serif"><style>.title{font-weight:700;fill:#2c3e50}.node{fill:#ecf0f1;stroke:#34495e;stroke-width:1.5}.nodeX{fill:#e74c3c;stroke:#c0392b;stroke-width:1.5}.link{stroke:#34495e;stroke-width:2}.dead{stroke:#e74c3c;stroke-width:3;stroke-dasharray:6 5}.lbl{font-size:14px;fill:#2c3e50}.stage{font-weight:700;fill:#2c3e50;font-size:13px}.arrow{fill:#2980b9}.hop{font-size:12px;fill:#2c3e50}.bad{font-size:12px;fill:#c0392b;font-weight:700}</style><text x="440" y="28" text-anchor="middle" font-size="20" class="title">RIP 坏消息传得慢 — 计数到无穷 (count to infinity)</text><text x="440" y="50" text-anchor="middle" font-size="12" fill="#7f8c8d">拓扑：A — B — C — X，初始所有节点都能到达 X</text><g transform="translate(0,70)"><text x="20" y="20" class="stage">阶段 1：链路正常</text><g transform="translate(40,40)"><circle cx="40" cy="40" r="22" class="node"/><text x="40" y="45" text-anchor="middle" class="lbl">A</text><circle cx="140" cy="40" r="22" class="node"/><text x="140" y="45" text-anchor="middle" class="lbl">B</text><circle cx="240" cy="40" r="22" class="node"/><text x="240" y="45" text-anchor="middle" class="lbl">C</text><circle cx="340" cy="40" r="22" class="node"/><text x="340" y="45" text-anchor="middle" class="lbl">X</text><line x1="62" y1="40" x2="118" y2="40" class="link"/><line x1="162" y1="40" x2="218" y2="40" class="link"/><line x1="262" y1="40" x2="318" y2="40" class="link"/><text x="40" y="90" text-anchor="middle" class="hop">到 X：3 跳</text><text x="140" y="90" text-anchor="middle" class="hop">到 X：2 跳</text><text x="240" y="90" text-anchor="middle" class="hop">到 X：1 跳</text></g><text x="470" y="20" class="stage">阶段 2：C—X 断开，C 设为 16</text><g transform="translate(490,40)"><circle cx="40" cy="40" r="22" class="node"/><text x="40" y="45" text-anchor="middle" class="lbl">A</text><circle cx="140" cy="40" r="22" class="node"/><text x="140" y="45" text-anchor="middle" class="lbl">B</text><circle cx="240" cy="40" r="22" class="nodeX"/><text x="240" y="45" text-anchor="middle" class="lbl" fill="#fff">C</text><circle cx="340" cy="40" r="22" class="node"/><text x="340" y="45" text-anchor="middle" class="lbl">X</text><line x1="62" y1="40" x2="118" y2="40" class="link"/><line x1="162" y1="40" x2="218" y2="40" class="link"/><line x1="262" y1="40" x2="318" y2="40" class="dead"/><text x="290" y="28" text-anchor="middle" class="bad">✗ 断开</text><text x="40" y="90" text-anchor="middle" class="hop">仍认为 3 跳</text><text x="140" y="90" text-anchor="middle" class="hop">仍认为 2 跳</text><text x="240" y="90" text-anchor="middle" class="bad">到 X：16 (不可达)</text></g></g><g transform="translate(0,260)"><text x="20" y="20" class="stage">阶段 3：B 听 A 说"我能 3 跳到 X"，B 更新为 4</text><g transform="translate(40,40)"><circle cx="40" cy="40" r="22" class="node"/><text x="40" y="45" text-anchor="middle" class="lbl">A</text><circle cx="140" cy="40" r="22" class="node"/><text x="140" y="45" text-anchor="middle" class="lbl">B</text><circle cx="240" cy="40" r="22" class="nodeX"/><text x="240" y="45" text-anchor="middle" class="lbl" fill="#fff">C</text><circle cx="340" cy="40" r="22" class="node"/><text x="340" y="45" text-anchor="middle" class="lbl">X</text><line x1="62" y1="40" x2="118" y2="40" class="link"/><line x1="162" y1="40" x2="218" y2="40" class="link"/><line x1="262" y1="40" x2="318" y2="40" class="dead"/><path d="M62 30q38-25 76 0" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a1)"/><text x="100" y="5" text-anchor="middle" class="hop" fill="#2980b9">"我 3 跳到 X"</text><text x="40" y="90" text-anchor="middle" class="hop">到 X：3 跳 (经 B)</text><text x="140" y="90" text-anchor="middle" class="bad">B 更新：4 跳 (经 A)</text></g><text x="470" y="20" class="stage">阶段 4：A、B 互相加 1 直到 16</text><g transform="translate(490,40)"><circle cx="40" cy="40" r="22" class="node"/><text x="40" y="45" text-anchor="middle" class="lbl">A</text><circle cx="140" cy="40" r="22" class="node"/><text x="140" y="45" text-anchor="middle" class="lbl">B</text><circle cx="240" cy="40" r="22" class="nodeX"/><text x="240" y="45" text-anchor="middle" class="lbl" fill="#fff">C</text><circle cx="340" cy="40" r="22" class="node"/><text x="340" y="45" text-anchor="middle" class="lbl">X</text><line x1="62" y1="40" x2="118" y2="40" class="link"/><line x1="162" y1="40" x2="218" y2="40" class="link"/><line x1="262" y1="40" x2="318" y2="40" class="dead"/><path d="M62 30q38-25 76 0" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a1)"/><path d="M138 50q-38 25-76 0" fill="none" stroke="#2980b9" stroke-width="1.5" marker-end="url(#a1)"/><text x="100" y="0" text-anchor="middle" class="hop" fill="#2980b9">"我 5 跳到 X"</text><text x="100" y="92" text-anchor="middle" class="hop" fill="#2980b9">"我 6 跳到 X"</text></g></g><g transform="translate(60,440)"><text x="0" y="0" class="stage">A、B 跳数演化：</text><text x="0" y="22" font-size="13" fill="#2c3e50">3 → 4 → 5 → 6 → 7 → ... → 15 →<tspan fill="#c0392b" font-weight="bold">16 (不可达)</tspan>， 才停止</text><text x="0" y="44" font-size="12" fill="#7f8c8d">RIP 周期 30s 广播一次，每周期才递增一次 → 收敛极慢，这就是 "坏消息传得慢"</text></g><defs><marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2980b9"/></marker></defs></svg>