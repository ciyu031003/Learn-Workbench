<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13"><style>.title{font-weight:700;font-size:13px}.lbl{font-size:11px;fill:#555}.cell{fill:#fff;stroke:#333}.piv{fill:#ffe0b2;stroke:#e65100;stroke-width:2}.less{fill:#e3f2fd;stroke:#1565c0}.ge{fill:#fce4ec;stroke:#c2185b}.moved{fill:#e8f5e9;stroke:#2e7d32}.ptrL{fill:#1565c0;font-weight:700}.ptrR{fill:#c2185b;font-weight:700}</style><defs><marker id="aL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1565c0"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c2185b"/></marker></defs><text x="410" y="22" text-anchor="middle" font-weight="700" font-size="14" dominant-baseline="central">快速排序 partition 双指针：以 [5, 3, 8, 1, 9, 4, 7, 2] 为例（pivot = 5）</text><g transform="translate(60,55)" font-size="11" fill="#888"><text x="-15" y="0" dominant-baseline="central">下标</text><text x="20" y="0" text-anchor="middle" dominant-baseline="central">0</text><text x="60" y="0" text-anchor="middle" dominant-baseline="central">1</text><text x="100" y="0" text-anchor="middle" dominant-baseline="central">2</text><text x="140" y="0" text-anchor="middle" dominant-baseline="central">3</text><text x="180" y="0" text-anchor="middle" dominant-baseline="central">4</text><text x="220" y="0" text-anchor="middle" dominant-baseline="central">5</text><text x="260" y="0" text-anchor="middle" dominant-baseline="central">6</text><text x="300" y="0" text-anchor="middle" dominant-baseline="central">7</text></g><g transform="translate(60,80)"><text class="title" x="-50" y="15" fill="#444" dominant-baseline="central">Step 0</text><rect class="piv" x="0" y="0" width="40" height="30"/><text x="20" y="15" text-anchor="middle" dominant-baseline="central">5</text><rect class="cell" x="40" y="0" width="40" height="30"/><text x="60" y="15" text-anchor="middle" dominant-baseline="central">3</text><rect class="cell" x="80" y="0" width="40" height="30"/><text x="100" y="15" text-anchor="middle" dominant-baseline="central">8</text><rect class="cell" x="120" y="0" width="40" height="30"/><text x="140" y="15" text-anchor="middle" dominant-baseline="central">1</text><rect class="cell" x="160" y="0" width="40" height="30"/><text x="180" y="15" text-anchor="middle" dominant-baseline="central">9</text><rect class="cell" x="200" y="0" width="40" height="30"/><text x="220" y="15" text-anchor="middle" dominant-baseline="central">4</text><rect class="cell" x="240" y="0" width="40" height="30"/><text x="260" y="15" text-anchor="middle" dominant-baseline="central">7</text><rect class="cell" x="280" y="0" width="40" height="30"/><text x="300" y="15" text-anchor="middle" dominant-baseline="central">2</text><text class="ptrL" x="20" y="-12" text-anchor="middle" dominant-baseline="central">l</text><text class="ptrR" x="300" y="-12" text-anchor="middle" dominant-baseline="central">r</text><line x1="20" y1="-4" x2="20" y2="0" stroke="#1565c0" marker-end="url(#aL)"/><line x1="300" y1="-4" x2="300" y2="0" stroke="#c2185b" marker-end="url(#aR)"/><text class="lbl" x="340" y="15" dominant-baseline="central">取 a[low]=5 为 pivot，l=0, r=7</text></g><g transform="translate(60,140)"><text class="title" x="-50" y="15" fill="#444" dominant-baseline="central">Step 1</text><rect class="piv" x="0" y="0" width="40" height="30"/><text x="20" y="15" text-anchor="middle" dominant-baseline="central">5</text><rect class="cell" x="40" y="0" width="40" height="30"/><text x="60" y="15" text-anchor="middle" dominant-baseline="central">3</text><rect class="cell" x="80" y="0" width="40" height="30"/><text x="100" y="15" text-anchor="middle" dominant-baseline="central">8</text><rect class="cell" x="120" y="0" width="40" height="30"/><text x="140" y="15" text-anchor="middle" dominant-baseline="central">1</text><rect class="cell" x="160" y="0" width="40" height="30"/><text x="180" y="15" text-anchor="middle" dominant-baseline="central">9</text><rect class="cell" x="200" y="0" width="40" height="30"/><text x="220" y="15" text-anchor="middle" dominant-baseline="central">4</text><rect class="cell" x="240" y="0" width="40" height="30"/><text x="260" y="15" text-anchor="middle" dominant-baseline="central">7</text><rect class="cell" x="280" y="0" width="40" height="30" stroke-width="2" stroke="#c2185b"/><text x="300" y="15" text-anchor="middle" dominant-baseline="central">2</text><text class="ptrL" x="20" y="-12" text-anchor="middle" dominant-baseline="central">l</text><text class="ptrR" x="300" y="-12" text-anchor="middle" dominant-baseline="central">r</text><text class="lbl" x="340" y="15" dominant-baseline="central">r 自右向左找 &lt; 5 的值：停在 a[7]=2</text></g><g transform="translate(60,200)"><text class="title" x="-50" y="15" fill="#444" dominant-baseline="central">Step 2</text><rect class="moved" x="0" y="0" width="40" height="30"/><text x="20" y="15" text-anchor="middle" dominant-baseline="central">2</text><rect class="cell" x="40" y="0" width="40" height="30"/><text x="60" y="15" text-anchor="middle" dominant-baseline="central">3</text><rect class="cell" x="80" y="0" width="40" height="30"/><text x="100" y="15" text-anchor="middle" dominant-baseline="central">8</text><rect class="cell" x="120" y="0" width="40" height="30"/><text x="140" y="15" text-anchor="middle" dominant-baseline="central">1</text><rect class="cell" x="160" y="0" width="40" height="30"/><text x="180" y="15" text-anchor="middle" dominant-baseline="central">9</text><rect class="cell" x="200" y="0" width="40" height="30"/><text x="220" y="15" text-anchor="middle" dominant-baseline="central">4</text><rect class="cell" x="240" y="0" width="40" height="30"/><text x="260" y="15" text-anchor="middle" dominant-baseline="central">7</text><rect class="moved" x="280" y="0" width="40" height="30"/><text x="300" y="15" text-anchor="middle" dominant-baseline="central">5</text><text class="ptrL" x="20" y="-12" text-anchor="middle" dominant-baseline="central">l</text><text class="ptrR" x="300" y="-12" text-anchor="middle" dominant-baseline="central">r</text><path d="M40 15c120-45 240-45 240-5" stroke="#2e7d32" fill="none" stroke-dasharray="4 3"/><text class="lbl" x="340" y="15" dominant-baseline="central">交换 a[l] ↔ a[r]：2 放到左端，5 暂置右端</text></g><g transform="translate(60,260)"><text class="title" x="-50" y="15" fill="#444" dominant-baseline="central">Step 3</text><rect class="moved" x="0" y="0" width="40" height="30"/><text x="20" y="15" text-anchor="middle" dominant-baseline="central">2</text><rect class="cell" x="40" y="0" width="40" height="30"/><text x="60" y="15" text-anchor="middle" dominant-baseline="central">3</text><rect class="cell" x="80" y="0" width="40" height="30" stroke-width="2" stroke="#1565c0"/><text x="100" y="15" text-anchor="middle" dominant-baseline="central">8</text><rect class="cell" x="120" y="0" width="40" height="30"/><text x="140" y="15" text-anchor="middle" dominant-baseline="central">1</text><rect class="cell" x="160" y="0" width="40" height="30"/><text x="180" y="15" text-anchor="middle" dominant-baseline="central">9</text><rect class="cell" x="200" y="0" width="40" height="30"/><text x="220" y="15" text-anchor="middle" dominant-baseline="central">4</text><rect class="cell" x="240" y="0" width="40" height="30"/><text x="260" y="15" text-anchor="middle" dominant-baseline="central">7</text><rect class="moved" x="280" y="0" width="40" height="30"/><text x="300" y="15" text-anchor="middle" dominant-baseline="central">5</text><text class="ptrL" x="100" y="-12" text-anchor="middle" dominant-baseline="central">l</text><text class="ptrR" x="300" y="-12" text-anchor="middle" dominant-baseline="central">r</text><text class="lbl" x="340" y="15" dominant-baseline="central">l 自左向右找 &gt; 5 的值：停在 a[2]=8</text></g><g transform="translate(60,320)"><text class="title" x="-50" y="15" fill="#444" dominant-baseline="central">Step 4</text><rect class="moved" x="0" y="0" width="40" height="30"/><text x="20" y="15" text-anchor="middle" dominant-baseline="central">2</text><rect class="cell" x="40" y="0" width="40" height="30"/><text x="60" y="15" text-anchor="middle" dominant-baseline="central">3</text><rect class="moved" x="80" y="0" width="40" height="30"/><text x="100" y="15" text-anchor="middle" dominant-baseline="central">5</text><rect class="cell" x="120" y="0" width="40" height="30"/><text x="140" y="15" text-anchor="middle" dominant-baseline="central">1</text><rect class="cell" x="160" y="0" width="40" height="30"/><text x="180" y="15" text-anchor="middle" dominant-baseline="central">9</text><rect class="cell" x="200" y="0" width="40" height="30"/><text x="220" y="15" text-anchor="middle" dominant-baseline="central">4</text><rect class="cell" x="240" y="0" width="40" height="30"/><text x="260" y="15" text-anchor="middle" dominant-baseline="central">7</text><rect class="moved" x="280" y="0" width="40" height="30"/><text x="300" y="15" text-anchor="middle" dominant-baseline="central">8</text><text class="ptrL" x="100" y="-12" text-anchor="middle" dominant-baseline="central">l</text><text class="ptrR" x="300" y="-12" text-anchor="middle" dominant-baseline="central">r</text><path d="M1e2 15c90-45 180-45 180-5" stroke="#2e7d32" fill="none" stroke-dasharray="4 3"/><text class="lbl" x="340" y="15" dominant-baseline="central">交换 a[l] ↔ a[r]：8 放到右端，5 回到中部</text></g><g transform="translate(60,380)"><text class="title" x="-50" y="15" fill="#444" dominant-baseline="central">Step 5</text><rect class="moved" x="0" y="0" width="40" height="30"/><text x="20" y="15" text-anchor="middle" dominant-baseline="central">2</text><rect class="cell" x="40" y="0" width="40" height="30"/><text x="60" y="15" text-anchor="middle" dominant-baseline="central">3</text><rect class="moved" x="80" y="0" width="40" height="30"/><text x="100" y="15" text-anchor="middle" dominant-baseline="centra