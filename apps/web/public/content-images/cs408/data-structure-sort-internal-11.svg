h="40" height="30"/><text x="260" y="15" text-anchor="middle" dominant-baseline="central">7</text><rect class="moved" x="280" y="0" width="40" height="30"/><text x="300" y="15" text-anchor="middle" dominant-baseline="central">8</text><text class="ptrL" x="180" y="-12" text-anchor="middle" dominant-baseline="central">l</text><text class="ptrR" x="220" y="-12" text-anchor="middle" dominant-baseline="central">r</text><path d="M1e2 15c60-40 120-40 120-5" stroke="#2e7d32" fill="none" stroke-dasharray="4 3"/><text class="lbl" x="340" y="15" dominant-baseline="central">交换后 l 继续右移，停在 a[4]=9</text></g><g transform="translate(60,500)"><text class="title" x="-50" y="15" fill="#444" dominant-baseline="central">最终</text><rect class="less" x="0" y="0" width="40" height="30"/><text x="20" y="15" text-anchor="middle" dominant-baseline="central">2</text><rect class="less" x="40" y="0" width="40" height="30"/><text x="60" y="15" text-anchor="middle" dominant-baseline="central">3</text><rect class="less" x="80" y="0" width="40" height="30"/><text x="100" y="15" text-anchor="middle" dominant-baseline="central">4</text><rect class="less" x="120" y="0" width="40" height="30"/><text x="140" y="15" text-anchor="middle" dominant-baseline="central">1</text><rect class="piv" x="160" y="0" width="40" height="30"/><text x="180" y="15" text-anchor="middle" dominant-baseline="central">5</text><rect class="ge" x="200" y="0" width="40" height="30"/><text x="220" y="15" text-anchor="middle" dominant-baseline="central">9</text><rect class="ge" x="240" y="0" width="40" height="30"/><text x="260" y="15" text-anchor="middle" dominant-baseline="central">7</text><rect class="ge" x="280" y="0" width="40" height="30"/><text x="300" y="15" text-anchor="middle" dominant-baseline="central">8</text><text class="lbl" x="340" y="15" dominant-baseline="central">交换 9 和 5：pivot 落到下标 4，左侧 &lt; 5，右侧 &gt; 5</text></g><g transform="translate(480,53)" font-size="11"><rect class="piv" x="0" y="0" width="14" height="14"/><