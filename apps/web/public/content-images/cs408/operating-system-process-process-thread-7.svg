<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" font-family="Microsoft Yahei, sans-serif" font-size="13"><defs><marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#333"/></marker></defs><style>.title{font-weight:700;font-size:15px}.kernel{fill:#ef9a9a;stroke:#b71c1c}.stack{fill:#ffe082;stroke:#f57f17}.mmap{fill:#ce93d8;stroke:#6a1b9a}.heap{fill:#a5d6a7;stroke:#1b5e20}.bss{fill:#90caf9;stroke:#0d47a1}.data{fill:#80deea;stroke:#006064}.text{fill:#bcaaa4;stroke:#3e2723}.small{font-size:11px;fill:#444}.mono{font-family:Menlo,Consolas,monospace;font-size:11px}</style><text x="380" y="26" text-anchor="middle" class="title">进程虚拟地址空间布局（32 位 Linux 典型视图）</text><g transform="translate(220,50)"><rect x="0" y="0" width="220" height="50" class="kernel"/><text x="110" y="22" text-anchor="middle" font-weight="bold">内核空间 (Kernel)</text><text x="110" y="40" text-anchor="middle" class="small">所有进程共享，用户态不可访问</text><rect x="0" y="60" width="220" height="80" class="stack"/><text x="110" y="84" text-anchor="middle" font-weight="bold">栈 (Stack)</text><text x="110" y="102" text-anchor="middle" class="small">函数调用帧、局部变量</text><text x="110" y="120" text-anchor="middle" class="small">向下增长 ↓ ，ESP/SP 指向栈顶</text><rect x="0" y="150" width="220" height="40" fill="#eceff1"/><text x="110" y="174" text-anchor="middle" class="small">未分配空间</text><rect x="0" y="200" width="220" height="70" class="mmap"/><text x="110" y="222" text-anchor="middle" font-weight="bold">内存映射区 (mmap)</text><text x="110" y="240" text-anchor="middle" class="small">动态库 .so / 文件映射</text><text x="110" y="258" text-anchor="middle" class="small">匿名映射、共享内存</text><rect x="0" y="280" width="220" height="40" fill="#eceff1"/><text x="110" y="304" text-anchor="middle" class="small">未分配空间</text><rect x="0" y="330" width="220" height="80" class="heap"/><text x="110" y="354" text-anchor="middle" font-weight="bold">堆 (Heap)</text><text x="110" y="372" text-anchor="middle" class="small">malloc / new 动态分配</text><text x="110" y="390" text-anchor="middle" class="small">向上增长 ↑ ，brk 移动边界</text><rect x="0" y="420" width="220" height="48" class="bss"/><text x="110" y="442" text-anchor="middle" font-weight="bold">未初始化数据 (BSS)</text><text x="110" y="460" text-anchor="middle" class="small">未赋初值的全局/静态变量</text><rect x="0" y="478" width="220" height="48" class="data"/><text x="110" y="500" text-anchor="middle" font-weight="bold">已初始化数据 (Data)</text><text x="110" y="518" text-anchor="middle" class="small">带初值的全局/静态变量</text><rect x="0" y="536" width="220" height="54" class="text"/><text x="110" y="558" text-anchor="middle" font-weight="bold" fill="#fff">代码段 (Text)</text><text x="110" y="578" text-anchor="middle" class="small" fill="#fff">只读、可执行的机器指令</text></g><text x="200" y="62" text-anchor="end" class="mono">高地址</text><text x="200" y="98" text-anchor="end" class="mono">0xFFFFFFFF</text><text x="200" y="118" text-anchor="end" class="mono">0xC0000000</text><text x="200" y="370" text-anchor="end" class="mono">brk →</text><text x="200" y="540" text-anchor="end" class="mono">0x08048000</text><text x="200" y="600" text-anchor="end" class="mono">低地址 0</text><path d="M460 110v40" stroke="#f57f17" stroke-width="2" marker-end="url(#arr5)"/><text x="455" y="130" text-anchor="end" class="small" fill="#f57f17">栈向下</text><path d="M460 405V320" stroke="#1b5e20" stroke-width="2" marker-end="url(#arr5)"/><text x="470" y="370" class="small" fill="#1b5e20">堆向上</text><g transform="translate(490,80)"><rect x="0" y="0" width="250" height="240" fill="#fafafa" stroke="#bbb" rx="6"/><text x="125" y="22" text-anchor="middle" font-weight="bold">线程视角</text><text x="10" y="46" class="small">同一进程内的多个线程：</text><text x="10" y="66" class="small">• 共享：Text、Data、BSS、Heap、mmap</text><text x="10" y="86" class="small">• 私有：每线程一份 Stack、寄存器</text><text x="10" y="116" font-weight="bold">用户态 vs 内核态边界</text><text x="10" y="136" class="small">用户态只能访问下半段；</text><text x="10" y="156" class="small">通过系统调用陷入内核态后</text><text x="10" y="176" class="small">才能访问内核空间。</text><text x="10" y="206" font-weight="bold">PCB / 内核栈</text><text x="10" y="226" class="small">每进程在内核空间还有 PCB 与内核栈。</text></g><text x="380" y="668" text-anchor="middle" class="small">栈与堆相向生长，中间是 mmap / 未分配区；32 位下 3:1 分界（0xC0000000）将用户/内核分开</text></svg>