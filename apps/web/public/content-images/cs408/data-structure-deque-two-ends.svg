<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="双端队列：两端都能插入和删除，以及输入受限和输出受限两种变体">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.4}
    .y{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.5}
    .g{fill:#f3f7f1;stroke:#2b2b2b;stroke-width:1.3}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .v{font:600 13px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .o{stroke:#b06a00;stroke-width:1.6;fill:none}
    .l{stroke:#2b2b2b;stroke-width:1.4;fill:none}
  </style>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06a00"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
  </defs>

  <text class="t" x="18" y="26">双端队列（Deque）：两端都能插入、也都能删除 —— 栈和队列都是它的特例</text>

  <!-- 队列本体 -->
  <rect class="y" x="230" y="86" width="60" height="46"/>
  <rect class="b" x="290" y="86" width="60" height="46"/>
  <rect class="b" x="350" y="86" width="60" height="46"/>
  <rect class="b" x="410" y="86" width="60" height="46"/>
  <rect class="y" x="470" y="86" width="60" height="46"/>
  <text class="v" x="252" y="114">a</text>
  <text class="v" x="312" y="114">b</text>
  <text class="v" x="372" y="114">c</text>
  <text class="v" x="432" y="114">d</text>
  <text class="v" x="492" y="114">e</text>
  <text class="n" x="238" y="150">左端（front）</text>
  <text class="n" x="456" y="150">右端（rear）</text>

  <!-- 左端两个操作 -->
  <path class="o" d="M200 60 L252 82" marker-end="url(#ao)"/>
  <text class="n" x="18" y="60">在左端插入</text>
  <path class="o" d="M252 136 L200 158" marker-end="url(#ao)"/>
  <text class="n" x="18" y="176">从左端删除</text>

  <!-- 右端两个操作 -->
  <path class="o" d="M560 60 L508 82" marker-end="url(#ao)"/>
  <text class="n" x="580" y="60">在右端插入</text>
  <path class="o" d="M508 136 L560 158" marker-end="url(#ao)"/>
  <text class="n" x="580" y="176">在右端删除</text>

  <!-- 两种变体 -->
  <rect class="g" x="18" y="200" width="350" height="76" rx="4"/>
  <text class="s" x="32" y="224">输入受限的双端队列</text>
  <text class="n" x="32" y="246">只允许在一端插入，两端都可以删除</text>
  <text class="n" x="32" y="266">→ 插入那端的灵活性没有了，但出队顺序仍比栈多</text>

  <rect class="g" x="392" y="200" width="350" height="76" rx="4"/>
  <text class="s" x="406" y="224">输出受限的双端队列</text>
  <text class="n" x="406" y="246">只允许在一端删除，两端都可以插入</text>
  <text class="n" x="406" y="266">→ 删除受限，但同一元素序列的可达输出更多</text>

  <!-- 与栈、队列的关系 -->
  <text class="n" x="18" y="302">三种结构的包含关系：只在一端插入、同一端删除 = 栈；一端插入、另一端删除 = 队列；两端都能插删 = 双端队列</text>
  <text class="n" x="18" y="324">所以「双端队列能实现的输出序列一定不少于栈」—— 栈的所有合法输出序列，它都能实现（把插入和删除都放在同一端即可）</text>
  <text class="n" x="18" y="346">判合法序列：把操作写成「插 / 删」序列，只要任何时刻「删除数 ≤ 已插入数」且删的那端有元素，就可行</text>
  <text class="n" x="18" y="368">易错：双端队列不是「两个队列」，也不是「两端都能删除但只能一端插入」—— 默认定义是两端都能插、都能删，受限变体会另外说明</text>
</svg>
