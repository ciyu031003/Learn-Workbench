<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="Helvetica, Arial, sans-serif" font-size="13"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#333"/></marker><style>.title{font-size:15px;font-weight:700;fill:#222}.label{font-size:12px;fill:#444}.cell-free{fill:#e8f5e9;stroke:#2e7d32}.cell-used{fill:#ffcdd2;stroke:#c62828}.cell-hit{fill:#fff59d;stroke:#f57f17}.bit{font-size:14px;font-weight:700}.bit-free{fill:#2e7d32}.bit-used{fill:#c62828}.idx{font-size:10px;fill:#888}.note{font-size:11px;fill:#555}</style></defs><text x="380" y="26" class="title" text-anchor="middle">位图法：空闲磁盘块的分配与回收</text><g transform="translate(30,42)"><rect x="0" y="0" width="18" height="18" class="cell-free"/><text x="24" y="14" class="label">0 空闲</text><rect x="90" y="0" width="18" height="18" class="cell-used"/><text x="114" y="14" class="label">1 已占用</text><rect x="200" y="0" width="18" height="18" class="cell-hit"/><text x="224" y="14" class="label">本次操作</text></g><g transform="translate(30,90)"><text x="0" y="-6" class="label">初始位图状态：</text><g><rect x="0" y="0" width="40" height="40" class="cell-used"/><rect x="40" y="0" width="40" height="40" class="cell-used"/><rect x="80" y="0" width="40" height="40" class="cell-free"/><rect x="120" y="0" width="40" height="40" class="cell-used"/><rect x="160" y="0" width="40" height="40" class="cell-free"/><rect x="200" y="0" width="40" height="40" class="cell-free"/><rect x="240" y="0" width="40" height="40" class="cell-used"/><rect x="280" y="0" width="40" height="40" class="cell-free"/><rect x="320" y="0" width="40" height="40" class="cell-used"/><rect x="360" y="0" width="40" height="40" class="cell-free"/><text x="20" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="60" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="100" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="140" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="180" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="220" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="260" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="300" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="340" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="380" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="20" y="55" class="idx" text-anchor="middle">块0</text><text x="60" y="55" class="idx" text-anchor="middle">块1</text><text x="100" y="55" class="idx" text-anchor="middle">块2</text><text x="140" y="55" class="idx" text-anchor="middle">块3</text><text x="180" y="55" class="idx" text-anchor="middle">块4</text><text x="220" y="55" class="idx" text-anchor="middle">块5</text><text x="260" y="55" class="idx" text-anchor="middle">块6</text><text x="300" y="55" class="idx" text-anchor="middle">块7</text><text x="340" y="55" class="idx" text-anchor="middle">块8</text><text x="380" y="55" class="idx" text-anchor="middle">块9</text></g></g><g transform="translate(30,170)"><line x1="200" y1="0" x2="200" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><text x="210" y="22" class="note">① 分配：扫描位图，找到第一个为 0 的位（块2），将其置 1</text></g><g transform="translate(30,220)"><text x="0" y="-6" class="label">分配后：块2 被分配（0 → 1）</text><g><rect x="0" y="0" width="40" height="40" class="cell-used"/><rect x="40" y="0" width="40" height="40" class="cell-used"/><rect x="80" y="0" width="40" height="40" class="cell-hit"/><rect x="120" y="0" width="40" height="40" class="cell-used"/><rect x="160" y="0" width="40" height="40" class="cell-free"/><rect x="200" y="0" width="40" height="40" class="cell-free"/><rect x="240" y="0" width="40" height="40" class="cell-used"/><rect x="280" y="0" width="40" height="40" class="cell-free"/><rect x="320" y="0" width="40" height="40" class="cell-used"/><rect x="360" y="0" width="40" height="40" class="cell-free"/><text x="20" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="60" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="100" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="140" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="180" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="220" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="260" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="300" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="340" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="380" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="20" y="55" class="idx" text-anchor="middle">块0</text><text x="60" y="55" class="idx" text-anchor="middle">块1</text><text x="100" y="55" class="idx" text-anchor="middle">块2</text><text x="140" y="55" class="idx" text-anchor="middle">块3</text><text x="180" y="55" class="idx" text-anchor="middle">块4</text><text x="220" y="55" class="idx" text-anchor="middle">块5</text><text x="260" y="55" class="idx" text-anchor="middle">块6</text><text x="300" y="55" class="idx" text-anchor="middle">块7</text><text x="340" y="55" class="idx" text-anchor="middle">块8</text><text x="380" y="55" class="idx" text-anchor="middle">块9</text></g></g><g transform="translate(30,300)"><line x1="340" y1="0" x2="340" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/><text x="350" y="22" class="note">② 回收：文件释放块8，将对应位由 1 置 0</text></g><g transform="translate(30,350)"><text x="0" y="-6" class="label">回收后：块8 被释放（1 → 0）</text><g><rect x="0" y="0" width="40" height="40" class="cell-used"/><rect x="40" y="0" width="40" height="40" class="cell-used"/><rect x="80" y="0" width="40" height="40" class="cell-used"/><rect x="120" y="0" width="40" height="40" class="cell-used"/><rect x="160" y="0" width="40" height="40" class="cell-free"/><rect x="200" y="0" width="40" height="40" class="cell-free"/><rect x="240" y="0" width="40" height="40" class="cell-used"/><rect x="280" y="0" width="40" height="40" class="cell-free"/><rect x="320" y="0" width="40" height="40" class="cell-hit"/><rect x="360" y="0" width="40" height="40" class="cell-free"/><text x="20" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="60" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="100" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="140" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="180" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="220" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="260" y="26" class="bit bit-used" text-anchor="middle">1</text><text x="300" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="340" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="380" y="26" class="bit bit-free" text-anchor="middle">0</text><text x="20" y="55" class="idx" text-anchor="middle">块0</text><text x="60" y="55" class="idx" text-anchor="middle">块1</text><text x="100" y="55" class="idx" text-anchor="middle">块2</text><text x="140" y="55" class="idx" text-anchor="middle">块3</text><text x="180" y="55" class="idx" text-anchor="middle">块4</text><text x="220" y="55" class="idx" text-anchor="middle">块5</text><text x="260" y="55" class="idx" text-anchor="middle">块6</text><text x="300" y="55" class="idx" text-anchor="middle">块7</text><text x="340" y="55" class="idx" text-anchor="middle">块8</text><text x="380" y="55" class="idx" text-anchor="middle">块9</text></g></g><g transform="translate(470,90)"><rect x="0" y="0" width="260" height="330" fill="#f5f5f5" stroke="#bbb" rx="6" ry="6"/><text x="12" y="22" class="title">操作要点</text><text x="12" y="50" class="note">分配空闲块：</text><text x="12" y="70" class="note">• 从位图起始位置顺序扫描</text><text x="12" y="88" class="note">• 找到首个为 0 的位</text><text x="12" y="106" class="note">• 将该位改写为 1</text><text x="12" y="124" class="note">• 将对应数据块交给文件使用</text><text x="12" y="160" class="note">回收空闲块：</text><text x="12" y="180" class="note">• 由块号计算所在位的下标</text><text x="12" y="198" class="note">行号 = ⌊块号 / 每行位数⌋</text><text x="12" y="216" class="note">列号 = 块号 mod 每行位数</text><text x="12" y="234" class="note">• 将该位由 1 置 0</text><text x="12" y="252" class="note">• 数据块重新变为可分配状态</text><text x="12" y="288" class="note">优点：位图紧凑，一位即代表一块；</text><text x="12" y="306" class="note">扫描/位运算高效，便于连续分配。</text></g></svg>