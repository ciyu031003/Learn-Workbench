<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="426" viewBox="0 0 760 426" role="img" aria-label="分块查找：索引表记录每块最大关键字与起始地址，块间有序、块内无序，查找分两步">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.3}
    .y{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.4}
    .h{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.3}
    .g{fill:#f3f7f1;stroke:#2b2b2b;stroke-width:1.3}
    .r{fill:#fbeceb;stroke:#b06a00;stroke-width:1.8}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .v{font:600 13px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .o{stroke:#b06a00;stroke-width:1.6;fill:none}
  </style>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06a00"/></marker>
  </defs>

  <text class="t" x="18" y="26">分块查找（索引顺序查找）：块间有序、块内无序，查找分两步</text>

  <!-- 索引表 -->
  <text class="s" x="18" y="72">索引表</text>
  <rect class="h" x="120" y="48" width="168" height="28"/>
  <rect class="h" x="288" y="48" width="168" height="28"/>
  <rect class="h" x="456" y="48" width="168" height="28"/>
  <text class="n" x="128" y="67">最大关键字 22</text>
  <text class="n" x="296" y="67">最大关键字 48</text>
  <text class="n" x="464" y="67">最大关键字 86</text>
  <rect class="b" x="120" y="76" width="168" height="28"/>
  <rect class="b" x="288" y="76" width="168" height="28"/>
  <rect class="b" x="456" y="76" width="168" height="28"/>
  <text class="n" x="128" y="95">起始地址 0</text>
  <text class="n" x="296" y="95">起始地址 6</text>
  <text class="n" x="464" y="95">起始地址 12</text>

  <!-- 数据表：3 块 × 6 -->
  <text class="s" x="18" y="150">数据表</text>
  <rect class="g" x="120" y="126" width="84" height="34"/>
  <rect class="g" x="204" y="126" width="84" height="34"/>
  <rect class="g" x="288" y="126" width="84" height="34"/>
  <rect class="g" x="372" y="126" width="84" height="34"/>
  <rect class="g" x="456" y="126" width="84" height="34"/>
  <rect class="g" x="540" y="126" width="84" height="34"/>
  <text class="v" x="147" y="149">22</text>
  <text class="v" x="231" y="149">12</text>
  <text class="v" x="315" y="149">13</text>
  <text class="v" x="399" y="149">8</text>
  <text class="v" x="483" y="149">9</text>
  <text class="v" x="567" y="149">20</text>

  <rect class="y" x="120" y="160" width="84" height="34"/>
  <rect class="y" x="204" y="160" width="84" height="34"/>
  <rect class="y" x="288" y="160" width="84" height="34"/>
  <rect class="r" x="372" y="160" width="84" height="34"/>
  <rect class="y" x="456" y="160" width="84" height="34"/>
  <rect class="y" x="540" y="160" width="84" height="34"/>
  <text class="v" x="147" y="183">33</text>
  <text class="v" x="231" y="183">42</text>
  <text class="v" x="315" y="183">44</text>
  <text class="v" x="399" y="183">38</text>
  <text class="v" x="483" y="183">24</text>
  <text class="v" x="567" y="183">48</text>

  <rect class="g" x="120" y="194" width="84" height="34"/>
  <rect class="g" x="204" y="194" width="84" height="34"/>
  <rect class="g" x="288" y="194" width="84" height="34"/>
  <rect class="g" x="372" y="194" width="84" height="34"/>
  <rect class="g" x="456" y="194" width="84" height="34"/>
  <rect class="g" x="540" y="194" width="84" height="34"/>
  <text class="v" x="147" y="217">60</text>
  <text class="v" x="231" y="217">58</text>
  <text class="v" x="315" y="217">74</text>
  <text class="v" x="399" y="217">49</text>
  <text class="v" x="483" y="217">86</text>
  <text class="v" x="567" y="217">53</text>

  <!-- 块号 -->
  <text class="n" x="128" y="246">第 1 块（最大 22）</text>
  <text class="n" x="296" y="246">第 2 块（最大 48）</text>
  <text class="n" x="464" y="246">第 3 块（最大 86）</text>

  <!-- 示例：查 38 -->
  <path class="o" d="M372 104 L372 122" marker-end="url(#ao)"/>

  <!-- 结论 -->
  <text class="n" x="18" y="276">例：查 38 —— 先在索引表里找第一个 ≥38 的关键字（是 48，属第 2 块），再在第 2 块内顺序查找，共 4 次比较命中（橙框）</text>
  <text class="n" x="18" y="298">两个前提：块间有序（后一块的最小值大于前一块的最大值）、块内可以无序 —— 只满足「块间有序」这一个条件就能查</text>
  <text class="n" x="18" y="320">平均查找长度 = 找块的平均 + 块内顺序查找的平均 = (b+1)/2 + (s+1)/2（b 块数、s 每块元素数）</text>
  <text class="n" x="18" y="342">最优分块：b = s = √n 时取到最小值，ASL ≈ √n + 1 —— 比顺序查找的 (n+1)/2 好，比折半的 log₂n 差</text>
  <text class="n" x="18" y="364">索引表改用折半查找：ASL = log₂b + (s+1)/2，这一步常被忽略而丢分</text>
  <text class="n" x="18" y="386">它真正的优势是插入删除只影响本块、不必整体移动；代价是要额外维护索引表</text>
  <text class="n" x="18" y="408">联系：B 树 / B+ 树可以看成「多级索引」的分块查找，B+ 树的叶结点正好是「块内有序」</text>
</svg>
