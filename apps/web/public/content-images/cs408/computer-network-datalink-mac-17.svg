<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" font-family="'Segoe UI', 'PingFang SC', sans-serif"><rect width="860" height="480" fill="#fafafa" rx="8"/><text x="52" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">发送方 A</text><text x="52" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">接收方 B</text><text x="52" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">普通站 C</text><text x="52" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#bf360c">隐藏站 D</text><text x="52" y="440" text-anchor="middle" font-size="11" fill="#888">(只听到CTS)</text><line x1="96" y1="100" x2="845" y2="100" stroke="#b0bec5" stroke-width="1.5"/><line x1="96" y1="190" x2="845" y2="190" stroke="#b0bec5" stroke-width="1.5"/><line x1="96" y1="280" x2="845" y2="280" stroke="#b0bec5" stroke-width="1.5"/><line x1="96" y1="370" x2="845" y2="370" stroke="#b0bec5" stroke-width="1.5"/><rect x="100" y="83" width="40" height="34" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/><text x="120" y="105" text-anchor="middle" font-size="10" fill="#1565c0">DIFS</text><rect x="140" y="83" width="60" height="34" fill="#1565c0" rx="3"/><text x="170" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">RTS</text><rect x="275" y="83" width="20" height="34" fill="#e3f2fd" rx="3" stroke="#90caf9" stroke-width="1"/><text x="285" y="105" text-anchor="middle" font-size="9" fill="#1565c0">SIFS</text><rect x="295" y="83" width="120" height="34" fill="#0d47a1" rx="3"/><text x="355" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">DATA</text><rect x="200" y="173" width="20" height="34" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/><text x="210" y="195" text-anchor="middle" font-size="9" fill="#2e7d32">SIFS</text><rect x="220" y="173" width="55" height="34" fill="#2e7d32" rx="3"/><text x="247" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">CTS</text><rect x="415" y="173" width="20" height="34" fill="#e8f5e9" rx="3" stroke="#a5d6a7" stroke-width="1"/><text x="425" y="195" text-anchor="middle" font-size="9" fill="#2e7d32">SIFS</text><rect x="435" y="173" width="55" height="34" fill="#2e7d32" rx="3"/><text x="462" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">ACK</text><rect x="200" y="263" width="290" height="34" fill="#ede7f6" rx="3" stroke="#ce93d8" stroke-width="1.5" stroke-dasharray="5,3"/><text x="345" y="285" text-anchor="middle" font-size="10" fill="#6a1b9a" font-weight="bold">NAV (听到 RTS 后设置)</text><polygon points="200,260 193,248 207,248" fill="#6a1b9a" opacity=".7"/><text x="200" y="246" text-anchor="middle" font-size="9" fill="#6a1b9a">收到RTS</text><rect x="275" y="353" width="215" height="34" fill="#fbe9e7" rx="3" stroke="#ff8a65" stroke-width="1.5" stroke-dasharray="5,3"/><text x="382" y="375" text-anchor="middle" font-size="10" fill="#bf360c" font-weight="bold">NAV (只听到 CTS 后设置)</text><polygon points="275,350 268,338 282,338" fill="#bf360c" opacity=".7"/><text x="275" y="336" text-anchor="middle" font-size="9" fill="#bf360c">收到CTS</text><line x1="200" y1="75" x2="200" y2="400" stroke="#90caf9" stroke-width="1" stroke-dasharray="4,3"/><line x1="275" y1="75" x2="275" y2="400" stroke="#a5d6a7" stroke-width="1" stroke-dasharray="4,3"/><line x1="415" y1="75" x2="415" y2="400" stroke="#bbdefb" stroke-width="1" stroke-dasharray="4,3"/><line x1="490" y1="75" x2="490" y2="400" stroke="#c8e6c9" stroke-width="1" stroke-dasharray="4,3"/><text x="120" y="72" text-anchor="middle" font-size="9" fill="#555">DIFS</text><text x="170" y="72" text-anchor="middle" font-size="9" fill="#1565c0">RTS</text><text x="210" y="72" text-anchor="middle" font-size="9" fill="#555">SIFS</text><text x="247" y="72" text-anchor="middle" font-size="9" fill="#2e7d32">CTS</text><text x="285" y="72" text-anchor="middle" font-size="9" fill="#555">SIFS</text><text x="355" y="72" text-anchor="middle" font-size="9" fill="#0d47a1">DATA</text><text x="425" y="72" text-anchor="middle" font-size="9" fill="#555">SIFS</text><text x="462" y="72" text-anchor="middle" font-size="9" fill="#2e7d32">ACK</text><line x1="96" y1="78" x2="845" y2="78" stroke="#ddd" stroke-width="1"/><text x="848" y="82" font-size="10" fill="#aaa">t</text><line x1="200" y1="306" x2="490" y2="306" stroke="#6a1b9a" stroke-width="1.5"/><line x1="200" y1="302" x2="200" y2="310" stroke="#6a1b9a" stroke-width="1.5"/><line x1="490" y1="302" x2="490" y2="310" stroke="#6a1b9a" stroke-width="1.5"/><text x="345" y="320" text-anchor="middle" font-size="9" fill="#6a1b9a">SIFS+CTS+SIFS+DATA+SIFS+ACK</text><line x1="275" y1="396" x2="490" y2="396" stroke="#bf360c" stroke-width="1.5"/><line x1="275" y1="392" x2="275" y2="400" stroke="#bf360c" stroke-width="1.5"/><line x1="490" y1="392" x2="490" y2="400" stroke="#bf360c" stroke-width="1.5"/><text x="382" y="412" text-anchor="middle" font-size="9" fill="#bf360c">SIFS+DATA+SIFS+ACK</text><rect x="550" y="82" width="275" height="300" fill="#fff" rx="6" stroke="#e0e0e0" stroke-width="1.2"/><text x="687" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">机制说明</text><line x1="560" y1="112" x2="815" y2="112" stroke="#eee" stroke-width="1"/><rect x="560" y="120" width="36" height="18" fill="#1565c0" rx="2"/><text x="578" y="133" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">RTS</text><text x="815" y="130" text-anchor="end" font-size="10" fill="#333">发送方请求占用信道</text><text x="815" y="143" text-anchor="end" font-size="10" fill="#555">携带 Duration 字段</text><rect x="560" y="158" width="36" height="18" fill="#2e7d32" rx="2"/><text x="578" y="171" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">CTS</text><text x="815" y="168" text-anchor="end" font-size="10" fill="#333">接收方允许发送</text><text x="815" y="181" text-anchor="end" font-size="10" fill="#555">周围站点均可听到</text><rect x="560" y="196" width="36" height="18" fill="#ede7f6" rx="2" stroke="#ce93d8" stroke-width="1"/><text x="578" y="209" text-anchor="middle" font-size="9" fill="#6a1b9a">NAV-C</text><text x="815" y="206" text-anchor="end" font-size="10" fill="#333">听到 RTS → 设 NAV</text><text x="815" y="219" text-anchor="end" font-size="10" fill="#555">= SIFS+CTS+SIFS+DATA+SIFS+ACK</text><rect x="560" y="234" width="36" height="18" fill="#fbe9e7" rx="2" stroke="#ff8a65" stroke-width="1"/><text x="578" y="247" text-anchor="middle" font-size="9" fill="#bf360c">NAV-D</text><text x="815" y="244" text-anchor="end" font-size="10" fill="#333">只听到 CTS → 设 NAV</text><text x="815" y="257" text-anchor="end" font-size="10" fill="#555">= SIFS+DATA+SIFS+ACK</text><line x1="560" y1="270" x2="815" y2="270" stroke="#eee" stroke-width="1"/><rect x="560" y="278" width="255" height="92" fill="#f5f5f5" rx="4"/><text x="687" y="296" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">考点提示</text><text x="572" y="312" font-size="10" fill="#555">• NAV 从控制帧结束后开始计算</text><text x="572" y="327" font-size="10" fill="#555">• 不含 DIFS，不含控制帧本身</text><text x="572" y="342" font-size="10" fill="#555">• 隐藏站错过 RTS，NAV 比普通</text><text x="572" y="357" font-size="10" fill="#555">站少 SIFS + CTS</text><rect x="100" y="425" width="430" height="42" fill="#fff8e1" rx="4" stroke="#ffe082" stroke-width="1"/><text x="115" y="441" font-size="10" fill="#7c5c00">隐藏站 D：与发送方 A 相互"看不见"，无法收到 RTS；</text><text x="115" y="456" font-size="10" fill="#7c5c00">但能收到接收方 B 发出的 CTS，因此仍能设置 NAV 保持静默。</text></svg>