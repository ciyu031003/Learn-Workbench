<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="Microsoft Yahei, sans-serif" font-size="13"><defs><marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#333"/></marker></defs><style>.title{font-weight:700;font-size:15px}.dir{fill:#fff8e1;stroke:#f9a825}.inode{fill:#e3f2fd;stroke:#1565c0}.data{fill:#c8e6c9;stroke:#2e7d32}.small{font-size:11px;fill:#555}.mono{font-family:Menlo,Consolas,monospace;font-size:11px}</style><text x="490" y="24" text-anchor="middle" class="title">路径解析过程：从 /home/alice/a.txt 找到文件内容</text><rect x="20" y="44" width="940" height="34" rx="4" fill="#eceff1" stroke="#90a4ae"/><text x="40" y="66" class="mono">解析路径： / → home → alice → a.txt</text><text x="540" y="66" class="small">每一步：读取“目录文件” → 在其中查找名字 → 取出 inode 号 → 读 inode</text><g transform="translate(20,100)"><text x="110" y="0" text-anchor="middle" font-weight="bold">① 根目录 /</text><text x="110" y="18" text-anchor="middle" class="small">inode 号 = 2 (约定)</text><rect x="0" y="30" width="220" height="110" class="dir" rx="4"/><text x="110" y="50" text-anchor="middle" font-weight="bold">目录文件 “/”</text><text x="10" y="72" class="mono">. → inode 2</text><text x="10" y="90" class="mono">.. → inode 2</text><text x="10" y="108" class="mono">home/ → inode 18</text><text x="10" y="126" class="mono">etc/ → inode 19</text><rect x="0" y="160" width="220" height="70" class="inode" rx="4"/><text x="110" y="180" text-anchor="middle" font-weight="bold">inode #2</text><text x="10" y="200" class="mono">type=dir, perm=...</text><text x="10" y="218" class="mono">block_ptr → 目录数据块</text></g><g transform="translate(260,100)"><text x="110" y="0" text-anchor="middle" font-weight="bold">② /home</text><text x="110" y="18" text-anchor="middle" class="small">查到 “home” → inode 18</text><rect x="0" y="30" width="220" height="110" class="dir" rx="4"/><text x="110" y="50" text-anchor="middle" font-weight="bold">目录文件 “/home”</text><text x="10" y="72" class="mono">. → inode 18</text><text x="10" y="90" class="mono">.. → inode 2</text><text x="10" y="108" class="mono">alice/ → inode 77</text><text x="10" y="126" class="mono">bob/ → inode 78</text><rect x="0" y="160" width="220" height="70" class="inode" rx="4"/><text x="110" y="180" text-anchor="middle" font-weight="bold">inode #18</text><text x="10" y="200" class="mono">type=dir</text><text x="10" y="218" class="mono">block_ptr → 目录数据块</text></g><g transform="translate(500,100)"><text x="110" y="0" text-anchor="middle" font-weight="bold">③ /home/alice</text><text x="110" y="18" text-anchor="middle" class="small">查到 “alice” → inode 77</text><rect x="0" y="30" width="220" height="110" class="dir" rx="4"/><text x="110" y="50" text-anchor="middle" font-weight="bold">目录文件 “/home/alice”</text><text x="10" y="72" class="mono">. → inode 77</text><text x="10" y="90" class="mono">.. → inode 18</text><text x="10" y="108" class="mono">a.txt → inode 123</text><text x="10" y="126" class="mono">docs/ → inode 200</text><rect x="0" y="160" width="220" height="70" class="inode" rx="4"/><text x="110" y="180" text-anchor="middle" font-weight="bold">inode #77</text><text x="10" y="200" class="mono">type=dir</text><text x="10" y="218" class="mono">block_ptr → 目录数据块</text></g><g transform="translate(740,100)"><text x="110" y="0" text-anchor="middle" font-weight="bold">④ /home/alice/a.txt</text><text x="110" y="18" text-anchor="middle" class="small">查到 “a.txt” → inode 123</text><rect x="0" y="30" width="220" height="110" class="inode" rx="4"/><text x="110" y="50" text-anchor="middle" font-weight="bold">inode #123</text><text x="10" y="72" class="mono">type=file</text><text x="10" y="90" class="mono">size=6, links=1</text><text x="10" y="108" class="mono">block_ptr[0] → data block</text><text x="10" y="126" class="mono">block_ptr[1..] → ...</text><rect x="0" y="160" width="220" height="70" class="data" rx="4"/><text x="110" y="180" text-anchor="middle" font-weight="bold">数据块</text><text x="10" y="202" class="mono">"hello\n"</text><text x="10" y="220" class="mono">←─ 实际文件内容</text></g><path d="M240 175h20" stroke="#333" stroke-width="1.5" marker-end="url(#arr4)"/><path d="M480 175h20" stroke="#333" stroke-width="1.5" marker-end="url(#arr4)"/><path d="M720 175h20" stroke="#333" stroke-width="1.5" marker-end="url(#arr4)"/><path d="M130 290q0 30-20 0" stroke="#1565c0" stroke-width="1" fill="none" marker-end="url(#arr4)"/><text x="20" y="380" font-weight="bold">关键点</text><text x="20" y="402">• 目录本质上是一个 “特殊文件”，其数据块内容是一条条目录项 ⟨名字, inode 号⟩。</text><text x="20" y="422">• 每一段路径分量都要做一次：读目录数据块 → 线性查找 → 拿到下一级 inode 号 → 读 inode。</text><text x="20" y="442">• 文件名只存在于目录项中；文件的真实属性（大小、权限、数据块指针）都在 inode 里。</text><text x="20" y="462">• 硬链接 = 多个目录项指向同一 inode；软链接 = inode 类型为 link，数据块里存目标路径。</text></svg>