<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#455a64"/></marker><linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe0b2"/><stop offset="1" stop-color="#ffcc80"/></linearGradient><linearGradient id="gDrv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42a5f5"/><stop offset="1" stop-color="#1565c0"/></linearGradient><linearGradient id="gHw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8e6c9"/><stop offset="1" stop-color="#81c784"/></linearGradient><style>.h1{fill:#0d47a1;font-size:18px;font-weight:700}.sub{fill:#455a64;font-size:12px}.lay-t{fill:#263238;font-size:13px;font-weight:600}.lay-w{fill:#fff;font-size:15px;font-weight:700}.card-t{fill:#0d47a1;font-size:13px;font-weight:600}.card-d{fill:#37474f;font-size:11px}.tag{fill:#b71c1c;font-size:11px;font-weight:600}.side{fill:#37474f;font-size:11px}</style></defs><text x="430" y="28" text-anchor="middle" class="h1">设备驱动程序</text><text x="430" y="48" text-anchor="middle" class="sub">承上启下：把设备独立性软件的通用命令 → 翻译为特定硬件能理解的指令</text><rect x="60" y="70" width="740" height="46" rx="8" fill="url(#gTop)" stroke="#fb8c00"/><text x="430" y="98" text-anchor="middle" class="lay-t">设备独立性软件（通用 I/O 命令：read / write / ioctl…）</text><rect x="60" y="140" width="740" height="260" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/><rect x="60" y="140" width="740" height="34" rx="10" fill="url(#gDrv)"/><text x="430" y="163" text-anchor="middle" class="lay-w">设备驱动程序（内核态，针对具体硬件）</text><g><rect x="80" y="188" width="220" height="90" rx="6" fill="#fff" stroke="#90caf9"/><text x="92" y="208" class="card-t">① 命令翻译</text><text x="92" y="226" class="card-d">通用 I/O 请求 → 设备特定指令</text><text x="92" y="242" class="card-d">写控制/命令寄存器</text><text x="92" y="258" class="card-d">如：扇区读写、控制字符</text></g><g><rect x="315" y="188" width="220" height="90" rx="6" fill="#fff" stroke="#90caf9"/><text x="327" y="208" class="card-t">② 设备初始化与配置</text><text x="327" y="226" class="card-d">复位、加载固件</text><text x="327" y="242" class="card-d">分配 I/O 端口、DMA 通道</text><text x="327" y="258" class="card-d">注册中断向量</text></g><g><rect x="550" y="188" width="230" height="90" rx="6" fill="#fff" stroke="#90caf9"/><text x="562" y="208" class="card-t">③ 数据传输</text><text x="562" y="226" class="card-d">程序查询 / 中断 / DMA</text><text x="562" y="242" class="card-d">在设备寄存器与内存间搬运</text><text x="562" y="258" class="card-d">配合上层缓冲区</text></g><g><rect x="80" y="292" width="220" height="90" rx="6" fill="#fff" stroke="#90caf9"/><text x="92" y="312" class="card-t">④ 中断响应与后处理</text><text x="92" y="330" class="card-d">配合中断处理程序</text><text x="92" y="346" class="card-d">读状态寄存器判断结果</text><text x="92" y="362" class="card-d">唤醒等待进程</text></g><g><rect x="315" y="292" width="220" height="90" rx="6" fill="#fff" stroke="#90caf9"/><text x="327" y="312" class="card-t">⑤ 错误检测与恢复</text><text x="327" y="330" class="card-d">超时、校验失败、重试</text><text x="327" y="346" class="card-d">向上报告不可恢复错误</text><text x="327" y="362" class="card-d">屏蔽底层硬件异常</text></g><g><rect x="550" y="292" width="230" height="90" rx="6" fill="#fff" stroke="#90caf9"/><text x="562" y="312" class="card-t">⑥ 提供统一接口</text><text x="562" y="330" class="card-d">向上暴露标准入口</text><text x="562" y="346" class="card-d">open / read / write / close</text><text x="562" y="362" class="card-d">便于内核统一调度</text></g><rect x="60" y="424" width="740" height="60" rx="8" fill="url(#gHw)" stroke="#2e7d32"/><text x="430" y="448" text-anchor="middle" class="lay-t">硬件（设备控制器 · 寄存器 · 端口 · DMA）</text><text x="430" y="468" text-anchor="middle" class="card-d">硬盘 / 网卡 / 键盘 / 打印机 …</text><line x1="430" y1="118" x2="430" y2="138" stroke="#455a64" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="430" y1="402" x2="430" y2="422" stroke="#455a64" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="440" y="132" class="side">↑ 向上：统一 API</text><text x="440" y="418" class="side">↓ 向下：操控硬件寄存器 / 端口</text><text x="60" y="65" class="tag">运行态：内核态</text><text x="200" y="65" class="tag">提供方：通常由设备制造商提供</text></svg>