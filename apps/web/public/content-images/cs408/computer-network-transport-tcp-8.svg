<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'Segoe UI', Arial, sans-serif"><rect width="800" height="520" fill="#f8f9fa" rx="12"/><rect x="30" y="30" width="240" height="460" fill="#e8f4fd" rx="10" stroke="#4a90d9" stroke-width="2"/><text x="150" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c5f8a">发送方 Sender</text><rect x="55" y="75" width="190" height="110" fill="#fff" rx="8" stroke="#e67e22" stroke-width="2"/><text x="150" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">拥塞窗口 cwnd</text><text x="150" y="116" text-anchor="middle" font-size="11" fill="#555">发送方内部维护</text><text x="150" y="134" text-anchor="middle" font-size="11" fill="#555">由拥塞控制算法驱动</text><text x="150" y="153" text-anchor="middle" font-size="11" fill="#555">慢启动 / 拥塞避免 / 快恢复</text><text x="150" y="172" text-anchor="middle" font-size="11" fill="#888">↑ ACK到达 · 丢包信号</text><rect x="55" y="210" width="190" height="100" fill="#fff" rx="8" stroke="#27ae60" stroke-width="2.5"/><text x="150" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">发送窗口 swnd</text><text x="150" y="254" text-anchor="middle" font-size="13" fill="#27ae60">= min(cwnd, rwnd)</text><text x="150" y="275" text-anchor="middle" font-size="11" fill="#555">实际可发未确认数据量</text><text x="150" y="294" text-anchor="middle" font-size="11" fill="#888">cwnd 或 rwnd 变化即更新</text><text x="150" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c5f8a">发送缓冲区</text><rect x="60" y="345" width="180" height="22" fill="#dde" rx="4"/><rect x="60" y="345" width="50" height="22" fill="#b0c4de" rx="4"/><text x="85" y="361" text-anchor="middle" font-size="9" fill="#fff">已确认</text><rect x="110" y="345" width="70" height="22" fill="#27ae60" rx="0"/><text x="145" y="361" text-anchor="middle" font-size="9" fill="#fff">已发未确认</text><rect x="180" y="345" width="40" height="22" fill="#f0a500" rx="0"/><text x="200" y="361" text-anchor="middle" font-size="9" fill="#fff">可发</text><rect x="220" y="345" width="20" height="22" fill="#ccc" rx="0 4 4 0"/><text x="230" y="361" text-anchor="middle" font-size="8" fill="#888">阻</text><line x1="110" y1="370" x2="220" y2="370" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2"/><text x="165" y="382" text-anchor="middle" font-size="10" fill="#27ae60">← swnd →</text><rect x="55" y="400" width="190" height="75" fill="#fff8f0" rx="8" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3"/><text x="150" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">cwnd 调整触发</text><text x="150" y="438" text-anchor="middle" font-size="10" fill="#555">✓ 新ACK → cwnd 增大</text><text x="150" y="454" text-anchor="middle" font-size="10" fill="#555">✗ 3重复ACK → cwnd 减半</text><text x="150" y="470" text-anchor="middle" font-size="10" fill="#555">✗ 超时 → cwnd 重置为1</text><rect x="530" y="30" width="240" height="460" fill="#edf7ed" rx="10" stroke="#27ae60" stroke-width="2"/><text x="650" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a6b2f">接收方 Receiver</text><rect x="555" y="75" width="190" height="130" fill="#fff" rx="8" stroke="#4a90d9" stroke-width="2"/><text x="650" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a90d9">接收窗口 rwnd</text><text x="650" y="116" text-anchor="middle" font-size="11" fill="#555">接收方公告给发送方</text><text x="650" y="135" text-anchor="middle" font-size="11" fill="#555">= 接收缓冲区剩余空间</text><line x1="570" y1="145" x2="730" y2="145" stroke="#ddd" stroke-width="1"/><text x="650" y="162" text-anchor="middle" font-size="11" fill="#888">影响因素：</text><text x="650" y="179" text-anchor="middle" font-size="10" fill="#888">缓冲区余量 · 应用消费速率</text><text x="650" y="195" text-anchor="middle" font-size="10" fill="#888">SO_RCVBUF 系统上限</text><text x="650" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a6b2f">接收缓冲区</text><rect x="560" y="240" width="180" height="22" fill="#dde" rx="4"/><rect x="560" y="240" width="110" height="22" fill="#4a90d9" rx="4 0 0 4"/><text x="615" y="256" text-anchor="middle" font-size="9" fill="#fff">已占用（待应用读取）</text><rect x="670" y="240" width="70" height="22" fill="#a8d5a2" rx="0 4 4 0"/><text x="705" y="256" text-anchor="middle" font-size="9" fill="#fff">空闲</text><line x1="670" y1="265" x2="740" y2="265" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="3,2"/><text x="705" y="277" text-anchor="middle" font-size="10" fill="#4a90d9">← rwnd →</text><rect x="555" y="295" width="190" height="70" fill="#f0fff0" rx="8" stroke="#27ae60" stroke-width="1.5"/><text x="650" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">应用层消费</text><text x="650" y="338" text-anchor="middle" font-size="11" fill="#555">读取数据 → 缓冲区释放</text><text x="650" y="354" text-anchor="middle" font-size="11" fill="#555">→ rwnd 增大 → 通知发送方</text><rect x="555" y="375" width="190" height="100" fill="#fff8f0" rx="8" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5,3"/><text x="650" y="397" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a90d9">流量控制循环</text><text x="650" y="415" text-anchor="middle" font-size="10" fill="#555">缓冲区满 → rwnd → 0</text><text x="650" y="431" text-anchor="middle" font-size="10" fill="#555">→ 发送方暂停</text><text x="650" y="447" text-anchor="middle" font-size="10" fill="#555">应用读取 → rwnd 恢复</text><text x="650" y="463" text-anchor="middle" font-size="10" fill="#555">→ 发送方继续</text><rect x="305" y="30" width="190" height="460" fill="#fafafa" rx="10" stroke="#aaa" stroke-width="1.5" stroke-dasharray="6,3"/><text x="400" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#666">网络</text><circle cx="400" cy="100" r="8" fill="#27ae60" opacity=".7"/><circle cx="400" cy="130" r="8" fill="#27ae60" opacity=".5"/><circle cx="400" cy="160" r="8" fill="#27ae60" opacity=".3"/><text x="400" y="185" text-anchor="middle" font-size="10" fill="#666">数据包</text><rect x="320" y="210" width="160" height="60" fill="#fff0f0" rx="6" stroke="#e74c3c" stroke-width="1.5"/><text x="400" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#e74c3c">拥塞信号</text><text x="400" y="250" text-anchor="middle" font-size="10" fill="#555">丢包 / 重复ACK</text><text x="400" y="265" text-anchor="middle" font-size="10" fill="#555">→ 反馈给发送方</text><circle cx="400" cy="330" r="8" fill="#f0a500" opacity=".7"/><circle cx="400" cy="355" r="8" fill="#f0a500" opacity=".5"/><circle cx="400" cy="380" r="8" fill="#f0a500" opacity=".3"/><text x="400" y="405" text-anchor="middle" font-size="10" fill="#666">ACK + rwnd</text><line x1="150" y1="185" x2="150" y2="208" stroke="#e67e22" stroke-width="2" marker-end="url(#arrow-orange)"/><line x1="270" y1="260" x2="305" y2="260" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/><text x="287" y="253" text-anchor="middle" font-size="9" fill="#27ae60">数据</text><line x1="530" y1="370" x2="495" y2="370" stroke="#f0a500" stroke-width="2" marker-end="url(#arrow-gold)"/><line x1="305" y1="370" x2="270" y2="370" stroke="#f0a500" stroke-width="2" marker-end="url(#arrow-gold)"/><text x="400" y="418" text-anchor="middle" font-size="9" fill="#f0a500">ACK 携带 rwnd</text><text x="150" y="200" text-anchor="middle" font-size="10" fill="#4a90d9">rwnd ↓</text><line x1="320" y1="240" x2="270" y2="210" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-red)"/><line x1="650" y1="262" x2="650" y2="293" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green2)"/><defs><marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#e67e22"/></marker><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#27ae60"/></marker><marker id="arrow-green2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#27ae60"/></marker><marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#f0a500"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#e74c3c"/></marker></defs><rect x="30" y="500" width="740" height="0" fill="none"/><rect x="290" y="455" width="220" height="35" fill="#27ae60" rx="8" opacity=".15"/><rect x="290" y="455" width="220" height="35" fill="none" rx="8" stroke="#27ae60" stroke-width="2"/><text x="400" y="477" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">swnd = min(cwnd, rwnd)</text></svg>