<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="PPP 帧格式：标志、地址、控制、协议、信息、FCS、标志七个字段，以及异步线路的字节填充规则">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.5}
    .y{fill:#eaf2fb;stroke:#2b2b2b;stroke-width:1.5}
    .g{fill:#f2f7f0;stroke:#2b2b2b;stroke-width:1.5}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 12px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .v{font:600 12.5px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .l{stroke:#2b2b2b;stroke-width:1.3;fill:none}
    .s{stroke:#b06a00;stroke-width:1.6;fill:none}
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06a00"/></marker>
  </defs>

  <text class="t" x="20" y="26">PPP 帧格式：7 个字段，固定开销 8 字节（1 + 1 + 1 + 2 + 2 + 1）</text>

  <!-- 字段名 -->
  <text class="n" x="66"  y="56">标志</text>
  <text class="n" x="126" y="56">地址</text>
  <text class="n" x="181" y="56">控制</text>
  <text class="n" x="236" y="56">协议</text>
  <text class="n" x="356" y="56">信息字段</text>
  <text class="n" x="586" y="56">FCS</text>
  <text class="n" x="638" y="56">标志</text>

  <!-- 帧体：60 起，总宽 620 -->
  <rect class="b" x="60"  y="64" width="52"  height="46"/>
  <rect class="b" x="112" y="64" width="52"  height="46"/>
  <rect class="b" x="164" y="64" width="52"  height="46"/>
  <rect class="b" x="216" y="64" width="60"  height="46"/>
  <rect class="g" x="276" y="64" width="300" height="46"/>
  <rect class="b" x="576" y="64" width="52"  height="46"/>
  <rect class="b" x="628" y="64" width="52"  height="46"/>

  <text class="v" x="70"  y="93">0x7E</text>
  <text class="v" x="122" y="93">0xFF</text>
  <text class="v" x="174" y="93">0x03</text>
  <text class="v" x="228" y="93">2 B</text>
  <text class="n" x="300" y="93">≤ 1500 B（默认 MTU）</text>
  <text class="v" x="586" y="93">2 B</text>
  <text class="v" x="638" y="93">0x7E</text>

  <!-- 字节数 -->
  <text class="n" x="74"  y="128">1B</text>
  <text class="n" x="126" y="128">1B</text>
  <text class="n" x="178" y="128">1B</text>
  <text class="n" x="222" y="128">0x0021=IP</text>
  <text class="n" x="300" y="128">0xC021=LCP　0x8021=IPCP</text>
  <text class="n" x="586" y="128">CRC</text>
  <text class="n" x="638" y="128">1B</text>

  <!-- 异步字节填充 -->
  <rect class="y" x="60" y="150" width="620" height="86" rx="4"/>
  <text class="t" x="74" y="174">异步线路：字节填充（只对「信息字段」里的这些字节做转义）</text>
  <text class="v" x="74" y="198">0x7E → 0x7D 0x5E</text>
  <text class="v" x="74" y="222">0x7D → 0x7D 0x5D</text>
  <text class="n" x="270" y="198">凡是比 0x20 小的控制字符，也一律写成 0x7D +（原字节 ⊕ 0x20）</text>
  <text class="n" x="270" y="222">接收端见到 0x7D 就把下一个字节 ⊕ 0x20 还原</text>

  <!-- 底部三条结论 -->
  <text class="n" x="60" y="264">同步线路改用零比特填充：每 5 个连续的 1 后面插一个 0（与 HDLC 相同），帧定界仍是 0x7E</text>
  <text class="n" x="60" y="292">PPP 没有序号、没有确认，只检错不纠错 —— 差错帧直接丢，属于不可靠的链路层协议</text>
  <text class="n" x="60" y="320">地址字段固定 0xFF（没有寻址功能）、控制字段固定 0x03，所以 PPP 只支持点对点链路</text>
  <text class="n" x="60" y="348">判帧长：开销 = 1 + 1 + 1 + 2 + 2 + 1 = 8 B；信息字段最长 1500 B，整帧最长 1508 B</text>
</svg>
