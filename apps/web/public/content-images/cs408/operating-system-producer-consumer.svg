<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="生产者-消费者问题的有界缓冲区：环形缓冲区用 in/out 指针、empty/full/mutex 三个信号量">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b06a00"/>
    </marker>
  </defs>
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .c{font:600 11px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .cell{fill:#fff;stroke:#94a3b8;stroke-width:1.2}
    .full{fill:#cfe3f7;stroke:#2563eb;stroke-width:1.3}
    .box{fill:#fdf3e6;stroke:#b06a00;stroke-width:1.3}
    .ar{stroke:#2b2b2b;stroke-width:1.6;fill:none}
    .rg{stroke:#b06a00;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
  </style>

  <text class="t" x="18" y="26">生产者-消费者：一个缓冲区、三个信号量</text>
  <text class="n" x="18" y="46">环形数组按 in 写入、按 out 读出；蓝格是已有数据，空白格是空位</text>

  <!-- 缓冲区 8 格 -->
  <rect class="cell" x="140" y="140" width="64" height="52"/><text class="c" x="172" y="171" text-anchor="middle">0</text>
  <rect class="cell" x="204" y="140" width="64" height="52"/><text class="c" x="236" y="171" text-anchor="middle">1</text>
  <rect class="full" x="268" y="140" width="64" height="52"/><text class="c" x="300" y="171" text-anchor="middle">2</text>
  <rect class="full" x="332" y="140" width="64" height="52"/><text class="c" x="364" y="171" text-anchor="middle">3</text>
  <rect class="full" x="396" y="140" width="64" height="52"/><text class="c" x="428" y="171" text-anchor="middle">4</text>
  <rect class="full" x="460" y="140" width="64" height="52"/><text class="c" x="492" y="171" text-anchor="middle">5</text>
  <rect class="cell" x="524" y="140" width="64" height="52"/><text class="c" x="556" y="171" text-anchor="middle">6</text>
  <rect class="cell" x="588" y="140" width="64" height="52"/><text class="c" x="620" y="171" text-anchor="middle">7</text>

  <!-- 指针 -->
  <path class="ar" d="M556 120 V136" marker-end="url(#a)"/>
  <text class="n" x="556" y="112" text-anchor="middle">in = 6</text>
  <path class="ar" d="M300 216 V196" marker-end="url(#a)"/>
  <text class="n" x="300" y="234" text-anchor="middle">out = 2</text>

  <!-- 生产者 / 消费者 -->
  <text class="s" x="120" y="86">生产者</text>
  <path class="ar" d="M180 96 H556 V128" marker-end="url(#a)"/>
  <text class="n" x="200" y="90">P(empty) → P(mutex) → 写 buffer[in]</text>

  <text class="s" x="120" y="262">消费者</text>
  <path class="ar" d="M180 272 H330 V212" marker-end="url(#a)"/>
  <text class="n" x="200" y="288">P(full) → P(mutex) → 读出 buffer[out]</text>

  <!-- 三个信号量 -->
  <text class="s" x="18" y="330">三个信号量</text>
  <rect class="box" x="18" y="342" width="210" height="56" rx="6"/>
  <text class="c" x="30" y="362">empty = 空位数 = 4</text>
  <text class="n" x="30" y="382">初值 N（缓冲区容量）</text>

  <rect class="box" x="246" y="342" width="210" height="56" rx="6"/>
  <text class="c" x="258" y="362">full = 数据数 = 4</text>
  <text class="n" x="258" y="382">初值 0</text>

  <rect class="box" x="474" y="342" width="268" height="56" rx="6"/>
  <text class="c" x="486" y="362">mutex = 1（互斥）</text>
  <text class="n" x="486" y="382">保护 in/out 与缓冲区，初值 1</text>

  <text class="n" x="18" y="414">注意：生产者必须先 P(empty) 再 P(mutex)；若反过来（先锁再等空位），双方可能互相等待——这是经典死锁错法。</text>
</svg>
