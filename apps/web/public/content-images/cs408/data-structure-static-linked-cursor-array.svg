<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="384" viewBox="0 0 760 384" role="img" aria-label="静态链表：游标数组里 next 存的是下标，物理顺序与逻辑顺序不同">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.3}
    .y{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.4}
    .z{fill:#efefef;stroke:#2b2b2b;stroke-width:1.3}
    .h{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.3}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .v{font:600 13px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .o{stroke:#b06a00;stroke-width:1.6;fill:none}
    .l{stroke:#2b2b2b;stroke-width:1.3;fill:none}
  </style>
  <defs>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06a00"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
  </defs>

  <text class="t" x="18" y="26">静态链表：用数组模拟链表 —— next 域存的是「下标（游标）」，不是地址</text>

  <!-- 行标签 -->
  <text class="s" x="24" y="100">下标</text>
  <text class="s" x="24" y="134">data</text>
  <text class="s" x="24" y="168">next</text>

  <!-- 下标行 -->
  <rect class="h" x="96" y="72" width="94" height="34"/>
  <rect class="h" x="190" y="72" width="94" height="34"/>
  <rect class="h" x="284" y="72" width="94" height="34"/>
  <rect class="h" x="378" y="72" width="94" height="34"/>
  <rect class="h" x="472" y="72" width="94" height="34"/>
  <rect class="h" x="566" y="72" width="94" height="34"/>
  <text class="v" x="136" y="95">0</text>
  <text class="v" x="230" y="95">1</text>
  <text class="v" x="324" y="95">2</text>
  <text class="v" x="418" y="95">3</text>
  <text class="v" x="512" y="95">4</text>
  <text class="v" x="606" y="95">5</text>

  <!-- data 行 -->
  <rect class="y" x="96" y="106" width="94" height="34"/>
  <rect class="z" x="190" y="106" width="94" height="34"/>
  <rect class="b" x="284" y="106" width="94" height="34"/>
  <rect class="z" x="378" y="106" width="94" height="34"/>
  <rect class="b" x="472" y="106" width="94" height="34"/>
  <rect class="b" x="566" y="106" width="94" height="34"/>
  <text class="n" x="126" y="129">头结点</text>
  <text class="n" x="222" y="129">空闲</text>
  <text class="v" x="324" y="129">A</text>
  <text class="n" x="410" y="129">空闲</text>
  <text class="v" x="512" y="129">B</text>
  <text class="v" x="606" y="129">C</text>

  <!-- next 行 -->
  <rect class="y" x="96" y="140" width="94" height="34"/>
  <rect class="z" x="190" y="140" width="94" height="34"/>
  <rect class="b" x="284" y="140" width="94" height="34"/>
  <rect class="z" x="378" y="140" width="94" height="34"/>
  <rect class="b" x="472" y="140" width="94" height="34"/>
  <rect class="b" x="566" y="140" width="94" height="34"/>
  <text class="v" x="136" y="163">2</text>
  <text class="v" x="230" y="163">3</text>
  <text class="v" x="324" y="163">4</text>
  <text class="v" x="418" y="163">-1</text>
  <text class="v" x="512" y="163">5</text>
  <text class="v" x="606" y="163">-1</text>

  <!-- 逻辑链 -->
  <path class="o" d="M144 178 L144 196 L330 196 L330 178" marker-end="url(#ao)"/>
  <path class="o" d="M336 196 L512 196"/>
  <path class="o" d="M518 196 L606 196 L606 178" marker-end="url(#ao)"/>
  <text class="n" x="170" y="214">沿 next 走：0 → 2（A）→ 4（B）→ 5（C）→ -1 结束</text>

  <!-- 结论 -->
  <text class="n" x="18" y="246">看这张表最该抓住的一点：数据 A、B、C 存在下标 2、4、5 —— 物理顺序不连续，逻辑顺序靠 next 串（2→4→5 才是 A→B→C）</text>
  <text class="n" x="18" y="268">灰色 = 空闲结点。它们靠自己的 next 串成「空闲链」（1 → 3 → -1），插入时从这里取结点，删除时挂回来</text>
  <text class="n" x="18" y="290">插入 B 到 A 之后：取空闲结点 1 存 B、令 next[1]=next[2]=4、再令 next[2]=1 —— 只改 2 个 next，一个元素都不用移动</text>
  <text class="n" x="18" y="312">删除 A：把 next[0] 改成 next[2]=4，再把下标 2 挂回空闲链 —— 同样不移动元素</text>
  <text class="n" x="18" y="334">约定：表尾 next = -1（有的教材用 0 或 MAXSIZE 表示，读题先看它的定义）；下标 0 作头结点不存数据</text>
  <text class="n" x="18" y="356">缺点：按位查找只能顺着 next 走，是 O(n)、不能随机存取；容量固定，满了插不进去 —— 适合「元素个数固定、又要频繁插删」的场景</text>
</svg>
