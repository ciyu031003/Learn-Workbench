<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#555"/></marker><marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#E74C3C"/></marker><marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#27AE60"/></marker></defs><text x="200" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Boyer-Moore 投票算法 — 主元素</text><text x="20" y="42" text-anchor="middle" font-size="10" fill="#AAA">0</text><text x="90" y="42" text-anchor="middle" font-size="10" fill="#AAA">1</text><text x="160" y="42" text-anchor="middle" font-size="10" fill="#AAA">2</text><text x="230" y="42" text-anchor="middle" font-size="10" fill="#AAA">3</text><text x="300" y="42" text-anchor="middle" font-size="10" fill="#AAA">4</text><text x="370" y="42" text-anchor="middle" font-size="10" fill="#AAA">5</text><text x="440" y="42" text-anchor="middle" font-size="10" fill="#AAA">6</text><text x="510" y="42" text-anchor="middle" font-size="10" fill="#AAA">7</text><rect x="2" y="47" width="36" height="36" rx="5" fill="#FEF9C0" stroke="#E0BB00" stroke-width="1.5"/><text x="20" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#B8860B">3</text><rect x="72" y="47" width="36" height="36" rx="5" fill="#FEF9C0" stroke="#E0BB00" stroke-width="1.5"/><text x="90" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#B8860B">3</text><rect x="142" y="47" width="36" height="36" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="160" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C7BB6">4</text><rect x="212" y="47" width="36" height="36" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="230" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C7BB6">2</text><rect x="282" y="47" width="36" height="36" rx="5" fill="#FEF9C0" stroke="#E0BB00" stroke-width="1.5"/><text x="300" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#B8860B">3</text><rect x="352" y="47" width="36" height="36" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="370" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C7BB6">1</text><rect x="422" y="47" width="36" height="36" rx="5" fill="#FEF9C0" stroke="#E0BB00" stroke-width="1.5"/><text x="440" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#B8860B">3</text><rect x="492" y="47" width="36" height="36" rx="5" fill="#FEF9C0" stroke="#E0BB00" stroke-width="1.5"/><text x="510" y="71" text-anchor="middle" font-size="16" font-weight="bold" fill="#B8860B">3</text><text x="20" y="98" text-anchor="middle" font-size="10" fill="#27AE60">3/1</text><text x="90" y="98" text-anchor="middle" font-size="10" fill="#27AE60">3/2</text><text x="160" y="98" text-anchor="middle" font-size="10" fill="#E74C3C">3/1</text><text x="230" y="98" text-anchor="middle" font-size="10" fill="#E74C3C">3/0→2/1</text><text x="300" y="98" text-anchor="middle" font-size="10" fill="#27AE60">3/2</text><text x="370" y="98" text-anchor="middle" font-size="10" fill="#E74C3C">3/1</text><text x="440" y="98" text-anchor="middle" font-size="10" fill="#27AE60">3/2</text><text x="510" y="98" text-anchor="middle" font-size="10" fill="#27AE60">3/3</text><text x="20" y="109" text-anchor="middle" font-size="9" fill="#AAA">num/cnt</text><rect x="570" y="47" width="10" height="10" rx="2" fill="#27AE60"/><text x="584" y="57" font-size="11" fill="#555">cnt+1（相同）</text><rect x="570" y="63" width="10" height="10" rx="2" fill="#E74C3C"/><text x="584" y="73" font-size="11" fill="#555">cnt-1（不同）</text><text x="570" y="90" font-size="11" fill="#555">cnt→0 时更换候选</text><text x="570" y="105" font-size="11" fill="#B8860B">最终候选 = 3</text><text x="20" y="125" font-size="11" fill="#888">① 第一遍扫描（对消法）→ 候选 num = 3</text><text x="20" y="141" font-size="11" fill="#888">② 第二遍验证：出现 5 次 > 8/2 = 4 → 3 是主元素 ✓</text><line x1="0" y1="158" x2="760" y2="158" stroke="#DDD" stroke-width="1" stroke-dasharray="5,4"/><text x="200" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">桶标记（原地哈希） — 未出现的最小正整数</text><text x="20" y="200" text-anchor="middle" font-size="10" fill="#AAA">0</text><text x="90" y="200" text-anchor="middle" font-size="10" fill="#AAA">1</text><text x="160" y="200" text-anchor="middle" font-size="10" fill="#AAA">2</text><text x="230" y="200" text-anchor="middle" font-size="10" fill="#AAA">3</text><rect x="2" y="205" width="36" height="36" rx="5" fill="#FDECEA" stroke="#E74C3C" stroke-width="1.5"/><text x="20" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#E74C3C">-5</text><rect x="72" y="205" width="36" height="36" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="90" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C7BB6">3</text><rect x="142" y="205" width="36" height="36" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="160" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C7BB6">2</text><rect x="212" y="205" width="36" height="36" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="230" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C7BB6">3</text><text x="310" y="218" font-size="11" fill="#555">① 将范围外的元素置 0</text><rect x="2" y="205" width="36" height="36" rx="5" fill="#F5F5F5" stroke="#AAA" stroke-width="1.5"/><text x="20" y="229" text-anchor="middle" font-size="15" font-weight="bold" fill="#AAA">0</text><text x="20" y="260" text-anchor="middle" font-size="10" fill="#E74C3C">-5 → 0</text><text x="90" y="260" text-anchor="middle" font-size="10" fill="#AAA">保留</text><text x="160" y="260" text-anchor="middle" font-size="10" fill="#AAA">保留</text><text x="230" y="260" text-anchor="middle" font-size="10" fill="#AAA">保留</text><text x="310" y="258" font-size="11" fill="#555">② 用下标符号标记出现过的正整数</text><text x="310" y="274" font-size="11" fill="#555">a[3-1]=a[2] 标负；a[2-1]=a[1] 标负</text><rect x="2" y="280" width="36" height="36" rx="5" fill="#F5F5F5" stroke="#AAA" stroke-width="1.5"/><text x="20" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#AAA">0</text><rect x="72" y="280" width="36" height="36" rx="5" fill="#FDECEA" stroke="#E74C3C" stroke-width="1.5"/><text x="90" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#E74C3C">-3</text><text x="90" y="330" text-anchor="middle" font-size="9" fill="#E74C3C">2 出现 ✓</text><rect x="142" y="280" width="36" height="36" rx="5" fill="#FDECEA" stroke="#E74C3C" stroke-width="1.5"/><text x="160" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#E74C3C">-2</text><text x="160" y="330" text-anchor="middle" font-size="9" fill="#E74C3C">3 出现 ✓</text><rect x="212" y="280" width="36" height="36" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="230" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C7BB6">+3</text><text x="230" y="330" text-anchor="middle" font-size="9" fill="#27AE60">仍正 → 4 未出现</text><text x="310" y="294" font-size="11" fill="#555">③ 找第一个仍为正数的位置</text><rect x="2" y="280" width="36" height="36" rx="5" fill="none" stroke="#AAA" stroke-width="2"/><rect x="72" y="280" width="36" height="36" rx="5" fill="none" stroke="#AAA" stroke-width="2"/><rect x="142" y="280" width="36" height="36" rx="5" fill="none" stroke="#AAA" stroke-width="2"/><rect x="212" y="280" width="36" height="36" rx="5" fill="none" stroke="#27AE60" stroke-width="3"/><text x="310" y="310" font-size="12" fill="#27AE60" font-weight="bold">答：未出现的最小正整数 = 4</text></svg>