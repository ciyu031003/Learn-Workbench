<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="4 路组相联 Cache：32 位地址划分为 18 位标记、8 位组号、6 位块内地址，组号选中一组后并行比较 4 个标记">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .c{font:600 11px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .tag{fill:#fde3c8;stroke:#b06a00;stroke-width:1.3}
    .idx{fill:#d8ecd0;stroke:#3f7a34;stroke-width:1.3}
    .off{fill:#e6dcf5;stroke:#6b3fa0;stroke-width:1.3}
    .way{fill:#fff;stroke:#2b2b2b;stroke-width:1.2}
    .grp{fill:#fff;stroke:#2b2b2b;stroke-width:1.4}
    .ar{stroke:#2b2b2b;stroke-width:1.5;fill:none}
  </style>

  <text class="t" x="18" y="26">4 路组相联：32 位地址怎么切成"标记 / 组号 / 块内"</text>
  <text class="n" x="18" y="46">例：Cache 数据区 64 KB、块 64 B、4 路组相联 —— 先算组数，再算三段各几位</text>

  <!-- 地址条 -->
  <rect class="tag" x="120" y="66" width="290" height="48"/>
  <text class="c" x="265" y="86" text-anchor="middle">标记 tag = 18 位</text>
  <text class="n" x="265" y="104" text-anchor="middle">bit 31 ~ 14（与 4 个 way 的标记比）</text>

  <rect class="idx" x="410" y="66" width="130" height="48"/>
  <text class="c" x="475" y="86" text-anchor="middle">组号 = 8 位</text>
  <text class="n" x="475" y="104" text-anchor="middle">bit 13 ~ 6</text>

  <rect class="off" x="540" y="66" width="120" height="48"/>
  <text class="c" x="600" y="86" text-anchor="middle">块内 = 6 位</text>
  <text class="n" x="600" y="104" text-anchor="middle">bit 5 ~ 0</text>

  <!-- 组号 → 选组 -->
  <path class="ar" d="M475 114 V150" marker-end="url(#a)"/>
  <text class="n" x="487" y="138">按组号选中一组（共 256 组）</text>

  <!-- Cache 组 -->
  <rect class="grp" x="120" y="150" width="560" height="100" rx="8"/>
  <text class="s" x="132" y="170">第 i 组的 4 路（4 个标记并行比较）</text>
  <rect class="way" x="132" y="180" width="120" height="54" rx="5"/>
  <text class="c" x="192" y="200" text-anchor="middle">路 0</text>
  <text class="n" x="192" y="220" text-anchor="middle">标记 + 有效位</text>
  <rect class="way" x="264" y="180" width="120" height="54" rx="5"/>
  <text class="c" x="324" y="200" text-anchor="middle">路 1</text>
  <text class="n" x="324" y="220" text-anchor="middle">标记 + 有效位</text>
  <rect class="way" x="396" y="180" width="120" height="54" rx="5"/>
  <text class="c" x="456" y="200" text-anchor="middle">路 2</text>
  <text class="n" x="456" y="220" text-anchor="middle">标记 + 有效位</text>
  <rect class="way" x="528" y="180" width="120" height="54" rx="5"/>
  <text class="c" x="588" y="200" text-anchor="middle">路 3</text>
  <text class="n" x="588" y="220" text-anchor="middle">标记 + 有效位</text>

  <text class="n" x="132" y="272">4 个标记与地址 tag 并行比较：任一相等且有效位 = 1 → 命中；都不等 → 缺失（整块调入或替换）</text>

  <!-- 公式 -->
  <text class="s" x="18" y="304">两步算出这三段：</text>
  <text class="n" x="18" y="328">① 组数 = Cache 数据区 ÷（块大小 × 路数）= 64 KB ÷ (64 B × 4) = 1024 ÷ 4 = 256 组 → 组号 = log₂256 = 8 位；</text>
  <text class="n" x="18" y="350">② 块内 = log₂(64 B) = 6 位；标记 = 32 − 8 − 6 = 18 位（三段加起来必须等于地址位数）。</text>
  <text class="n" x="18" y="378">块内地址不参与比较，只用来在命中的那一块里取字节；组号只负责"选哪一组"，也不参与比较。</text>
  <text class="n" x="18" y="400">总容量要分清：题说"数据区 64 KB"时组数按数据算；若说"Cache 总容量"，还要加上标记位与有效位的开销。</text>
</svg>
