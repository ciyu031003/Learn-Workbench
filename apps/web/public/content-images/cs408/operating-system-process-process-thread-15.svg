<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#4b5563"/></marker><marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b91c1c"/></marker><style>.panel{fill:none;stroke:#1f2937;stroke-width:1.5}.userBg{fill:#eff6ff}.kernelBg{fill:#fef2f2}.divider{stroke:#6b7280;stroke-width:1.4;stroke-dasharray:6 4}.title{font:700 17px sans-serif;fill:#111827}.label{font:13px sans-serif;fill:#111827}.bold{font:700 13px sans-serif;fill:#111827}.space{font:12px sans-serif;fill:#6b7280}.note{font:12px sans-serif;fill:#374151}.process{fill:#fff;stroke:#2563eb;stroke-width:1.5}.thread{fill:#dbeafe;stroke:#1d4ed8;stroke-width:1.2}.lib{fill:#fef3c7;stroke:#b45309;stroke-width:1.2}.ktcb{fill:#fee2e2;stroke:#b91c1c;stroke-width:1.2}.scheduler{fill:#fff;stroke:#dc2626;stroke-width:1.5}.cpu{fill:#e5e7eb;stroke:#374151;stroke-width:1.2}.arrow{stroke:#4b5563;stroke-width:1.3;fill:none;marker-end:url(#arr)}.link{stroke:#b91c1c;stroke-width:1.3;fill:none;stroke-dasharray:5 3;marker-end:url(#arrRed)}</style></defs><g><rect x="20" y="10" width="440" height="600" rx="8" class="panel"/><text x="240" y="35" text-anchor="middle" class="title">用户级线程 (ULT)</text><rect x="30" y="50" width="420" height="320" class="userBg" rx="4"/><text x="40" y="68" class="space">用户空间</text><rect x="30" y="390" width="420" height="210" class="kernelBg" rx="4"/><text x="40" y="408" class="space">内核空间</text><line x1="30" y1="380" x2="450" y2="380" class="divider"/><text x="445" y="376" text-anchor="end" class="note">用户 / 内核边界</text><rect x="55" y="88" width="370" height="270" rx="6" class="process"/><text x="68" y="108" class="bold">进程</text><rect x="75" y="130" width="140" height="80" rx="4" class="lib"/><text x="145" y="162" text-anchor="middle" class="bold">线程库</text><text x="145" y="182" text-anchor="middle" class="note">创建 / 调度 / 切换</text><text x="145" y="200" text-anchor="middle" class="note">(用户态完成)</text><rect x="255" y="128" width="150" height="28" rx="4" class="thread"/><text x="330" y="147" text-anchor="middle" class="label">线程 T1</text><rect x="255" y="164" width="150" height="28" rx="4" class="thread"/><text x="330" y="183" text-anchor="middle" class="label">线程 T2</text><rect x="255" y="200" width="150" height="28" rx="4" class="thread"/><text x="330" y="219" text-anchor="middle" class="label">线程 T3</text><path d="M215 148l40-6" class="arrow"/><path d="M215 170l40 8" class="arrow"/><path d="M215 192l40 22" class="arrow"/><text x="70" y="248" class="note">• 线程实体位于用户空间</text><text x="70" y="268" class="note">• 切换不陷入内核，开销小、速度快</text><text x="70" y="288" class="note">• 一个线程阻塞会导致整个进程阻塞</text><text x="70" y="308" class="note">• 无法被内核调度到多核并行执行</text><text x="70" y="328" class="note">• 可跨 OS 移植（依赖线程库）</text><rect x="130" y="440" width="220" height="90" rx="6" class="scheduler"/><text x="240" y="467" text-anchor="middle" class="bold">PCB（进程）</text><text x="240" y="490" text-anchor="middle" class="note">内核只看到 1 个执行实体</text><text x="240" y="510" text-anchor="middle" class="note">对线程完全无感知</text><text x="240" y="560" text-anchor="middle" class="note">内核调度以进程为单位</text><text x="240" y="578" text-anchor="middle" class="note">同一时刻只有 1 个线程能运行</text><path d="M240 358v82" class="link"/></g><g transform="translate(480,0)"><rect x="20" y="10" width="440" height="600" rx="8" class="panel"/><text x="240" y="35" text-anchor="middle" class="title">内核级线程 (KLT)</text><rect x="30" y="50" width="420" height="200" class="userBg" rx="4"/><text x="40" y="68" class="space">用户空间</text><rect x="30" y="270" width="420" height="330" class="kernelBg" rx="4"/><text x="40" y="288" class="space">内核空间</text><line x1="30" y1="260" x2="450" y2="260" class="divider"/><text x="445" y="256" text-anchor="end" class="note">用户 / 内核边界</text><rect x="55" y="88" width="370" height="150" rx="6" class="process"/><text x="68" y="108" class="bold">进程</text><rect x="80" y="128" width="100" height="30" rx="4" class="thread"/><text x="130" y="148" text-anchor="middle" class="label">线程 T1</text><rect x="190" y="128" width="100" height="30" rx="4" class="thread"/><text x="240" y="148" text-anchor="middle" class="label">线程 T2</text><rect x="300" y="128" width="100" height="30" rx="4" class="thread"/><text x="350" y="148" text-anchor="middle" class="label">线程 T3</text><text x="70" y="185" class="note">• 用户程序通过系统调用</text><text x="70" y="203" class="note">请求内核创建/管理线程</text><text x="70" y="221" class="note">• 每个线程都有内核对应实体</text><rect x="55" y="308" width="370" height="46" rx="4" class="scheduler"/><text x="240" y="336" text-anchor="middle" class="bold">内核线程调度器</text><rect x="80" y="378" width="100" height="56" rx="4" class="ktcb"/><text x="130" y="402" text-anchor="middle" class="bold">KTCB 1</text><text x="130" y="422" text-anchor="middle" class="note">对应 T1</text><rect x="190" y="378" width="100" height="56" rx="4" class="ktcb"/><text x="240" y="402" text-anchor="middle" class="bold">KTCB 2</text><text x="240" y="422" text-anchor="middle" class="note">对应 T2</text><rect x="300" y="378" width="100" height="56" rx="4" class="ktcb"/><text x="350" y="402" text-anchor="middle" class="bold">KTCB 3</text><text x="350" y="422" text-anchor="middle" class="note">对应 T3</text><path d="M130 158V378" class="link"/><path d="M240 158V308" class="link"/><path d="M350 158V378" class="link"/><path d="M130 354v24" class="arrow"/><path d="M350 354v24" class="arrow"/><rect x="90" y="470" width="80" height="34" rx="4" class="cpu"/><text x="130" y="492" text-anchor="middle" class="label">CPU 0</text><rect x="200" y="470" width="80" height="34" rx="4" class="cpu"/><text x="240" y="492" text-anchor="middle" class="label">CPU 1</text><rect x="310" y="470" width="80" height="34" rx="4" class="cpu"/><text x="350" y="492" text-anchor="middle" class="label">CPU 2</text><path d="M130 434v36" class="arrow"/><path d="M240 434v36" class="arrow"/><path d="M350 434v36" class="arrow"/><text x="70" y="535" class="note">• 线程的创建/切换需陷入内核，开销较大</text><text x="70" y="555" class="note">• 一个线程阻塞不影响进程中其他线程</text><text x="70" y="575" class="note">• 内核可将线程调度到不同 CPU 并行执行</text></g></svg>