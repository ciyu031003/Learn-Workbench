<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Microsoft Yahei, sans-serif" font-size="13"><defs><marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#333"/></marker></defs><style>.title{font-weight:700;font-size:15px}.proc{fill:#bbdefb;stroke:#1565c0}.kern{fill:#ffe0b2;stroke:#ef6c00}.pipe{fill:#c8e6c9;stroke:#2e7d32}.shm{fill:#f8bbd0;stroke:#ad1457}.mq{fill:#d1c4e9;stroke:#4527a0}.sig{fill:#ffccbc;stroke:#bf360c}.sock{fill:#b2dfdb;stroke:#00695c}.small{font-size:11px;fill:#444}</style><text x="490" y="24" text-anchor="middle" class="title">五类进程间通信（IPC）对比</text><line x1="350" y1="40" x2="350" y2="175" stroke="#bbb" stroke-dasharray="4,3"/><line x1="690" y1="40" x2="690" y2="175" stroke="#bbb" stroke-dasharray="4,3"/><line x1="350" y1="190" x2="350" y2="325" stroke="#bbb" stroke-dasharray="4,3"/><line x1="690" y1="190" x2="690" y2="325" stroke="#bbb" stroke-dasharray="4,3"/><line x1="20" y1="185" x2="960" y2="185" stroke="#bbb" stroke-dasharray="4,3"/><g transform="translate(20,50)"><text x="160" y="14" text-anchor="middle" font-weight="bold">① 管道 / FIFO</text><rect x="0" y="30" width="80" height="40" class="proc" rx="4"/><text x="40" y="55" text-anchor="middle">P1</text><rect x="240" y="30" width="80" height="40" class="proc" rx="4"/><text x="280" y="55" text-anchor="middle">P2</text><rect x="100" y="36" width="120" height="28" class="pipe" rx="4"/><text x="160" y="55" text-anchor="middle" class="small">字节流（内核缓冲）</text><path d="M80 50h20" stroke="#333" marker-end="url(#arr6)"/><path d="M220 50h20" stroke="#333" marker-end="url(#arr6)"/><text x="160" y="92" text-anchor="middle" class="small">单向、FIFO、亲缘关系（FIFO 不需要）</text><text x="160" y="108" text-anchor="middle" class="small">效率较低，适合简单流</text></g><g transform="translate(360,50)"><text x="160" y="14" text-anchor="middle" font-weight="bold">② 共享内存</text><rect x="0" y="30" width="80" height="40" class="proc" rx="4"/><text x="40" y="55" text-anchor="middle">P1</text><rect x="240" y="30" width="80" height="40" class="proc" rx="4"/><text x="280" y="55" text-anchor="middle">P2</text><rect x="100" y="34" width="120" height="32" class="shm" rx="4"/><text x="160" y="55" text-anchor="middle" class="small">同一物理内存段</text><path d="M80 50h20" stroke="#333" marker-end="url(#arr6)"/><path d="M240 50H220" stroke="#333" marker-end="url(#arr6)"/><text x="160" y="92" text-anchor="middle" class="small">效率最高、零拷贝</text><text x="160" y="108" text-anchor="middle" class="small">需配合信号量/锁防竞争</text></g><g transform="translate(700,50)"><text x="140" y="14" text-anchor="middle" font-weight="bold">③ 消息队列</text><rect x="0" y="30" width="70" height="40" class="proc" rx="4"/><text x="35" y="55" text-anchor="middle">P1</text><rect x="210" y="30" width="70" height="40" class="proc" rx="4"/><text x="245" y="55" text-anchor="middle">P2</text><rect x="85" y="34" width="110" height="32" class="mq" rx="4"/><text x="140" y="46" text-anchor="middle" class="small">[msg|msg|msg]</text><text x="140" y="62" text-anchor="middle" class="small">内核队列</text><path d="M70 50H85" stroke="#333" marker-end="url(#arr6)"/><path d="M195 50h15" stroke="#333" marker-end="url(#arr6)"/><text x="140" y="92" text-anchor="middle" class="small">按消息单元，有类型/优先级</text><text x="140" y="108" text-anchor="middle" class="small">结构化、独立性强</text></g><g transform="translate(20,200)"><text x="160" y="14" text-anchor="middle" font-weight="bold">④ 信号 (Signal)</text><rect x="0" y="30" width="80" height="40" class="proc" rx="4"/><text x="40" y="55" text-anchor="middle">P1</text><rect x="240" y="30" width="80" height="40" class="proc" rx="4"/><text x="280" y="55" text-anchor="middle">P2</text><rect x="100" y="36" width="120" height="28" class="sig" rx="4"/><text x="160" y="55" text-anchor="middle" class="small">SIGINT / SIGUSR1 ...</text><path d="M80 50h20" stroke="#bf360c" marker-end="url(#arr6)"/><path d="M220 50h20" stroke="#bf360c" marker-end="url(#arr6)"/><text x="160" y="92" text-anchor="middle" class="small">异步通知，无数据载荷</text><text x="160" y="108" text-anchor="middle" class="small">用于事件、异常、终止</text></g><g transform="translate(360,200)"><text x="160" y="14" text-anchor="middle" font-weight="bold">⑤ 套接字 (Socket)</text><rect x="0" y="30" width="80" height="40" class="proc" rx="4"/><text x="40" y="55" text-anchor="middle">P1</text><rect x="240" y="30" width="80" height="40" class="proc" rx="4"/><text x="280" y="55" text-anchor="middle">P2</text><rect x="100" y="36" width="120" height="28" class="sock" rx="4"/><text x="160" y="55" text-anchor="middle" class="small">网络协议栈</text><path d="M80 50h20" stroke="#333" marker-end="url(#arr6)"/><path d="M240 50H220" stroke="#333" marker-end="url(#arr6)"/><text x="160" y="92" text-anchor="middle" class="small">本机或跨机器双向通信</text><text x="160" y="108" text-anchor="middle" class="small">分布式系统常用</text></g><g transform="translate(700,200)"><text x="140" y="14" text-anchor="middle" font-weight="bold">⑥ 信号量 (Semaphore)</text><rect x="0" y="30" width="70" height="40" class="proc" rx="4"/><text x="35" y="55" text-anchor="middle">P1</text><rect x="210" y="30" width="70" height="40" class="proc" rx="4"/><text x="245" y="55" text-anchor="middle">P2</text><rect x="85" y="36" width="110" height="28" class="kern" rx="4"/><text x="140" y="56" text-anchor="middle" class="small">count = N (内核维护)</text><path d="M70 50H85" stroke="#333" marker-end="url(#arr6)"/><path d="M210 50H195" stroke="#333" marker-end="url(#arr6)"/><text x="140" y="92" text-anchor="middle" class="small">不传数据，做同步/互斥</text><text x="140" y="108" text-anchor="middle" class="small">P/V 操作维护计数</text></g><g transform="translate(20,350)"><text x="0" y="0" font-weight="bold">关键属性对比</text><rect x="0" y="10" width="940" height="150" fill="#fafafa" stroke="#bbb"/><line x1="0" y1="40" x2="940" y2="40" stroke="#bbb"/><line x1="100" y1="10" x2="100" y2="160" stroke="#bbb"/><line x1="240" y1="10" x2="240" y2="160" stroke="#bbb"/><line x1="380" y1="10" x2="380" y2="160" stroke="#bbb"/><line x1="520" y1="10" x2="520" y2="160" stroke="#bbb"/><line x1="660" y1="10" x2="660" y2="160" stroke="#bbb"/><line x1="800" y1="10" x2="800" y2="160" stroke="#bbb"/><line x1="0" y1="70" x2="940" y2="70" stroke="#bbb"/><line x1="0" y1="100" x2="940" y2="100" stroke="#bbb"/><line x1="0" y1="130" x2="940" y2="130" stroke="#bbb"/><text x="50" y="30" text-anchor="middle" font-weight="bold">属性</text><text x="170" y="30" text-anchor="middle" font-weight="bold">管道</text><text x="310" y="30" text-anchor="middle" font-weight="bold">共享内存</text><text x="450" y="30" text-anchor="middle" font-weight="bold">消息队列</text><text x="590" y="30" text-anchor="middle" font-weight="bold">信号</text><text x="730" y="30" text-anchor="middle" font-weight="bold">套接字</text><text x="870" y="30" text-anchor="middle" font-weight="bold">信号量</text><text x="50" y="60" text-anchor="middle">数据载荷</text><text x="170" y="60" text-anchor="middle">字节流</text><text x="310" y="60" text-anchor="middle">任意结构</text><text x="450" y="60" text-anchor="middle">消息</text><text x="590" y="60" text-anchor="middle">无</text><text x="730" y="60" text-anchor="middle">字节流/包</text><text x="870" y="60" text-anchor="middle">无</text><text x="50" y="90" text-anchor="middle">效率</text><text x="170" y="90" text-anchor="middle">较低</text><text x="310" y="90" text-anchor="middle" fill="#2e7d32">最高</text><text x="450" y="90" text-anchor="middle">中</text><text x="590" y="90" text-anchor="middle">高(无数据)</text><text x="730" y="90" text-anchor="middle">中</text><text x="870" y="90" text-anchor="middle">高</text><text x="50" y="120" text-anchor="middle">方向</text><text x="170" y="120" text-anchor="middle">单向</text><text x="310" y="120" text-anchor="middle">双向</text><text x="450" y="120" text-anchor="middle">双向</text><text x="590" y="120" text-anchor="middle">单向</text><text x="730" y="120" text-anchor="middle">双向</text><text x="870" y="120" text-anchor="middle">-</text><text x="50" y="150" text-anchor="middle">同步需求</text><text x="170" y="150" text-anchor="middle">内核保证</text><text x="310" y="150" text-anchor="middle" fill="#c62828">需用户同步</text><text x="450" y="150" text-anchor="middle">内核保证</text><text x="590" y="150" text-anchor="middle">异步</text><text x="730" y="150" text-anchor="middle">内核保证</text><text x="870" y="150" text-anchor="middle">本身就是同步</text></g></svg>