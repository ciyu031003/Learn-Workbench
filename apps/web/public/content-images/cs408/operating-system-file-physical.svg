<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="文件的三种物理结构：连续分配占一段连续块、链接分配用块内指针串起来、索引分配用索引块指向各数据块">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b06a00"/>
    </marker>
  </defs>
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .c{font:600 11px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .cell{fill:#fff;stroke:#94a3b8;stroke-width:1.1}
    .data{fill:#cfe3f7;stroke:#2563eb;stroke-width:1.2}
    .idx{fill:#fde3c8;stroke:#b06a00;stroke-width:1.3}
    .a{stroke:#b06a00;stroke-width:1.5;fill:none}
  </style>

  <text class="t" x="18" y="26">文件的三种物理结构：连续 / 链接 / 索引</text>
  <text class="n" x="18" y="46">同一行是一串磁盘块（0~9），蓝色是文件占用的块——看图重点在"这些块之间怎么找到彼此"</text>

  <!-- 连续分配 -->
  <text class="s" x="18" y="78">① 连续分配：文件占一段「连续」的块（起始块 + 长度）</text>
  <rect class="cell" x="120" y="96" width="58" height="40"/><text class="c" x="149" y="121" text-anchor="middle">0</text>
  <rect class="cell" x="178" y="96" width="58" height="40"/><text class="c" x="207" y="121" text-anchor="middle">1</text>
  <rect class="data" x="236" y="96" width="58" height="40"/><text class="c" x="265" y="121" text-anchor="middle">2</text>
  <rect class="data" x="294" y="96" width="58" height="40"/><text class="c" x="323" y="121" text-anchor="middle">3</text>
  <rect class="data" x="352" y="96" width="58" height="40"/><text class="c" x="381" y="121" text-anchor="middle">4</text>
  <rect class="data" x="410" y="96" width="58" height="40"/><text class="c" x="439" y="121" text-anchor="middle">5</text>
  <rect class="cell" x="468" y="96" width="58" height="40"/><text class="c" x="497" y="121" text-anchor="middle">6</text>
  <rect class="cell" x="526" y="96" width="58" height="40"/><text class="c" x="555" y="121" text-anchor="middle">7</text>
  <rect class="cell" x="584" y="96" width="58" height="40"/><text class="c" x="613" y="121" text-anchor="middle">8</text>
  <rect class="cell" x="642" y="96" width="58" height="40"/><text class="c" x="671" y="121" text-anchor="middle">9</text>
  <text class="n" x="120" y="154">FCB 里只记"起始块 2、长度 4"</text>
  <text class="n" x="120" y="172">优点：随机访问（第 k 块 = 起始 + k）、顺序读最快；缺点：要连续空间、易外部碎片、文件难增长</text>

  <!-- 链接分配 -->
  <text class="s" x="18" y="204">② 链接分配：块可以散落，靠块内的 next 指针串起来</text>
  <path class="a" d="M236 212 Q294 194 352 212" marker-end="url(#ar)"/>
  <path class="a" d="M410 212 Q439 194 468 212" marker-end="url(#ar)"/>
  <path class="a" d="M526 212 Q555 194 584 212" marker-end="url(#ar)"/>
  <rect class="cell" x="120" y="216" width="58" height="40"/><text class="c" x="149" y="241" text-anchor="middle">0</text>
  <rect class="data" x="178" y="216" width="58" height="40"/><text class="c" x="207" y="241" text-anchor="middle">1</text>
  <rect class="cell" x="236" y="216" width="58" height="40"/><text class="c" x="265" y="241" text-anchor="middle">2</text>
  <rect class="cell" x="294" y="216" width="58" height="40"/><text class="c" x="323" y="241" text-anchor="middle">3</text>
  <rect class="data" x="352" y="216" width="58" height="40"/><text class="c" x="381" y="241" text-anchor="middle">4</text>
  <rect class="cell" x="410" y="216" width="58" height="40"/><text class="c" x="439" y="241" text-anchor="middle">5</text>
  <rect class="data" x="468" y="216" width="58" height="40"/><text class="c" x="497" y="241" text-anchor="middle">6</text>
  <rect class="cell" x="526" y="216" width="58" height="40"/><text class="c" x="555" y="241" text-anchor="middle">7</text>
  <rect class="data" x="584" y="216" width="58" height="40"/><text class="c" x="613" y="241" text-anchor="middle">8</text>
  <rect class="cell" x="642" y="216" width="58" height="40"/><text class="c" x="671" y="241" text-anchor="middle">9</text>
  <text class="n" x="120" y="274">块的末尾存"下一块的块号"，读第 k 块必须从头顺着链走</text>
  <text class="n" x="120" y="292">缺点：只能顺序访问、指针占空间；改进：把指针集中到内存的 FAT 表（显式链接）</text>

  <!-- 索引分配 -->
  <text class="s" x="18" y="304">③ 索引分配：专门拿一个索引块，里面放该文件所有块的块号</text>
  <path class="a" d="M323 336 V330 H207 V336" marker-end="url(#ar)"/>
  <path class="a" d="M323 336 V324 H439 V336" marker-end="url(#ar)"/>
  <path class="a" d="M323 336 V318 H555 V336" marker-end="url(#ar)"/>
  <path class="a" d="M323 336 V312 H671 V336" marker-end="url(#ar)"/>
  <rect class="cell" x="120" y="336" width="58" height="40"/><text class="c" x="149" y="361" text-anchor="middle">0</text>
  <rect class="data" x="178" y="336" width="58" height="40"/><text class="c" x="207" y="361" text-anchor="middle">1</text>
  <rect class="cell" x="236" y="336" width="58" height="40"/><text class="c" x="265" y="361" text-anchor="middle">2</text>
  <rect class="idx" x="294" y="336" width="58" height="40"/><text class="c" x="323" y="361" text-anchor="middle">3</text>
  <rect class="cell" x="352" y="336" width="58" height="40"/><text class="c" x="381" y="361" text-anchor="middle">4</text>
  <rect class="data" x="410" y="336" width="58" height="40"/><text class="c" x="439" y="361" text-anchor="middle">5</text>
  <rect class="cell" x="468" y="336" width="58" height="40"/><text class="c" x="497" y="361" text-anchor="middle">6</text>
  <rect class="data" x="526" y="336" width="58" height="40"/><text class="c" x="555" y="361" text-anchor="middle">7</text>
  <rect class="cell" x="584" y="336" width="58" height="40"/><text class="c" x="613" y="361" text-anchor="middle">8</text>
  <rect class="data" x="642" y="336" width="58" height="40"/><text class="c" x="671" y="361" text-anchor="middle">9</text>
  <text class="n" x="120" y="394">橙色 3 号块是索引块，里面记着 {1, 5, 7, 9} 四个块号</text>
  <text class="n" x="120" y="412">优点：支持随机访问、文件易增长；缺点：索引块占空间，文件大时要多级索引（一级→二级→三级）</text>
</svg>
