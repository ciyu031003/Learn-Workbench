<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI', 'PingFang SC', sans-serif"><rect width="820" height="420" fill="#fafafa" rx="8"/><line x1="40" y1="60" x2="780" y2="60" stroke="#ccc" stroke-width="1.5"/><text x="785" y="64" font-size="12" fill="#999">t</text><rect x="60" y="38" width="140" height="44" fill="#e8e8f0" rx="4"/><text x="130" y="56" text-anchor="middle" font-size="12" fill="#555">信道忙</text><text x="130" y="72" text-anchor="middle" font-size="11" fill="#888">(上一帧传输)</text><line x1="200" y1="30" x2="200" y2="100" stroke="#aaa" stroke-dasharray="4,3" stroke-width="1.2"/><text x="200" y="24" text-anchor="middle" font-size="10" fill="#aaa">帧结束</text><rect x="200" y="38" width="60" height="44" fill="#c8e6c9" rx="4"/><text x="230" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">SIFS</text><text x="230" y="70" text-anchor="middle" font-size="10" fill="#388e3c">最短</text><line x1="200" y1="96" x2="260" y2="96" stroke="#2e7d32" stroke-width="1.5"/><line x1="200" y1="92" x2="200" y2="100" stroke="#2e7d32" stroke-width="1.5"/><line x1="260" y1="92" x2="260" y2="100" stroke="#2e7d32" stroke-width="1.5"/><line x1="260" y1="38" x2="260" y2="30" stroke="#2e7d32" stroke-width="1.2"/><rect x="200" y="115" width="100" height="44" fill="#fff9c4" rx="4"/><text x="250" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#f57f17">PIFS</text><text x="250" y="147" text-anchor="middle" font-size="10" fill="#f9a825">中等</text><line x1="200" y1="170" x2="300" y2="170" stroke="#f57f17" stroke-width="1.5"/><line x1="200" y1="166" x2="200" y2="174" stroke="#f57f17" stroke-width="1.5"/><line x1="300" y1="166" x2="300" y2="174" stroke="#f57f17" stroke-width="1.5"/><rect x="200" y="192" width="160" height="44" fill="#fce4ec" rx="4"/><text x="280" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">DIFS</text><text x="280" y="224" text-anchor="middle" font-size="10" fill="#d32f2f">最长</text><line x1="200" y1="248" x2="360" y2="248" stroke="#c62828" stroke-width="1.5"/><line x1="200" y1="244" x2="200" y2="252" stroke="#c62828" stroke-width="1.5"/><line x1="360" y1="244" x2="360" y2="252" stroke="#c62828" stroke-width="1.5"/><line x1="200" y1="30" x2="200" y2="260" stroke="#aaa" stroke-dasharray="4,3" stroke-width="1.2"/><rect x="260" y="38" width="90" height="44" fill="#a5d6a7" rx="4"/><text x="305" y="56" text-anchor="middle" font-size="11" fill="#1b5e20">ACK / CTS</text><text x="305" y="70" text-anchor="middle" font-size="10" fill="#2e7d32">立即响应帧</text><rect x="300" y="115" width="90" height="44" fill="#fff176" rx="4"/><text x="345" y="133" text-anchor="middle" font-size="11" fill="#7c5c00">PCF 控制帧</text><text x="345" y="147" text-anchor="middle" font-size="10" fill="#9e6c00">点协调功能</text><rect x="360" y="192" width="80" height="44" fill="#f8bbd0" rx="4" stroke="#e91e63" stroke-width="1" stroke-dasharray="4,2"/><text x="400" y="210" text-anchor="middle" font-size="11" fill="#880e4f">随机退避</text><text x="400" y="224" text-anchor="middle" font-size="10" fill="#ad1457">Backoff</text><rect x="440" y="192" width="90" height="44" fill="#ef9a9a" rx="4"/><text x="485" y="210" text-anchor="middle" font-size="11" fill="#b71c1c">DATA</text><text x="485" y="224" text-anchor="middle" font-size="10" fill="#c62828">普通数据帧</text><text x="40" y="305" font-size="12" fill="#555" font-weight="bold">长度对比</text><rect x="40" y="318" width="60" height="18" fill="#c8e6c9" rx="3"/><text x="70" y="330" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">SIFS</text><rect x="40" y="342" width="100" height="18" fill="#fff9c4" rx="3"/><text x="90" y="354" text-anchor="middle" font-size="10" fill="#f57f17" font-weight="bold">PIFS</text><rect x="40" y="366" width="160" height="18" fill="#fce4ec" rx="3"/><text x="120" y="378" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">DIFS</text><rect x="560" y="100" width="240" height="230" fill="#fff" rx="6" stroke="#ddd" stroke-width="1.2"/><text x="680" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">IFS 用途速查</text><line x1="570" y1="130" x2="790" y2="130" stroke="#eee" stroke-width="1"/><rect x="570" y="138" width="50" height="26" fill="#c8e6c9" rx="3"/><text x="595" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">SIFS</text><text x="790" y="148" text-anchor="end" font-size="10" fill="#333">ACK、CTS、</text><text x="790" y="161" text-anchor="end" font-size="10" fill="#333">分片帧响应</text><rect x="570" y="178" width="50" height="26" fill="#fff9c4" rx="3"/><text x="595" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#f57f17">PIFS</text><text x="790" y="188" text-anchor="end" font-size="10" fill="#333">点协调功能</text><text x="790" y="201" text-anchor="end" font-size="10" fill="#333">(PCF) 帧</text><rect x="570" y="218" width="50" height="26" fill="#fce4ec" rx="3"/><text x="595" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">DIFS</text><text x="790" y="228" text-anchor="end" font-size="10" fill="#333">普通数据帧</text><text x="790" y="241" text-anchor="end" font-size="10" fill="#333">争用信道前等待</text><rect x="570" y="262" width="220" height="56" fill="#f3f3f3" rx="4"/><text x="680" y="279" text-anchor="middle" font-size="10" fill="#555">IFS 越短 → 优先级越高</text><text x="680" y="295" text-anchor="middle" font-size="10" fill="#555">ACK/CTS 等 SIFS 后发出，</text><text x="680" y="309" text-anchor="middle" font-size="10" fill="#555">可抢在普通数据帧之前占用信道</text><text x="40" y="400" font-size="13" fill="#444">SIFS &lt; PIFS &lt; DIFS</text></svg>