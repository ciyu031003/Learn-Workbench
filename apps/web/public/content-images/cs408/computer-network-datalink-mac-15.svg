<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="'PingFang SC', 'Microsoft YaHei', Arial, sans-serif"><rect width="860" height="510" fill="#f8f9fa" rx="8"/><rect x="28" y="18" width="804" height="250" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="10,5" rx="10"/><text x="44" y="44" font-size="11" fill="#718096" font-weight="bold">ESS（Extended Service Set）</text><rect x="56" y="228" width="748" height="26" fill="#4a90d9" rx="5" opacity=".85"/><text x="430" y="246" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" letter-spacing="1">DS — Distribution System（分布式系统 / 骨干有线网络）</text><ellipse cx="150" cy="135" rx="100" ry="80" fill="#ebf8ff" stroke="#90cdf4" stroke-width="2" stroke-dasharray="7,4"/><text x="150" y="78" text-anchor="middle" font-size="11" fill="#2b6cb0" font-weight="bold">BSS 1</text><text x="150" y="91" text-anchor="middle" font-size="10" fill="#4a90d9">Basic Service Set</text><rect x="123" y="104" width="54" height="28" rx="4" fill="#2b6cb0"/><text x="150" y="123" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">AP₁</text><circle cx="84" cy="155" r="15" fill="#48bb78" stroke="#276749" stroke-width="1.5"/><text x="84" y="151" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="84" y="163" text-anchor="middle" font-size="9" fill="#fff">A</text><circle cx="216" cy="155" r="15" fill="#48bb78" stroke="#276749" stroke-width="1.5"/><text x="216" y="151" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="216" y="163" text-anchor="middle" font-size="9" fill="#fff">B</text><circle cx="150" cy="192" r="15" fill="#48bb78" stroke="#276749" stroke-width="1.5"/><text x="150" y="188" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="150" y="200" text-anchor="middle" font-size="9" fill="#fff">C</text><line x1="150" y1="132" x2="99" y2="150" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/><line x1="150" y1="132" x2="201" y2="150" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/><line x1="150" y1="132" x2="150" y2="177" stroke="#48bb78" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/><line x1="150" y1="132" x2="150" y2="228" stroke="#2b6cb0" stroke-width="2.5"/><polygon points="146,225 154,225 150,231" fill="#2b6cb0"/><ellipse cx="430" cy="135" rx="100" ry="80" fill="ivory" stroke="#f6e05e" stroke-width="2" stroke-dasharray="7,4"/><text x="430" y="78" text-anchor="middle" font-size="11" fill="#975a16" font-weight="bold">BSS 2</text><text x="430" y="91" text-anchor="middle" font-size="10" fill="#d69e2e">Basic Service Set</text><rect x="403" y="104" width="54" height="28" rx="4" fill="#b7791f"/><text x="430" y="123" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">AP₂</text><circle cx="364" cy="162" r="15" fill="#ed8936" stroke="#c05621" stroke-width="1.5"/><text x="364" y="158" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="364" y="170" text-anchor="middle" font-size="9" fill="#fff">D</text><circle cx="496" cy="162" r="15" fill="#ed8936" stroke="#c05621" stroke-width="1.5"/><text x="496" y="158" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="496" y="170" text-anchor="middle" font-size="9" fill="#fff">E</text><line x1="430" y1="132" x2="379" y2="157" stroke="#ed8936" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/><line x1="430" y1="132" x2="481" y2="157" stroke="#ed8936" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/><line x1="430" y1="132" x2="430" y2="228" stroke="#b7791f" stroke-width="2.5"/><polygon points="426,225 434,225 430,231" fill="#b7791f"/><ellipse cx="710" cy="135" rx="100" ry="80" fill="#fff5f5" stroke="#feb2b2" stroke-width="2" stroke-dasharray="7,4"/><text x="710" y="78" text-anchor="middle" font-size="11" fill="#c53030" font-weight="bold">BSS 3</text><text x="710" y="91" text-anchor="middle" font-size="10" fill="#e53e3e">Basic Service Set</text><rect x="683" y="104" width="54" height="28" rx="4" fill="#c53030"/><text x="710" y="123" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">AP₃</text><circle cx="644" cy="155" r="15" fill="#fc8181" stroke="#c53030" stroke-width="1.5"/><text x="644" y="151" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="644" y="163" text-anchor="middle" font-size="9" fill="#fff">F</text><circle cx="776" cy="155" r="15" fill="#fc8181" stroke="#c53030" stroke-width="1.5"/><text x="776" y="151" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="776" y="163" text-anchor="middle" font-size="9" fill="#fff">G</text><circle cx="710" cy="192" r="15" fill="#fc8181" stroke="#c53030" stroke-width="1.5"/><text x="710" y="188" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="710" y="200" text-anchor="middle" font-size="9" fill="#fff">H</text><line x1="710" y1="132" x2="659" y2="150" stroke="#fc8181" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/><line x1="710" y1="132" x2="761" y2="150" stroke="#fc8181" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/><line x1="710" y1="132" x2="710" y2="177" stroke="#fc8181" stroke-width="1.5" stroke-dasharray="5,3" opacity=".7"/><line x1="710" y1="132" x2="710" y2="228" stroke="#c53030" stroke-width="2.5"/><polygon points="706,225 714,225 710,231" fill="#c53030"/><rect x="28" y="278" width="804" height="210" fill="#fff" rx="8" stroke="#e2e8f0" stroke-width="1.5"/><ellipse cx="70" cy="306" rx="22" ry="14" fill="#ebf8ff" stroke="#90cdf4" stroke-width="1.5" stroke-dasharray="5,3"/><text x="102" y="302" font-size="11" fill="#2b6cb0" font-weight="bold">BSS（基本服务集）</text><text x="102" y="316" font-size="10" fill="#555">一个 AP 覆盖范围内的所有 STA 组成一个 BSS；同一 BSS 内的通信通过 AP 中转</text><rect x="48" y="334" width="44" height="16" rx="3" fill="none" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="5,3"/><text x="70" y="346" text-anchor="middle" font-size="9" fill="#718096" font-weight="bold">ESS</text><text x="102" y="342" font-size="11" fill="#718096" font-weight="bold">ESS（扩展服务集）</text><text x="102" y="356" font-size="10" fill="#555">由多个 BSS + DS 组合而成的更大范围无线网络，对外表现为一个整体</text><rect x="48" y="368" width="44" height="20" rx="3" fill="#2b6cb0"/><text x="70" y="382" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">AP</text><text x="102" y="376" font-size="11" fill="#2b6cb0" font-weight="bold">AP（接入点）</text><text x="102" y="390" font-size="10" fill="#555">无线局域网的"基站"，负责将 STA 的无线帧桥接到 DS（有线网络）</text><circle cx="70" cy="414" r="13" fill="#48bb78" stroke="#276749" stroke-width="1.5"/><text x="70" y="418" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">STA</text><text x="102" y="410" font-size="11" fill="#276749" font-weight="bold">STA（站点）</text><text x="102" y="424" font-size="10" fill="#555">无线终端设备（手机、笔记本等），通过关联到 AP 来加入 BSS</text><rect x="48" y="438" width="44" height="18" rx="3" fill="#4a90d9" opacity=".85"/><text x="70" y="451" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">DS</text><text x="102" y="446" font-size="11" fill="#1a56a0" font-weight="bold">DS（分布式系统）</text><text x="102" y="460" font-size="10" fill="#555">连接各 AP 的有线骨干网，负责在不同 BSS 之间转发帧，使跨 BSS 通信成为可能</text><text x="102" y="474" font-size="10" fill="#555">例：STA-A（BSS 1）→ AP₁ → DS → AP₂ → STA-D（BSS 2）</text><defs><marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#805ad5"/></marker></defs></svg>