join:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="440" y="338" text-anchor="start" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">压入结果</text><rect x="250" y="422" width="14" height="14" rx="3" stroke-width=".5" style="fill:#faeeda;stroke:#854f0b;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="272" y="432" text-anchor="start" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:auto">琥珀色：本次参与运算的栈顶元素</text></svg>