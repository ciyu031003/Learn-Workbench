necap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">依次响应</text><text x="230" y="270" text-anchor="middle" dominant-baseline="central" style="fill:#854f0b;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:central">中断请求</text></g><line x1="285" y1="240" x2="330" y2="242" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><g style="fill:#000;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="330" y="170" width="150" height="40" rx="6" stroke-width=".5" style="fill:#e6f1fb;stroke:#185fa5;color:#0b0b0b;stroke-width:.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="405" y="190" text-anchor="middle" dominant-baseline="central" style="fill:#0c447c;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">从I/O读数据</text></g><line x1="405" y1="210" x2="405" y2="222" marker-end="url(#arrow)" style="fill:none;stroke:#898781;color:#0b0b0b;stroke-