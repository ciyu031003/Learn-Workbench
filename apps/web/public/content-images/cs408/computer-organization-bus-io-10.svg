anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="405" y="294" text-anchor="middle" dominant-baseline="central" style="fill:#712b13;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central">写入内存</text></g><text x="405" y="340" text-anchor="middle" style="fill:#52514e;stroke:none;color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">↻ 返回主程序，继续检测下一个中断</text><g style="fill:#fcfcfb;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"><rect x="40" y="365" width="600" height="140" rx="10" stroke-width=".5" stroke-dasharray="4 3" style="fill:#fcfcfb;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:.5px;stroke-dasharray:4px,3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><text x="60" y="390" dominant-baseline="central" style="fill:#0b0b0b;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:14px;font-weight:500;text-anchor:start;dominant-baseline:central">中断驱动方式的局限</text><text x="60" y="418" dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central">· 中断频繁，开销大</text><text x="60" y="443" dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central">· CPU频繁切换执行上下文</text><text x="60" y="468" dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central">· CPU参与每次数据搬运，成为"搬运工"</text><text x="360" y="418" dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central">· 一次搬运数据量小，效率低</text><text x="360" y="443" dominant-baseline="central" style="fill:#52514e;stroke:color(srgb .0431373 .0431373 .0431373/.2);color:#0b0b0b;stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic sans,-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central">· CPU占用时间多，并行性差</text></g></svg>