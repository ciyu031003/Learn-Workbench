<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><style>.title{font-family:Arial,sans-serif;font-weight:700}.label{font-family:Arial,sans-serif}.step{fill:#34495e}.data{fill:#2c3e50}.gen{fill:#c0392b}.xor{fill:#16a085}.rem{fill:#27ae60;font-weight:700}.quot{fill:#2980b9;font-weight:700}.bar{stroke:#7f8c8d;stroke-width:1}.note{fill:#7f8c8d;font-size:11px;font-family:Arial,sans-serif}</style><text x="410" y="28" text-anchor="middle" font-size="20" class="title" fill="#2c3e50">CRC 模 2 除法校验过程（接收方）</text><text x="410" y="48" text-anchor="middle" class="note">接收数据 101000110101110，使用同一生成多项式 110101 进行模 2 除法</text><g transform="translate(40,68)"><rect width="14" height="14" fill="#c0392b" opacity=".85"/><text x="20" y="12" class="label" font-size="12" fill="#2c3e50">生成多项式（除数）</text><rect x="170" width="14" height="14" fill="#16a085" opacity=".85"/><text x="190" y="12" class="label" font-size="12" fill="#2c3e50">异或结果</text><rect x="280" width="14" height="14" fill="#27ae60" opacity=".85"/><text x="300" y="12" class="label" font-size="12" fill="#2c3e50">最终余数（应为 0）</text><rect x="430" width="14" height="14" fill="#2980b9" opacity=".85"/><text x="450" y="12" class="label" font-size="12" fill="#2c3e50">商 (不参与判断)</text></g><g font-size="16"><text x="250" y="115" class="quot">商：1 1 0 1 0 1 0 1 1</text></g><g font-size="15" transform="translate(120,135)"><text x="0" y="0" class="gen">110101</text><text x="60" y="0" fill="#34495e">)</text><text x="80" y="0" class="data">1 0 1 0 0 0 1 1 0 1 0 1 1 1 0</text><line x1="80" y1="6" x2="430" y2="6" class="bar"/><text x="80" y="28" class="gen">1 1 0 1 0 1</text><line x1="80" y1="34" x2="200" y2="34" class="bar"/><text x="95" y="56" class="xor">1 1 1 0 1 1</text><text x="95" y="78" class="gen">1 1 0 1 0 1</text><line x1="95" y1="84" x2="215" y2="84" class="bar"/><text x="125" y="106" class="xor">1 1 1 0 1 0</text><text x="125" y="128" class="gen">1 1 0 1 0 1</text><line x1="125" y1="134" x2="245" y2="134" class="bar"/><text x="155" y="156" class="xor">1 1 1 1 1 0</text><text x="155" y="178" class="gen">1 1 0 1 0 1</text><line x1="155" y1="184" x2="275" y2="184" class="bar"/><text x="185" y="206" class="xor">1 0 1 1 1 1</text><text x="185" y="228" class="gen">1 1 0 1 0 1</text><line x1="185" y1="234" x2="305" y2="234" class="bar"/><text x="200" y="256" class="xor">1 1 0 1 0 1</text><text x="200" y="278" class="gen">1 1 0 1 0 1</text><line x1="200" y1="284" x2="320" y2="284" class="bar"/><text x="245" y="306" class="rem">0 0 0 0 0</text></g><g font-size="12" font-family="Arial, sans-serif" fill="#34495e"><g transform="translate(560,135)"><text y="0" font-weight="bold" fill="#2c3e50">步骤说明</text><circle cx="6" cy="22" r="4" fill="#c0392b"/><text x="18" y="26">用同一生成多项式按位异或</text><circle cx="6" cy="46" r="4" fill="#16a085"/><text x="18" y="50">异或结果右移一位继续除</text><circle cx="6" cy="70" r="4" fill="#2980b9"/><text x="18" y="74">商不用于判断，只看最终余数</text><circle cx="6" cy="94" r="4" fill="#27ae60"/><text x="18" y="98">余数 = 0 表示校验通过</text><text x="0" y="130" font-weight="bold" fill="#2c3e50">判断规则</text><text x="0" y="150">余数 = 0：数据帧未被破坏 ✓</text><text x="0" y="168">余数 ≠ 0：传输中发生错误 ✗</text><text x="0" y="190" fill="#7f8c8d">（接收方与发送方使用相同多项式）</text></g></g><rect x="80" y="470" width="660" height="60" fill="#27ae60" opacity=".1" rx="6"/><text x="410" y="495" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" fill="#2c3e50">最终余数为<tspan fill="#27ae60" font-weight="bold">0</tspan>，校验通过</text><text x="410" y="518" text-anchor="middle" font-size="16" class="data" font-weight="bold">101000110101110 ÷ 110101 → 余数 =<tspan fill="#27ae60">0</tspan></text></svg>