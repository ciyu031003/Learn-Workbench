<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="硬链接与软链接的区别：目录项指向 inode，硬链接共享同一个 inode，软链接是独立文件、内容为目标路径">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b06a00"/>
    </marker>
  </defs>
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .l{stroke:#2b2b2b;stroke-width:1.6;fill:none}
    .ld{stroke:#b06a00;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    .box{fill:#fff;stroke:#2b2b2b;stroke-width:1.5}
    .ino{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.5}
    .dat{fill:#f3f7f1;stroke:#b06a00;stroke-width:1.5}
    .lbl{font:600 12px "Microsoft YaHei",system-ui,sans-serif;fill:#b06a00}
  </style>

  <text class="t" x="18" y="28">硬链接 vs 软链接：目录项、inode 与数据块</text>
  <text class="n" x="18" y="50">关键区别只有一句：硬链接让两个目录项指向同一个 inode；软链接自己是一个文件，内容是目标路径</text>

  <!-- 硬链接 -->
  <text class="s" x="18" y="86">① 硬链接：两个目录项 → 同一个 inode</text>
  <rect class="box" x="40" y="100" width="150" height="42" rx="7"/>
  <text class="s" x="52" y="118">a 的目录项</text>
  <text class="n" x="52" y="134">note → inode 100</text>
  <rect class="box" x="40" y="168" width="150" height="42" rx="7"/>
  <text class="s" x="52" y="186">b 的目录项</text>
  <text class="n" x="52" y="202">note → inode 100</text>
  <rect class="ino" x="280" y="118" width="150" height="72" rx="7"/>
  <text class="s" x="292" y="140">inode 100</text>
  <text class="n" x="292" y="158">count = 2</text>
  <text class="n" x="292" y="175">属主 / 大小 / 数据块地址</text>
  <rect class="dat" x="520" y="118" width="150" height="72" rx="7"/>
  <text class="s" x="532" y="142">数据块 88</text>
  <text class="n" x="532" y="160">文件内容（只有一份）</text>
  <path class="l" d="M190 121 H232 V140 H280" marker-end="url(#a1)"/>
  <path class="l" d="M190 189 H232 V170 H280" marker-end="url(#a1)"/>
  <path class="l" d="M430 154 H520" marker-end="url(#a1)"/>
  <text class="n" x="18" y="232">删掉 a 的目录项：count 变 1，inode 与数据块都还在，b 照常读</text>

  <!-- 软链接 -->
  <text class="s" x="18" y="276">② 软链接：链接文件里存的是"路径"</text>
  <rect class="box" x="40" y="290" width="150" height="42" rx="7"/>
  <text class="s" x="52" y="308">b 的目录项</text>
  <text class="n" x="52" y="324">link → inode 205</text>
  <rect class="ino" x="280" y="290" width="160" height="72" rx="7"/>
  <text class="s" x="292" y="312">inode 205（LINK）</text>
  <text class="n" x="292" y="330">内容 = "/home/a/note"</text>
  <text class="n" x="292" y="347">路径字符串，不是数据</text>
  <rect class="box" x="530" y="290" width="150" height="42" rx="7"/>
  <text class="s" x="542" y="308">a 的目录项</text>
  <text class="n" x="542" y="324">note → inode 100</text>
  <rect class="ino" x="530" y="378" width="150" height="64" rx="7"/>
  <text class="s" x="542" y="400">inode 100</text>
  <text class="n" x="542" y="418">count = 1</text>
  <rect class="dat" x="280" y="378" width="160" height="64" rx="7"/>
  <text class="s" x="292" y="402">数据块 88</text>
  <text class="n" x="292" y="420">文件内容</text>
  <path class="l" d="M190 311 H280" marker-end="url(#a1)"/>
  <path class="ld" d="M440 332 H480 V311 H530" marker-end="url(#a2)"/>
  <text class="lbl" x="452" y="352">按路径再查</text>
  <path class="l" d="M605 332 V378" marker-end="url(#a1)"/>
  <path class="l" d="M530 410 H440" marker-end="url(#a1)"/>
  <text class="n" x="18" y="470">删掉 /home/a/note 后：硬链接 b 仍能读（inode 100 的 count 还是 1）；软链接 link 变成悬空链接，报"文件不存在"。</text>
  <text class="n" x="18" y="490">软链接多一次路径解析（慢）、占一个 inode 与一个数据块（存路径）、能跨文件系统、能指向目录；硬链接正好相反。</text>
  <text class="n" x="18" y="510">软链接不影响源文件的链接计数——这是选择题最爱设错的一点。</text>
</svg>
