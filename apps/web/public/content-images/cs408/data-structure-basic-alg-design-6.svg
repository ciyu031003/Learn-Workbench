<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#555"/></marker><marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#E74C3C"/></marker><marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#27AE60"/></marker><marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#2C7BB6"/></marker></defs><text x="190" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">拓扑排序 — 入度队列法</text><circle cx="80" cy="80" r="22" fill="#E74C3C" stroke="none"/><text x="80" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">0</text><circle cx="200" cy="50" r="22" fill="#E74C3C" stroke="none"/><text x="200" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1</text><circle cx="80" cy="180" r="22" fill="#2C7BB6" stroke="none"/><text x="80" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2</text><circle cx="200" cy="150" r="22" fill="#2C7BB6" stroke="none"/><text x="200" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3</text><circle cx="320" cy="100" r="22" fill="#9B59B6" stroke="none"/><text x="320" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">4</text><circle cx="320" cy="200" r="22" fill="#9B59B6" stroke="none"/><text x="320" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">5</text><line x1="100" y1="72" x2="178" y2="57" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><line x1="102" y1="86" x2="178" y2="145" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><line x1="80" y1="102" x2="80" y2="158" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><line x1="218" y1="63" x2="298" y2="90" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><line x1="222" y1="152" x2="298" y2="105" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><line x1="222" y1="158" x2="298" y2="192" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><line x1="102" y1="186" x2="178" y2="158" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><text x="80" y="52" text-anchor="middle" font-size="10" fill="#E74C3C">入度=0</text><text x="235" y="35" text-anchor="middle" font-size="10" fill="#E74C3C">入度=1</text><text x="40" y="178" text-anchor="middle" font-size="10" fill="#2C7BB6">入度=1</text><text x="170" y="178" text-anchor="middle" font-size="10" fill="#2C7BB6">入度=2</text><text x="360" y="90" text-anchor="middle" font-size="10" fill="#9B59B6">入度=2</text><text x="360" y="205" text-anchor="middle" font-size="10" fill="#9B59B6">入度=1</text><text x="20" y="240" font-size="11" fill="#888">输出顺序（一种合法拓扑序）：</text><rect x="20" y="250" width="32" height="28" rx="5" fill="#FDECEA" stroke="#E74C3C" stroke-width="1.5"/><text x="36" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#E74C3C">0</text><text x="55" y="267" font-size="16" fill="#AAA">→</text><rect x="64" y="250" width="32" height="28" rx="5" fill="#FDECEA" stroke="#E74C3C" stroke-width="1.5"/><text x="80" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#E74C3C">2</text><text x="99" y="267" font-size="16" fill="#AAA">→</text><rect x="108" y="250" width="32" height="28" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="124" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C7BB6">1</text><text x="143" y="267" font-size="16" fill="#AAA">→</text><rect x="152" y="250" width="32" height="28" rx="5" fill="#DEF" stroke="#2C7BB6" stroke-width="1.5"/><text x="168" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C7BB6">3</text><text x="187" y="267" font-size="16" fill="#AAA">→</text><rect x="196" y="250" width="32" height="28" rx="5" fill="#F5EEFF" stroke="#9B59B6" stroke-width="1.5"/><text x="212" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#9B59B6">4</text><text x="231" y="267" font-size="16" fill="#AAA">→</text><rect x="240" y="250" width="32" height="28" rx="5" fill="#F5EEFF" stroke="#9B59B6" stroke-width="1.5"/><text x="256" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#9B59B6">5</text><text x="20" y="300" font-size="11" fill="#555">若最终 count &lt; n（顶点数），说明图中有环，无法完成拓扑排序</text><line x1="390" y1="15" x2="390" y2="330" stroke="#DDD" stroke-width="1" stroke-dasharray="5,4"/><text x="575" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">欧拉路径 — 奇数度顶点判断</text><circle cx="450" cy="90" r="20" fill="#27AE60" stroke="none"/><text x="450" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">A</text><circle cx="560" cy="60" r="20" fill="#27AE60" stroke="none"/><text x="560" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">B</text><circle cx="660" cy="90" r="20" fill="#E74C3C" stroke="none"/><text x="660" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">C</text><circle cx="610" cy="180" r="20" fill="#E74C3C" stroke="none"/><text x="610" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">D</text><circle cx="500" cy="180" r="20" fill="#27AE60" stroke="none"/><text x="500" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">E</text><line x1="469" y1="78" x2="541" y2="67" stroke="#999" stroke-width="1.5"/><line x1="579" y1="73" x2="641" y2="83" stroke="#999" stroke-width="1.5"/><line x1="651" y1="109" x2="626" y2="162" stroke="#999" stroke-width="1.5"/><line x1="591" y1="190" x2="519" y2="190" stroke="#999" stroke-width="1.5"/><line x1="483" y1="168" x2="455" y2="108" stroke="#999" stroke-width="1.5"/><line x1="468" y1="98" x2="492" y2="168" stroke="#999" stroke-width="1.5"/><line x1="557" y1="79" x2="517" y2="166" stroke="#999" stroke-width="1.5"/><text x="400" y="88" font-size="10" fill="#27AE60">度=3</text><text x="565" y="36" font-size="10" fill="#27AE60">度=4</text><text x="678" y="78" font-size="10" fill="#E74C3C">度=3</text><text x="630" y="200" font-size="10" fill="#E74C3C">度=3</text><text x="460" y="200" font-size="10" fill="#27AE60">度=3</text><rect x="410" y="220" width="330" height="105" rx="8" fill="#FAFAFA" stroke="#DDD" stroke-width="1.5"/><text x="425" y="242" font-size="12" fill="#555">奇数度顶点：C、D（共 2 个）</text><text x="425" y="262" font-size="12" fill="#27AE60" font-weight="bold">→ 存在欧拉路径 ✓（从C到D或D到C）</text><line x1="420" y1="270" x2="735" y2="270" stroke="#EEE" stroke-width="1"/><text x="425" y="286" font-size="11" fill="#888">奇数度=0 → 欧拉回路（任意起点）</text><text x="425" y="302" font-size="11" fill="#888">奇数度=2 → 欧拉路径（起/终为奇度点）</text><text x="425" y="318" font-size="11" fill="#E74C3C">奇数度=其他 → 不存在</text></svg>