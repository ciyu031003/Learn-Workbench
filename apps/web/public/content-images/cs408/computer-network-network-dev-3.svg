<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 780" role="img"><title>分组转发流程图</title><desc>路由器分组转发流程：接收解析、最长前缀匹配、默认路由处理、TTL 处理、必要的分片/NAT，以及转发或丢弃。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>.box{stroke-width:.8;rx:8}.start{fill:#f1efe8;stroke:#5f5e5a}.route{fill:#eeedfe;stroke:#534ab7}.ok{fill:#e1f5ee;stroke:#0f6e56}.drop{fill:#fcebeb;stroke:#a32d2d}.diamond{fill:#fff;stroke:#8a8882;stroke-width:.8}.line{fill:none;stroke:#898781;stroke-width:1.5;marker-end:url(#arrow)}.text{font-family:-apple-system,BlinkMacSystemFont,segoe ui,sans-serif;fill:#444441}.title{font-size:14px;font-weight:600}.sub{font-size:12px;font-weight:400;fill:#5f5e5a}.label{font-size:12px;fill:#52514e}.note{font-size:11px;fill:#6c6a65}</style></defs><rect class="box start" x="250" y="30" width="260" height="56" rx="8"/><text class="text title" x="380" y="52" text-anchor="middle" dominant-baseline="central">① 接收和解析数据包</text><text class="text sub" x="380" y="70" text-anchor="middle" dominant-baseline="central">提取目的 IP、TTL 等字段</text><line class="line" x1="380" y1="86" x2="380" y2="118"/><rect class="box route" x="230" y="118" width="300" height="56" rx="8"/><text class="text title" x="380" y="140" text-anchor="middle" dominant-baseline="central">② 查询路由表</text><text class="text sub" x="380" y="158" text-anchor="middle" dominant-baseline="central">对目的 IP 执行最长前缀匹配（LPM）</text><line class="line" x1="380" y1="174" x2="380" y2="206"/><polygon class="diamond" points="380,206 485,245 380,284 275,245"/><text class="text label" x="380" y="239" text-anchor="middle" dominant-baseline="central">是否匹配到</text><text class="text label" x="380" y="255" text-anchor="middle" dominant-baseline="central">具体路由？</text><line class="line" x1="275" y1="245" x2="185" y2="245"/><text class="text label" x="230" y="235" text-anchor="middle">否</text><polygon class="diamond" points="105,206 200,245 105,284 10,245"/><text class="text label" x="105" y="239" text-anchor="middle" dominant-baseline="central">是否存在</text><text class="text label" x="105" y="255" text-anchor="middle" dominant-baseline="central">默认路由？</text><text class="text note" x="105" y="276" text-anchor="middle">0.0.0.0/0</text><line class="line" x1="105" y1="284" x2="105" y2="333"/><text class="text label" x="122" y="310">否</text><rect class="box drop" x="43" y="333" width="124" height="52" rx="8"/><text class="text title" x="105" y="354" text-anchor="middle" dominant-baseline="central" fill="#791f1f">丢弃</text><text class="text sub" x="105" y="373" text-anchor="middle" dominant-baseline="central" fill="#a32d2d">ICMP 不可达</text><path class="line" d="M2e2 245c45 0 45 70 125 70"/><text class="text label" x="235" y="260">是，走默认路由</text><line class="line" x1="380" y1="284" x2="380" y2="333"/><text class="text label" x="398" y="310">是</text><rect class="box route" x="235" y="333" width="290" height="56" rx="8"/><text class="text title" x="380" y="355" text-anchor="middle" dominant-baseline="central">选定出接口 / 下一跳</text><text class="text sub" x="380" y="373" text-anchor="middle" dominant-baseline="central">具体路由优先于默认路由</text><line class="line" x1="380" y1="389" x2="380" y2="421"/><rect class="box ok" x="240" y="421" width="280" height="56" rx="8"/><text class="text title" x="380" y="443" text-anchor="middle" dominant-baseline="central">③ TTL 减 1</text><text class="text sub" x="380" y="461" text-anchor="middle" dominant-baseline="central">防止环路无限转发</text><line class="line" x1="380" y1="477" x2="380" y2="509"/><polygon class="diamond" points="380,509 485,548 380,587 275,548"/><text class="text label" x="380" y="552" text-anchor="middle" dominant-baseline="central">TTL = 0 ？</text><line class="line" x1="275" y1="548" x2="167" y2="548"/><text class="text label" x="220" y="538" text-anchor="middle">是</text><rect class="box drop" x="43" y="522" width="124" height="52" rx="8"/><text class="text title" x="105" y="543" text-anchor="middle" dominant-baseline="central" fill="#791f1f">丢弃</text><text class="text sub" x="105" y="562" text-anchor="middle" dominant-baseline="central" fill="#a32d2d">ICMP 超时</text><line class="line" x1="380" y1="587" x2="380" y2="619"/><text class="text label" x="398" y="606">否</text><rect class="box ok" x="220" y="619" width="320" height="56" rx="8"/><text class="text title" x="380" y="641" text-anchor="middle" dominant-baseline="central">④ 其他字段处理</text><text class="text sub" x="380" y="659" text-anchor="middle" dominant-baseline="central">必要时分片 / NAT / 更新校验和</text><text class="text note" x="380" y="690" text-anchor="middle">注：IPv4 路由器通常只分片，不负责最终重组</text><line class="line" x1="380" y1="675" x2="380" y2="717"/><rect class="box route" x="235" y="717" width="290" height="56" rx="8"/><text class="text title" x="380" y="739" text-anchor="middle" dominant-baseline="central">⑤ 转发数据包</text><text class="text sub" x="380" y="757" text-anchor="middle" dominant-baseline="central">发往下一跳或目标设备</text></svg>