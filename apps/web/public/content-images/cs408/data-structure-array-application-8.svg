<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfcff"/><stop offset="100%" stop-color="#f4f1fa"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="100%" stop-color="#f7f4fd"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7c5cd6"/></marker></defs><rect width="900" height="560" fill="url(#bg)"/><g><rect x="30" y="25" width="840" height="110" rx="14" ry="14" fill="url(#card)" stroke="#c9bde9" stroke-width="1.5"/><text x="60" y="65" font-size="20" font-weight="700" fill="#3a2f66">卡特兰数 Catalan number</text><g transform="translate(430,90)" font-family="'Cambria Math','Times New Roman',serif" fill="#2b234d"><text x="0" y="6" font-size="34" font-style="italic">C</text><text x="21" y="16" font-size="18" font-style="italic">n</text><text x="42" y="6" font-size="30">=</text><text x="78" y="-8" font-size="24" text-anchor="middle">1</text><line x1="60" y1="0" x2="98" y2="0" stroke="#2b234d" stroke-width="2"/><text x="78" y="24" font-size="22" text-anchor="middle" font-style="italic">n+1</text><text x="118" y="12" font-size="60" font-family="'Cambria Math',serif">(</text><text x="160" y="-4" font-size="22" text-anchor="middle" font-style="italic">2n</text><text x="160" y="26" font-size="22" text-anchor="middle" font-style="italic">n</text><text x="180" y="12" font-size="60" font-family="'Cambria Math',serif">)</text><text x="220" y="6" font-size="28">=</text><text x="290" y="-8" font-size="22" text-anchor="middle" font-style="italic">(2n)!</text><line x1="240" y1="0" x2="340" y2="0" stroke="#2b234d" stroke-width="2"/><text x="290" y="24" font-size="22" text-anchor="middle" font-style="italic">(n+1)! · n!</text></g></g><g transform="translate(30,160)"><text x="0" y="0" font-size="16" font-weight="600" fill="#3a2f66">前几项</text><g font-size="14" fill="#2b234d"><g transform="translate(0,12)"><g><rect x="0" y="0" width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle" font-style="italic">n</text></g><g transform="translate(75,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">0</text></g><g transform="translate(150,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">1</text></g><g transform="translate(225,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">2</text></g><g transform="translate(300,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">3</text></g><g transform="translate(375,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">4</text></g><g transform="translate(450,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">5</text></g><g transform="translate(525,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">6</text></g><g transform="translate(600,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">7</text></g><g transform="translate(675,0)"><rect width="70" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">8</text></g><g transform="translate(750,0)"><rect width="90" height="34" rx="6" fill="#fff" stroke="#c9bde9"/><text x="45" y="21" text-anchor="middle">…</text></g></g><g transform="translate(0,50)"><g><rect x="0" y="0" width="70" height="34" rx="6" fill="#efe8fb" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle" font-style="italic">C_n</text></g><g transform="translate(75,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">1</text></g><g transform="translate(150,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">1</text></g><g transform="translate(225,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">2</text></g><g transform="translate(300,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">5</text></g><g transform="translate(375,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">14</text></g><g transform="translate(450,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">42</text></g><g transform="translate(525,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">132</text></g><g transform="translate(600,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">429</text></g><g transform="translate(675,0)"><rect width="70" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="35" y="21" text-anchor="middle">1430</text></g><g transform="translate(750,0)"><rect width="90" height="34" rx="6" fill="#f7f4fd" stroke="#c9bde9"/><text x="45" y="21" text-anchor="middle">…</text></g></g></g></g><g transform="translate(30,270)"><text x="0" y="0" font-size="16" font-weight="600" fill="#3a2f66">等价问题（以 n = 3 为例，答案均为 C₃ = 5）</text><g transform="translate(0,15)"><rect width="270" height="260" rx="12" fill="url(#card)" stroke="#c9bde9"/><text x="16" y="30" font-size="15" font-weight="700" fill="#5a3fb0">1. 括号匹配</text><text x="16" y="52" font-size="12" fill="#5a4a7d">n 对括号的合法排列</text><g font-family="'JetBrains Mono','Menlo','Courier New',monospace" font-size="20" fill="#2b234d"><text x="30" y="90">( ( ( ) ) )</text><text x="30" y="120">( ( ) ( ) )</text><text x="30" y="150">( ( ) ) ( )</text><text x="30" y="180">( ) ( ( ) )</text><text x="30" y="210">( ) ( ) ( )</text></g><text x="16" y="245" font-size="12" fill="#7263a3" font-style="italic">( 视为入栈，) 视为出栈</text></g><g transform="translate(285,15)"><rect width="270" height="260" rx="12" fill="url(#card)" stroke="#c9bde9"/><text x="16" y="30" font-size="15" font-weight="700" fill="#5a3fb0">2. 入栈出栈序列</text><text x="16" y="52" font-size="12" fill="#5a4a7d">1,2,3 依次入栈，所有合法出栈</text><g font-family="'JetBrains Mono','Menlo','Courier New',monospace" font-size="18" fill="#2b234d"><text x="30" y="90">1 2 3</text><text x="30" y="120">1 3 2</text><text x="30" y="150">2 1 3</text><text x="30" y="180">2 3 1</text><text x="30" y="210">3 2 1</text></g><text x="16" y="245" font-size="12" fill="#7263a3" font-style="italic">仅 3 1 2 不可能</text></g><g transform="translate(570,15)"><rect width="270" height="260" rx="12" fill="url(#card)" stroke="#c9bde9"/><text x="16" y="30" font-size="15" font-weight="700" fill="#5a3fb0">3. 二叉树形态</text><text x="16" y="52" font-size="12" fill="#5a4a7d">n 个节点可构造的不同形态二叉树</text><g stroke="#5a3fb0" stroke-width="1.6" fill="#fff"><g transform="translate(35,80)"><line x1="0" y1="0" x2="14" y2="20"/><line x1="14" y1="20" x2="28" y2="40"/><circle cx="0" cy="0" r="6"/><circle cx="14" cy="20" r="6"/><circle cx="28" cy="40" r="6"/></g><g transform="translate(90,80)"><line x1="0" y1="0" x2="14" y2="20"/><line x1="14" y1="20" x2="0" y2="40"/><circle cx="0" cy="0" r="6"/><circle cx="14" cy="20" r="6"/><circle cx="0" cy="40" r="6"/></g><g transform="translate(145,80)"><line x1="14" y1="0" x2="0" y2="20"/><line x1="14" y1="0" x2="28" y2="20"/><circle cx="14" cy="0" r="6"/><circle cx="0" cy="20" r="6"/><circle cx="28" cy="20" r="6"/></g><g transform="translate(210,80)"><line x1="14" y1="0" x2="0" y2="20"/><line x1="0" y1="20" x2="14" y2="40"/><circle cx="14" cy="0" r="6"/><circle cx="0" cy="20" r="6"/><circle cx="14" cy="40" r="6"/></g><g transform="translate(35,180)"><line x1="28" y1="0" x2="14" y2="20"/><line x1="14" y1="20" x2="0" y2="40"/><circle cx="28" cy="0" r="6"/><circle cx="14" cy="20" r="6"/><circle cx="0" cy="40" r="6"/></g></g><text x="16" y="245" font-size="12" fill="#7263a3" font-style="italic">共 5 种形态</text></g></g></svg>