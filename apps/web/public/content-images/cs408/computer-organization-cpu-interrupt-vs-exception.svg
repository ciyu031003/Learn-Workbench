<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="外中断与异常（内中断）的来源、返回地址与三种异常类型对照">
  <style>
    .t{font:700 14px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .h{font:600 13px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 12px "Microsoft YaHei",system-ui,sans-serif;fill:#4a4a4a}
    .r1{fill:#fdf3ee;stroke:#c0704a;stroke-width:1.4}
    .r2{fill:#eef4fb;stroke:#4a76a8;stroke-width:1.4}
    .l{stroke:#2b2b2b;stroke-width:1.3;fill:none}
  </style>
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
  </defs>

  <rect class="r1" x="16" y="34" width="352" height="188" rx="5"/>
  <text class="t" x="30" y="58">外中断（硬件中断）</text>
  <text class="n" x="30" y="84">来源：CPU 外部 —— 时钟、I/O 完成、键盘</text>
  <text class="n" x="30" y="106">时机：异步，与正在执行的指令无关</text>
  <text class="n" x="30" y="128">处理完返回：下一条指令（断点已过）</text>
  <text class="n" x="30" y="150">例子：时钟中断、打印机完成、DMA 结束</text>
  <text class="n" x="30" y="178">指令序列： i →（此处被中断）→ i+1</text>
  <path class="l" d="M60 196 L150 196" marker-end="url(#b1)"/>
  <text class="n" x="160" y="200">继续执行 i+1</text>

  <rect class="r2" x="392" y="34" width="352" height="264" rx="5"/>
  <text class="t" x="406" y="58">异常（内中断）：由当前指令引起</text>

  <text class="h" x="406" y="88">① 故障 fault：缺页、除零、溢出</text>
  <text class="n" x="420" y="108">处理后重新执行这条指令（缺页调回来再跑一遍）</text>

  <text class="h" x="406" y="140">② 自陷 trap：系统调用、断点、单步</text>
  <text class="n" x="420" y="160">处理后执行下一条指令（调用已生效）</text>

  <text class="h" x="406" y="192">③ 终止 abort：控制器出错、硬件故障</text>
  <text class="n" x="420" y="212">不返回，直接终止该进程</text>

  <text class="n" x="406" y="244">共同点：都同步（在指令执行过程中确定发生），都要保存现场、</text>
  <text class="n" x="406" y="262">转去内核态处理；区别只在「返回地址」指向 i 还是 i+1。</text>

  <text class="h" x="16" y="252">一句话判别</text>
  <text class="n" x="16" y="272">「跟当前指令有关、跑这条指令才出问题」→ 异常（内中断）</text>
  <text class="n" x="16" y="290">「跟当前指令无关、随时可能来」→ 外中断</text>
  <text class="n" x="16" y="316">返回地址：故障回 i，自陷/外中断回 i+1，终止不返回。</text>
</svg>
