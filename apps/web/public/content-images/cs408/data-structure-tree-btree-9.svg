<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13"><style>.title{font-weight:700;font-size:13px;text-anchor:middle}.sub{font-size:11px;fill:#555;text-anchor:middle}.nd{stroke:#333;fill:#fff}.child{stroke:#1565c0;fill:none;stroke-width:1.8}.thread{stroke:#c0392b;fill:none;stroke-width:1.5;stroke-dasharray:5 4}.tag0{fill:#e3f2fd;stroke:#1565c0}.tag1{fill:#fde4e4;stroke:#c0392b}text{dominant-baseline:central}</style><defs><marker id="cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1565c0"/></marker><marker id="tm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c0392b"/></marker></defs><text x="410" y="22" text-anchor="middle" font-weight="700" font-size="14">线索二叉树节点：ltag / rtag 标识子指针还是线索</text><g transform="translate(40,55)"><text class="title" x="170" y="0">节点字段结构</text><g transform="translate(0,30)"><rect class="tag0" x="0" y="0" width="50" height="40"/><text x="25" y="20" text-anchor="middle">ltag</text><rect class="nd" x="50" y="0" width="60" height="40"/><text x="80" y="20" text-anchor="middle">lchild</text><rect class="nd" x="110" y="0" width="80" height="40"/><text x="150" y="20" text-anchor="middle" font-weight="700">data</text><rect class="nd" x="190" y="0" width="60" height="40"/><text x="220" y="20" text-anchor="middle">rchild</text><rect class="tag0" x="250" y="0" width="50" height="40"/><text x="275" y="20" text-anchor="middle">rtag</text><text x="25" y="58" text-anchor="middle" font-size="11" fill="#1565c0">0 = 左孩子</text><text x="25" y="74" text-anchor="middle" font-size="11" fill="#c0392b">1 = 前驱线索</text><text x="275" y="58" text-anchor="middle" font-size="11" fill="#1565c0">0 = 右孩子</text><text x="275" y="74" text-anchor="middle" font-size="11" fill="#c0392b">1 = 后继线索</text></g><g transform="translate(0,135)"><text font-weight="600" y="0">指针含义：</text><line class="child" x1="0" y1="22" x2="40" y2="22" marker-end="url(#cm)"/><text x="50" y="22">child 指针（实线）：指向真实左/右孩子</text><line class="thread" x1="0" y1="48" x2="40" y2="48" marker-end="url(#tm)"/><text x="50" y="48">thread 指针（虚线）：指向中序前驱/后继</text><text y="80" fill="#666" font-size="11">利用空指针存线索 → 省去栈式遍历</text></g></g><g transform="translate(420,50)"><text class="title" x="170" y="0">中序线索化示例</text><text class="sub" x="170" y="18">中序序列：D B E A F C G</text><g><circle class="nd" cx="180" cy="55" r="16"/><text x="180" y="55" text-anchor="middle" font-weight="700">A</text><text x="160" y="40" font-size="10" fill="#1565c0">l:0</text><text x="195" y="40" font-size="10" fill="#1565c0">r:0</text></g><g><circle class="nd" cx="100" cy="115" r="16"/><text x="100" y="115" text-anchor="middle">B</text><text x="80" y="100" font-size="10" fill="#1565c0">l:0</text><text x="115" y="100" font-size="10" fill="#1565c0">r:0</text></g><g><circle class="nd" cx="260" cy="115" r="16"/><text x="260" y="115" text-anchor="middle">C</text><text x="240" y="100" font-size="10" fill="#1565c0">l:0</text><text x="275" y="100" font-size="10" fill="#1565c0">r:0</text></g><g><circle class="nd" cx="50" cy="180" r="14"/><text x="50" y="180" text-anchor="middle">D</text><text x="30" y="165" font-size="10" fill="#c0392b">l:1</text><text x="62" y="165" font-size="10" fill="#c0392b">r:1</text></g><g><circle class="nd" cx="150" cy="180" r="14"/><text x="150" y="180" text-anchor="middle">E</text><text x="130" y="165" font-size="10" fill="#c0392b">l:1</text><text x="162" y="165" font-size="10" fill="#c0392b">r:1</text></g><g><circle class="nd" cx="220" cy="180" r="14"/><text x="220" y="180" text-anchor="middle">F</text><text x="200" y="165" font-size="10" fill="#c0392b">l:1</text><text x="232" y="165" font-size="10" fill="#c0392b">r:1</text></g><g><circle class="nd" cx="310" cy="180" r="14"/><text x="310" y="180" text-anchor="middle">G</text><text x="290" y="165" font-size="10" fill="#c0392b">l:1</text><text x="322" y="165" font-size="10" fill="#c0392b">r:1</text></g><line class="child" x1="170" y1="67" x2="110" y2="103" marker-end="url(#cm)"/><line class="child" x1="190" y1="67" x2="250" y2="103" marker-end="url(#cm)"/><line class="child" x1="90" y1="127" x2="58" y2="167" marker-end="url(#cm)"/><line class="child" x1="110" y1="127" x2="142" y2="167" marker-end="url(#cm)"/><line class="child" x1="250" y1="127" x2="228" y2="167" marker-end="url(#cm)"/><line class="child" x1="270" y1="127" x2="302" y2="167" marker-end="url(#cm)"/><path class="thread" d="M58 185c12 25 34-35 37-58" marker-end="url(#tm)"/><path class="thread" d="M158 185c17 20 12-95 17-113" marker-end="url(#tm)"/><path class="thread" d="M228 185c12 15 22-45 27-58" marker-end="url(#tm)"/><path class="thread" d="M42 178c-17-8-22-48 38-60" marker-end="url(#tm)"/><path class="thread" d="M142 178c-22 2-37-43-32-51" marker-end="url(#tm)"/><path class="thread" d="M212 178c-17 2-32-88-37-106" marker-end="url(#tm)"/><path class="thread" d="M302 178c-12 2-32-38-37-51" marker-end="url(#tm)"/><text x="50" y="220" font-size="10" fill="#666" text-anchor="middle">D 无前驱</text><text x="310" y="220" font-size="10" fill="#666" text-anchor="middle">G 无后继</text><text x="170" y="260" font-size="11" fill="#555" text-anchor="middle">叶节点的空指针被改造为虚线线索，tag=1 用以区分</text></g></svg>