<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560"><text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c3e50">DNS 缓存 (DNS Cache)</text><text x="410" y="56" text-anchor="middle" font-size="13" fill="#7f8c8d">多级缓存 + TTL 生存周期，减少重复解析开销</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0V6L9 3z" fill="#34495e"/></marker><marker id="arrow-hit" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0V6L9 3z" fill="#27ae60"/></marker></defs><g><rect x="30" y="120" width="120" height="70" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="8"/><text x="90" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">主机</text><text x="90" y="170" text-anchor="middle" font-size="11" fill="#fff">浏览器 / OS</text></g><g><rect x="190" y="90" width="140" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="6"/><text x="260" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">① 浏览器缓存</text><text x="260" y="132" text-anchor="middle" font-size="11" fill="#7f8c8d">Chrome/Firefox 内部</text></g><g><rect x="190" y="160" width="140" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="6"/><text x="260" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">② 操作系统缓存</text><text x="260" y="202" text-anchor="middle" font-size="11" fill="#7f8c8d">hosts / stub resolver</text></g><g><rect x="370" y="125" width="160" height="70" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="6"/><text x="450" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">③ 本地 DNS 服务器缓存</text><text x="450" y="170" text-anchor="middle" font-size="11" fill="#7f8c8d">ISP / 校园网 递归解析器</text><text x="450" y="185" text-anchor="middle" font-size="11" fill="#7f8c8d">命中率最高</text></g><g><rect x="590" y="125" width="180" height="70" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="6"/><text x="680" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">权威 DNS 服务器</text><text x="680" y="170" text-anchor="middle" font-size="11" fill="#fff">根 → TLD → 权威</text><text x="680" y="185" text-anchor="middle" font-size="11" fill="#fff">未命中时才访问</text></g><line x1="150" y1="145" x2="188" y2="120" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/><line x1="150" y1="165" x2="188" y2="190" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/><line x1="330" y1="160" x2="368" y2="160" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/><line x1="530" y1="160" x2="588" y2="160" stroke="#34495e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/><text x="559" y="152" text-anchor="middle" font-size="10" fill="#c0392b">未命中</text><path d="M450 195q-150 65-295 0" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-hit)"/><text x="300" y="255" text-anchor="middle" font-size="11" fill="#27ae60" font-weight="bold">命中缓存则直接返回 IP</text><line x1="40" y1="290" x2="780" y2="290" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,4"/><text x="410" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">TTL (Time To Live) — 缓存的有效期</text><line x1="80" y1="380" x2="740" y2="380" stroke="#34495e" stroke-width="3"/><polygon points="740,380 730,375 730,385" fill="#34495e"/><text x="755" y="384" font-size="12" fill="#34495e">时间</text><circle cx="120" cy="380" r="6" fill="#e74c3c"/><line x1="120" y1="380" x2="120" y2="345" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2"/><text x="120" y="338" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">首次查询</text><text x="120" y="405" text-anchor="middle" font-size="11" fill="#34495e">解析并写入缓存</text><rect x="120" y="420" width="440" height="26" fill="#2ecc71" fill-opacity=".35" stroke="#27ae60" stroke-width="1.5" rx="4"/><text x="340" y="438" text-anchor="middle" font-size="12" fill="#1e8449" font-weight="bold">TTL 有效期内：直接读缓存</text><circle cx="260" cy="380" r="5" fill="#27ae60"/><line x1="260" y1="380" x2="260" y2="418" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/><circle cx="400" cy="380" r="5" fill="#27ae60"/><line x1="400" y1="380" x2="400" y2="418" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/><circle cx="560" cy="380" r="6" fill="#e67e22"/><line x1="560" y1="380" x2="560" y2="345" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="3,2"/><text x="560" y="338" text-anchor="middle" font-size="11" fill="#e67e22" font-weight="bold">TTL 到期</text><text x="560" y="405" text-anchor="middle" font-size="11" fill="#34495e">丢弃缓存记录</text><rect x="560" y="420" width="160" height="26" fill="#e74c3c" fill-opacity=".25" stroke="#c0392b" stroke-width="1.5" rx="4"/><text x="640" y="438" text-anchor="middle" font-size="12" fill="#a93226" font-weight="bold">下次需重新解析</text><g><rect x="80" y="480" width="660" height="70" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5" rx="6"/><text x="95" y="502" font-size="12" font-weight="bold" fill="#7d6608">示例：</text><text x="95" y="521" font-size="12" fill="#34495e">DNS 记录<tspan font-family="monospace" fill="#c0392b">www.example.com → 93.184.216.34</tspan>的 TTL =<tspan font-weight="bold" fill="#c0392b">3600s</tspan></text><text x="95" y="536" font-size="12" fill="#34495e">→ 未来 1 小时内所有相同查询都直接命中缓存，无需再走 根 / TLD / 权威 服务器。</text></g></svg>