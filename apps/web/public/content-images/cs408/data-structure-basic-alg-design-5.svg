<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#555"/></marker><marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#27AE60"/></marker><marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0V6L8 3z" fill="#2C7BB6"/></marker></defs><text x="200" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">BST 中序遍历 — 天然递增序列</text><circle cx="200" cy="60" r="20" fill="#F5A623" stroke="none"/><text x="200" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">10</text><circle cx="120" cy="120" r="20" fill="#F5A623" stroke="none"/><text x="120" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">5</text><line x1="183" y1="74" x2="137" y2="106" stroke="#999" stroke-width="1.5"/><circle cx="280" cy="120" r="20" fill="#F5A623" stroke="none"/><text x="280" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">15</text><line x1="217" y1="74" x2="263" y2="106" stroke="#999" stroke-width="1.5"/><circle cx="80" cy="190" r="20" fill="#2C7BB6" stroke="none"/><text x="80" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text><line x1="105" y1="135" x2="95" y2="175" stroke="#999" stroke-width="1.5"/><circle cx="160" cy="190" r="20" fill="#2C7BB6" stroke="none"/><text x="160" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">7</text><line x1="135" y1="135" x2="145" y2="175" stroke="#999" stroke-width="1.5"/><circle cx="240" cy="190" r="20" fill="#2C7BB6" stroke="none"/><text x="240" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">12</text><line x1="265" y1="135" x2="255" y2="175" stroke="#999" stroke-width="1.5"/><circle cx="320" cy="190" r="20" fill="#2C7BB6" stroke="none"/><text x="320" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">18</text><line x1="295" y1="135" x2="305" y2="175" stroke="#999" stroke-width="1.5"/><text x="20" y="248" font-size="11" fill="#888">中序遍历（左→根→右）：</text><circle cx="60" cy="270" r="16" fill="#EBF9E0" stroke="#27AE60" stroke-width="1.5"/><text x="60" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">3</text><line x1="76" y1="270" x2="90" y2="270" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arr-g)"/><circle cx="106" cy="270" r="16" fill="#EBF9E0" stroke="#27AE60" stroke-width="1.5"/><text x="106" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">5</text><line x1="122" y1="270" x2="136" y2="270" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arr-g)"/><circle cx="152" cy="270" r="16" fill="#EBF9E0" stroke="#27AE60" stroke-width="1.5"/><text x="152" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">7</text><line x1="168" y1="270" x2="182" y2="270" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arr-g)"/><circle cx="198" cy="270" r="16" fill="#FEF9C0" stroke="#E0BB00" stroke-width="2"/><text x="198" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#B8860B">10</text><line x1="214" y1="270" x2="228" y2="270" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arr-g)"/><circle cx="244" cy="270" r="16" fill="#EBF9E0" stroke="#27AE60" stroke-width="1.5"/><text x="244" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">12</text><line x1="260" y1="270" x2="274" y2="270" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arr-g)"/><circle cx="290" cy="270" r="16" fill="#EBF9E0" stroke="#27AE60" stroke-width="1.5"/><text x="290" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">15</text><line x1="306" y1="270" x2="320" y2="270" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arr-g)"/><circle cx="336" cy="270" r="16" fill="#EBF9E0" stroke="#27AE60" stroke-width="1.5"/><text x="336" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#27AE60">18</text><text x="20" y="305" font-size="11" fill="#555">中序结果有序 → 可借助它判断 BST 合法性、找差值最小结点（2026年）</text><line x1="400" y1="15" x2="400" y2="330" stroke="#DDD" stroke-width="1" stroke-dasharray="5,4"/><text x="580" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">层序遍历（BFS）— 队列驱动</text><circle cx="580" cy="60" r="18" fill="#9B59B6" stroke="none"/><text x="580" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">A</text><circle cx="520" cy="120" r="18" fill="#9B59B6" stroke="none"/><text x="520" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">B</text><line x1="565" y1="73" x2="535" y2="107" stroke="#999" stroke-width="1.5"/><circle cx="640" cy="120" r="18" fill="#9B59B6" stroke="none"/><text x="640" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">C</text><line x1="595" y1="73" x2="625" y2="107" stroke="#999" stroke-width="1.5"/><circle cx="490" cy="185" r="18" fill="#2C7BB6" stroke="none"/><text x="490" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">D</text><line x1="507" y1="134" x2="497" y2="171" stroke="#999" stroke-width="1.5"/><circle cx="550" cy="185" r="18" fill="#2C7BB6" stroke="none"/><text x="550" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">E</text><line x1="533" y1="134" x2="543" y2="171" stroke="#999" stroke-width="1.5"/><circle cx="640" cy="185" r="18" fill="#2C7BB6" stroke="none"/><text x="640" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">F</text><line x1="640" y1="138" x2="640" y2="171" stroke="#999" stroke-width="1.5"/><text x="420" y="230" font-size="12" font-weight="bold" fill="#555">Queue 状态：</text><rect x="420" y="238" width="320" height="20" rx="4" fill="#F5EEFF" stroke="#9B59B6" stroke-width="1"/><text x="428" y="253" font-size="11" fill="#333">入：A → 出 A，入 B C</text><rect x="420" y="262" width="320" height="20" rx="4" fill="#DEF" stroke="#2C7BB6" stroke-width="1"/><text x="428" y="277" font-size="11" fill="#333">队列 [B,C] → 出 B，入 D E；出 C，入 F</text><rect x="420" y="286" width="320" height="20" rx="4" fill="#EBF9E0" stroke="#27AE60" stroke-width="1"/><text x="428" y="301" font-size="11" fill="#333">队列 [D,E,F] → 依次出队（叶结点）</text><text x="420" y="330" font-size="12" fill="#555">访问顺序：</text><circle cx="500" cy="326" r="12" fill="#9B59B6" stroke="none"/><text x="500" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A</text><text x="515" y="330" font-size="12" fill="#999">→</text><circle cx="530" cy="326" r="12" fill="#9B59B6" stroke="none"/><text x="530" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B</text><text x="545" y="330" font-size="12" fill="#999">→</text><circle cx="560" cy="326" r="12" fill="#9B59B6" stroke="none"/><text x="560" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C</text><text x="575" y="330" font-size="12" fill="#999">→</text><circle cx="590" cy="326" r="12" fill="#2C7BB6" stroke="none"/><text x="590" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D</text><text x="605" y="330" font-size="12" fill="#999">→</text><circle cx="620" cy="326" r="12" fill="#2C7BB6" stroke="none"/><text x="620" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">E</text><text x="635" y="330" font-size="12" fill="#999">→</text><circle cx="650" cy="326" r="12" fill="#2C7BB6" stroke="none"/><text x="650" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">F</text></svg>