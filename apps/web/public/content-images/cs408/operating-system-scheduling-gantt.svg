<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="同一组进程在 FCFS、非抢占 SJF、SRTF、时间片轮转四种调度下的甘特图">
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .c{font:700 11px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .tk{stroke:#94a3b8;stroke-width:1;fill:none}
    .ax{stroke:#475569;stroke-width:1.2;fill:none}
    .p1{fill:#cfe3f7;stroke:#2563eb;stroke-width:1.2}
    .p2{fill:#fde3c8;stroke:#b06a00;stroke-width:1.2}
    .p3{fill:#d8ecd0;stroke:#3f7a34;stroke-width:1.2}
    .p4{fill:#e6dcf5;stroke:#6b3fa0;stroke-width:1.2}
  </style>

  <text class="t" x="18" y="26">同一组进程，四种调度的甘特图：谁先跑、什么时候被抢</text>
  <text class="n" x="18" y="46">P1(0,7)、P2(2,4)、P3(4,1)、P4(5,4)——括号里是（到达时间，服务时间），时间片 q=2</text>

  <!-- FCFS -->
  <text class="s" x="18" y="82">FCFS</text>
  <rect class="p1" x="120" y="66" width="238" height="26" rx="3"/><text class="c" x="239" y="84" text-anchor="middle">P1</text>
  <rect class="p2" x="358" y="66" width="136" height="26" rx="3"/><text class="c" x="426" y="84" text-anchor="middle">P2</text>
  <rect class="p3" x="494" y="66" width="34" height="26" rx="3"/><text class="c" x="511" y="84" text-anchor="middle">P3</text>
  <rect class="p4" x="528" y="66" width="136" height="26" rx="3"/><text class="c" x="596" y="84" text-anchor="middle">P4</text>
  <text class="n" x="676" y="84">平均周转 8.75</text>

  <!-- SJF -->
  <text class="s" x="18" y="132">SJF（非抢占）</text>
  <rect class="p1" x="120" y="116" width="238" height="26" rx="3"/><text class="c" x="239" y="134" text-anchor="middle">P1</text>
  <rect class="p3" x="358" y="116" width="34" height="26" rx="3"/><text class="c" x="375" y="134" text-anchor="middle">P3</text>
  <rect class="p2" x="392" y="116" width="136" height="26" rx="3"/><text class="c" x="460" y="134" text-anchor="middle">P2</text>
  <rect class="p4" x="528" y="116" width="136" height="26" rx="3"/><text class="c" x="596" y="134" text-anchor="middle">P4</text>
  <text class="n" x="676" y="134">平均周转 8.0</text>

  <!-- SRTF -->
  <text class="s" x="18" y="182">SRTF（抢占）</text>
  <rect class="p1" x="120" y="166" width="68" height="26" rx="3"/><text class="c" x="154" y="184" text-anchor="middle">P1</text>
  <rect class="p2" x="188" y="166" width="68" height="26" rx="3"/><text class="c" x="222" y="184" text-anchor="middle">P2</text>
  <rect class="p3" x="256" y="166" width="34" height="26" rx="3"/><text class="c" x="273" y="184" text-anchor="middle">P3</text>
  <rect class="p2" x="290" y="166" width="68" height="26" rx="3"/><text class="c" x="324" y="184" text-anchor="middle">P2</text>
  <rect class="p4" x="358" y="166" width="136" height="26" rx="3"/><text class="c" x="426" y="184" text-anchor="middle">P4</text>
  <rect class="p1" x="494" y="166" width="170" height="26" rx="3"/><text class="c" x="579" y="184" text-anchor="middle">P1</text>
  <text class="n" x="676" y="184">平均周转 7.0</text>

  <!-- RR -->
  <text class="s" x="18" y="232">RR（q=2）</text>
  <rect class="p1" x="120" y="216" width="68" height="26" rx="3"/><text class="c" x="154" y="234" text-anchor="middle">P1</text>
  <rect class="p2" x="188" y="216" width="68" height="26" rx="3"/><text class="c" x="222" y="234" text-anchor="middle">P2</text>
  <rect class="p1" x="256" y="216" width="68" height="26" rx="3"/><text class="c" x="290" y="234" text-anchor="middle">P1</text>
  <rect class="p3" x="324" y="216" width="34" height="26" rx="3"/><text class="c" x="341" y="234" text-anchor="middle">P3</text>
  <rect class="p2" x="358" y="216" width="68" height="26" rx="3"/><text class="c" x="392" y="234" text-anchor="middle">P2</text>
  <rect class="p4" x="426" y="216" width="68" height="26" rx="3"/><text class="c" x="460" y="234" text-anchor="middle">P4</text>
  <rect class="p1" x="494" y="216" width="68" height="26" rx="3"/><text class="c" x="528" y="234" text-anchor="middle">P1</text>
  <rect class="p4" x="562" y="216" width="68" height="26" rx="3"/><text class="c" x="596" y="234" text-anchor="middle">P4</text>
  <rect class="p1" x="630" y="216" width="34" height="26" rx="3"/><text class="c" x="647" y="234" text-anchor="middle">P1</text>
  <text class="n" x="676" y="234">平均周转 9.0</text>

  <!-- 时间轴 -->
  <path class="ax" d="M120 262 H690" marker-end="url(#ar)"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <path class="tk" d="M120 262 V268 M188 262 V268 M256 262 V268 M324 262 V268 M392 262 V268 M460 262 V268 M528 262 V268 M596 262 V268 M664 262 V268"/>
  <text class="n" x="120" y="282" text-anchor="middle">0</text>
  <text class="n" x="188" y="282" text-anchor="middle">2</text>
  <text class="n" x="256" y="282" text-anchor="middle">4</text>
  <text class="n" x="324" y="282" text-anchor="middle">6</text>
  <text class="n" x="392" y="282" text-anchor="middle">8</text>
  <text class="n" x="460" y="282" text-anchor="middle">10</text>
  <text class="n" x="528" y="282" text-anchor="middle">12</text>
  <text class="n" x="596" y="282" text-anchor="middle">14</text>
  <text class="n" x="664" y="282" text-anchor="middle">16</text>

  <!-- 说明 -->
  <text class="n" x="18" y="312">SRTF 是唯一会"抢"的：t=2 P2 到达（剩余 4 &lt; P1 剩余 5）抢一次，t=4 P3 到达（1 &lt; P2 剩余 2）再抢一次；</text>
  <text class="n" x="18" y="334">t=5 P4 到达（4 &gt; P2 剩余 2）不抢，P2 先跑完。所以 SRTF 平均周转最小（7.0），但上下文切换最多。</text>
  <text class="n" x="18" y="356">RR 每 2 个时间单位换人：P1 跑了 0-2 后要等到 4 才再上，P3 到 6-7 才有机会跑完；平均周转 9.0 比 SJF 差，但响应时间最均匀。</text>
  <text class="n" x="18" y="378">注意：四种调度的"完成时间"不同，算平均周转时间时要用各自的完成时间，别拿同一个甘特图套四个公式。</text>
</svg>
