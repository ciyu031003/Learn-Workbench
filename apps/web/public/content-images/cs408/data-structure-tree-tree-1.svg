.75C80-93.52 94.12-59.19 102.4-39.05"/></g><g id="node6" class="node"><title>info</title><text text-anchor="start" x="216" y="-175.8" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="14">以结点 D 为例：</text><text text-anchor="start" x="216" y="-155.8" font-family="Helvetica,sans-Serif" font-size="14">• B 是 D 的双亲</text><text text-anchor="start" x="216" y="-136.8" font-family="Helvetica,sans-Serif" font-size="14">• A、B 是 D 的祖先</text><text text-anchor="start" x="216" y="-117.8" font-family="Helvetica,sans-Serif" font-size="14">• E 是 D 的兄弟</text><text text-anchor="start" x="216" y="-98.8" font-family="Helvetica,sans-Serif" font-size="14">• D 是 B 的孩子</text><text text-anchor="start" x="216" y="-79.8" font-family="Helvetica,sans-Serif" font-size="14">• D 是 A 的子孙</text></g></g></svg>