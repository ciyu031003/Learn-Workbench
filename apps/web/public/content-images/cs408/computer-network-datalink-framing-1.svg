<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350"><rect width="600" height="350" fill="none"/><text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">数据链路层组帧</text><rect x="50" y="70" width="120" height="40" fill="#3498db" stroke="#2980b9" stroke-width="2"/><text x="110" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">网络层报文</text><text x="110" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">(Packet)</text><path d="M180 90h40" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/><text x="200" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">组帧</text><g transform="translate(240, 70)"><rect x="0" y="0" width="60" height="40" fill="#e67e22" stroke="#d35400" stroke-width="2"/><text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff">帧头</text><rect x="60" y="0" width="120" height="40" fill="#3498db" stroke="#2980b9" stroke-width="2"/><text x="120" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff">数据</text><rect x="180" y="0" width="60" height="40" fill="#e67e22" stroke="#d35400" stroke-width="2"/><text x="210" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff">帧尾</text></g><text x="390" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">帧 (Frame)</text><text x="50" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">帧定界示例：</text><text x="50" y="210" font-family="Arial, sans-serif" font-size="12" fill="#34495e">发送端：</text><g transform="translate(120, 195)"><rect x="0" y="0" width="20" height="25" fill="#e67e22"/><rect x="20" y="0" width="60" height="25" fill="#3498db"/><rect x="80" y="0" width="20" height="25" fill="#e67e22"/><rect x="110" y="0" width="20" height="25" fill="#e67e22"/><rect x="130" y="0" width="60" height="25" fill="#27ae60"/><rect x="190" y="0" width="20" height="25" fill="#e67e22"/><rect x="220" y="0" width="20" height="25" fill="#e67e22"/><rect x="240" y="0" width="60" height="25" fill="#9b59b6"/><rect x="300" y="0" width="20" height="25" fill="#e67e22"/></g><text x="270" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">帧1 帧2 帧3</text><path d="M3e2 250v30" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/><text x="320" y="270" font-family="Arial, sans-serif" font-size="10" fill="#e74c3c">传输</text><text x="50" y="310" font-family="Arial, sans-serif" font-size="12" fill="#34495e">接收端：</text><g transform="translate(120, 295)"><rect x="0" y="0" width="320" height="25" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/><line x1="20" y1="0" x2="20" y2="25" stroke="#e74c3c" stroke-width="2"/><line x1="100" y1="0" x2="100" y2="25" stroke="#e74c3c" stroke-width="2"/><line x1="130" y1="0" x2="130" y2="25" stroke="#e74c3c" stroke-width="2"/><line x1="210" y1="0" x2="210" y2="25" stroke="#e74c3c" stroke-width="2"/><line x1="240" y1="0" x2="240" y2="25" stroke="#e74c3c" stroke-width="2"/><line x1="320" y1="0" x2="320" y2="25" stroke="#e74c3c" stroke-width="2"/><text x="60" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">帧1</text><text x="170" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">帧2</text><text x="280" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">帧3</text></g><text x="280" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">通过帧头/帧尾进行帧定界</text><g transform="translate(450, 180)"><rect x="0" y="0" width="140" height="120" fill="#fff" stroke="#bdc3c7" stroke-width="1" rx="5"/><text x="70" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">关键概念</text><circle cx="15" cy="40" r="3" fill="#e67e22"/><text x="25" y="45" font-family="Arial, sans-serif" font-size="10" fill="#34495e">帧头/帧尾：标识边界</text><circle cx="15" cy="60" r="3" fill="#3498db"/><text x="25" y="65" font-family="Arial, sans-serif" font-size="10" fill="#34495e">数据：网络层报文</text><circle cx="15" cy="80" r="3" fill="#e74c3c"/><text x="25" y="85" font-family="Arial, sans-serif" font-size="10" fill="#34495e">帧定界：区分帧边界</text><circle cx="15" cy="100" r="3" fill="#27ae60"/><text x="25" y="105" font-family="Arial, sans-serif" font-size="10" fill="#34495e">组帧：添加控制信息</text></g><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/></marker></defs></svg>