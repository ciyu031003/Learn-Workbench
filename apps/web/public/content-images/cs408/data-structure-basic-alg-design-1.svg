="1.4" marker-end="url(#arrow)"/><rect x="565" y="375" width="176" height="54" rx="8" fill="#fff" stroke="#9B59B6" stroke-width="1.6"/><text x="653" y="397" text-anchor="middle" font-size="12" fill="#555">路径 / 统计 / 高度</text><text x="653" y="417" text-anchor="middle" font-size="13" fill="#2C7BB6" font-weight="bold">递归 DFS</text><line x1="908" y1="169" x2="908" y2="195" stroke="#E74C3C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="820" y="195" width="176" height="54" rx="8" fill="#fff" stroke="#E74C3C" stroke-width="1.6"/><text x="908" y="217" text-anchor="middle" font-size="12" fill="#555">连通性 / 可达性 / 路径</text><text x="908" y="237" text-anchor="middle" font-size="13" fill="#2C7BB6" font-weight="bold">BFS / DFS</text><line x1="908" y1="249" x2="908" y2="275" stroke="#E74C3C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="820" y="275" width="176" height="54" rx="8" fill="#fff" stroke="#E74C3C" stroke-width="1.6"/><text x="908" y="297" text-anchor="middle" font-size="12" fill="#555">前驱约束 / 工程顺序</text><text x="908" y="317" text-anchor="middle" font-size="13" fill="#2C7BB6" font-weight="bold">拓扑排序</text><line x1="908" y1="329" x2="908" y2="355" stroke="#E74C3C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="820" y="355" width="176" height="62" rx="8" fill="#fff" stroke="#E74C3C" stroke-width="1.6"/><text x="908" y="377" text-anchor="middle" font-size="12" fill="#555">最短路 / 最小生成树</text><text x="908" y="397" text-anchor="middle" font-size="13" fill="#2C7BB6" font-weight="bold">Dijkstra / Prim</text><text x="908" y="411" text-anchor="middle" font-size="11" fill="#888">Kruskal 也常用</text><line x1="908" y1="417" x2="908" y2="445" stroke="#E74C3C" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="820" y="445" width="176" height="32" rx="8" fill="#FFF0F0" stroke="#E74C3C" stroke-width="1.4"/><text x="908" y="466" text-anchor="middle" font-size="13" fill="#C0392B" font-weight="bold">AOE 关键路径</text><rect x="85" y="525" width="870" height="62" rx="12" fill