<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-label="SPOOLing 假脱机系统的组成：输入井与输出井、输入进程与输出进程、内存缓冲区">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.4}
    .y{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.6}
    .g{fill:#f3f7f1;stroke:#2b2b2b;stroke-width:1.3}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .l{stroke:#2b2b2b;stroke-width:1.4;fill:none}
    .o{stroke:#b06a00;stroke-width:1.6;fill:none}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06a00"/></marker>
  </defs>

  <text class="t" x="18" y="26">SPOOLing（假脱机）：输入井 / 输出井 + 输入进程 / 输出进程，把独占设备变成共享设备</text>

  <!-- 上排：输入通路 -->
  <rect class="b" x="18" y="58" width="108" height="46" rx="3"/>
  <text class="s" x="30" y="86">输入设备</text>

  <rect class="g" x="152" y="58" width="104" height="46" rx="3"/>
  <text class="n" x="162" y="80">内存</text>
  <text class="n" x="162" y="96">输入缓冲区</text>

  <rect class="b" x="282" y="58" width="104" height="46" rx="3"/>
  <text class="s" x="294" y="86">输入进程</text>

  <!-- 磁盘：输入井 / 输出井 -->
  <rect class="y" x="470" y="48" width="272" height="286" rx="6"/>
  <text class="s" x="486" y="72">磁盘（共享设备）</text>
  <rect class="b" x="486" y="84" width="240" height="76" rx="3"/>
  <text class="s" x="498" y="108">输入井</text>
  <text class="n" x="498" y="128">已输入待处理的数据集合</text>
  <text class="n" x="498" y="148">（相当于“虚拟输入机”）</text>
  <rect class="b" x="486" y="180" width="240" height="76" rx="3"/>
  <text class="s" x="498" y="204">输出井</text>
  <text class="n" x="498" y="224">已产生待输出的结果集合</text>
  <text class="n" x="498" y="244">（相当于“虚拟打印机”）</text>
  <text class="n" x="486" y="292">井 = 磁盘上的一片区域，用来暂存数据</text>
  <text class="n" x="486" y="314">正因为它是共享的，多用户才能“同时”用</text>

  <!-- 中排：用户进程 -->
  <rect class="b" x="152" y="172" width="234" height="46" rx="3"/>
  <text class="s" x="164" y="194">用户进程</text>
  <text class="n" x="164" y="212">读输入井 / 写输出井，不直接碰设备</text>

  <!-- 下排：输出通路 -->
  <rect class="b" x="282" y="278" width="104" height="46" rx="3"/>
  <text class="s" x="294" y="306">输出进程</text>

  <rect class="g" x="152" y="278" width="104" height="46" rx="3"/>
  <text class="n" x="162" y="300">内存</text>
  <text class="n" x="162" y="316">输出缓冲区</text>

  <rect class="b" x="18" y="278" width="108" height="46" rx="3"/>
  <text class="s" x="30" y="306">输出设备</text>

  <!-- 连线 -->
  <path class="l" d="M126 81 L148 81" marker-end="url(#ar)"/>
  <path class="l" d="M256 81 L278 81" marker-end="url(#ar)"/>
  <path class="l" d="M386 81 L466 81" marker-end="url(#ar)"/>

  <path class="o" d="M486 168 L390 168" marker-end="url(#ao)"/>
  <path class="o" d="M386 200 L484 200" marker-end="url(#ao)"/>

  <path class="l" d="M466 301 L390 301" marker-end="url(#ar)"/>
  <path class="l" d="M278 301 L256 301" marker-end="url(#ar)"/>
  <path class="l" d="M148 301 L126 301" marker-end="url(#ar)"/>

  <text class="n" x="392" y="162">读出</text>
  <text class="n" x="400" y="216">写入</text>

  <!-- 结论 -->
  <text class="n" x="18" y="362">要点：用户进程“写打印机”其实只是把数据写进输出井就返回了，真正驱动设备的是输出进程 —— 所以用户不会被慢设备卡住</text>
  <text class="n" x="18" y="386">效果：独占设备 → 共享设备（一台打印机可为多个用户排队输出）；SPOOLing 用外存换时间，又叫虚拟设备技术</text>
  <text class="n" x="18" y="410">与缓冲的区别：缓冲区在内存、只解决 CPU 与设备的速度匹配；SPOOLing 用磁盘、解决的是设备“不能被多个进程同时用”</text>
</svg>
