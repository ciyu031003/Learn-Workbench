<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340" role="img" aria-label="字位同时扩展：两片一组做位扩展，再4组用译码器做字扩展">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.5}
    .g{fill:#eef7ee;stroke:#2b2b2b;stroke-width:1.5}
    .y{fill:#eaf2fb;stroke:#2b2b2b;stroke-width:1.5}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 12px "Microsoft YaHei",system-ui,sans-serif;fill:#4a4a4a}
    .l{stroke:#2b2b2b;stroke-width:1.3;fill:none}
    .s{stroke:#b06a00;stroke-width:1.5;fill:none}
  </style>
  <defs>
    <marker id="mw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="ms" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06a00"/></marker>
  </defs>

  <text class="t" x="20" y="24">字位同时扩展：4 组 × 每组 2 片 = 8 片（组内位扩展，组间字扩展）</text>

  <!-- 译码器 -->
  <rect class="y" x="96" y="52" width="92" height="150" rx="3"/>
  <text class="t" x="106" y="76">2-4</text>
  <text class="t" x="106" y="96">译码器</text>
  <text class="n" x="106" y="126">A(n)~</text>
  <text class="n" x="106" y="144">A(n+1)</text>

  <!-- 4 组，每组 2 片 -->
  <g>
    <rect class="g" x="286" y="44" width="300" height="36" rx="3"/><text class="n" x="300" y="67">组 0：片 0 ｜ 片 1（8 位 + 8 位 = 16 位）</text>
    <rect class="g" x="286" y="96" width="300" height="36" rx="3"/><text class="n" x="300" y="119">组 1：片 2 ｜ 片 3</text>
    <rect class="g" x="286" y="148" width="300" height="36" rx="3"/><text class="n" x="300" y="171">组 2：片 4 ｜ 片 5</text>
    <rect class="g" x="286" y="200" width="300" height="36" rx="3"/><text class="n" x="300" y="223">组 3：片 6 ｜ 片 7</text>
  </g>

  <path class="s" d="M188 66 L282 62" marker-end="url(#ms)"/>
  <path class="s" d="M188 108 L282 114" marker-end="url(#ms)"/>
  <path class="s" d="M188 150 L282 166" marker-end="url(#ms)"/>
  <path class="s" d="M188 192 L282 218" marker-end="url(#ms)"/>
  <text class="n" x="196" y="240">每条译码输出同时接到该组两片的 CS</text>

  <!-- 公共地址/数据 -->
  <path class="l" d="M24 128 L92 128" marker-end="url(#mw)"/>
  <text class="n" x="16" y="120">A₀~A(n−1)</text>
  <text class="n" x="16" y="146">8 片共用</text>

  <path class="l" d="M590 250 L700 250"/>
  <path class="l" d="M640 236 L640 250"/>
  <text class="n" x="340" y="270">D₀~D₁₅：组内两片各出 8 位，拼接成 16 位字长</text>

  <text class="n" x="24" y="300">先算片数：目标容量 ÷ 单片容量；再拆成「每组几片（位数比）× 几组（字数比）」。</text>
  <text class="n" x="24" y="320">判别口诀：组内共享地址、拼数据线（位扩展）；组间共享数据线、抢片选（字扩展）。</text>
</svg>
