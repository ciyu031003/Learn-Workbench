<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="用记录型信号量实现互斥的时序：P1 进入临界区时 S 从 1 变 0，P2 等待时变 -1 并阻塞，P1 退出时变 0 唤醒 P2">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .c{font:600 11px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .v{font:700 12px "Consolas",monospace;fill:#1d1d1d}
    .box{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.3}
    .bar{fill:#d8ecd0;stroke:#3f7a34;stroke-width:1.3}
    .blk{fill:url(#hatch);stroke:#94a3b8;stroke-width:1.2}
    .step{stroke:#b06a00;stroke-width:2;fill:none}
    .ar{stroke:#2b2b2b;stroke-width:1.5;fill:none}
  </style>

  <text class="t" x="18" y="26">记录型信号量实现互斥：value 的三个取值时刻</text>
  <text class="n" x="18" y="46">wait：value--，若 &lt;0 就阻塞；signal：value++，若 ≤0 就唤醒一个等待者。下图 S 初值为 1</text>

  <!-- P1 -->
  <text class="s" x="108" y="100" text-anchor="end">P1</text>
  <rect class="box" x="120" y="78" width="80" height="30" rx="5"/>
  <text class="c" x="160" y="97" text-anchor="middle">wait(S)</text>
  <rect class="bar" x="200" y="78" width="120" height="30" rx="4"/>
  <text class="c" x="260" y="97" text-anchor="middle">临界区</text>
  <rect class="box" x="320" y="78" width="80" height="30" rx="5"/>
  <text class="c" x="360" y="97" text-anchor="middle">signal(S)</text>

  <!-- P2 -->
  <text class="s" x="108" y="160" text-anchor="end">P2</text>
  <rect class="box" x="120" y="138" width="80" height="30" rx="5"/>
  <text class="c" x="160" y="157" text-anchor="middle">wait(S)</text>
  <rect class="blk" x="200" y="138" width="120" height="30" rx="4"/>
  <text class="c" x="260" y="157" text-anchor="middle">阻塞（排队）</text>
  <rect class="bar" x="330" y="138" width="160" height="30" rx="4"/>
  <text class="c" x="410" y="157" text-anchor="middle">临界区</text>
  <rect class="box" x="490" y="138" width="80" height="30" rx="5"/>
  <text class="c" x="530" y="157" text-anchor="middle">signal(S)</text>

  <!-- 唤醒箭头 -->
  <path class="ar" d="M360 108 V138" marker-end="url(#a)"/>
  <text class="n" x="368" y="128">唤醒</text>

  <!-- S.value 阶梯 -->
  <text class="s" x="108" y="246" text-anchor="end">S.value</text>
  <path class="step" d="M120 230 H150 V255 H220 V280 H355 V255 H500 V230 H580"/>
  <text class="v" x="134" y="224" text-anchor="middle">1</text>
  <text class="v" x="185" y="249" text-anchor="middle">0</text>
  <text class="v" x="288" y="274" text-anchor="middle">−1</text>
  <text class="v" x="428" y="249" text-anchor="middle">0</text>
  <text class="v" x="540" y="224" text-anchor="middle">1</text>
  <text class="n" x="150" y="296" text-anchor="middle">P1 wait</text>
  <text class="n" x="225" y="296" text-anchor="middle">P2 wait</text>
  <text class="n" x="355" y="296" text-anchor="middle">P1 signal</text>
  <text class="n" x="500" y="296" text-anchor="middle">P2 signal</text>

  <!-- 结论 -->
  <text class="n" x="18" y="326">临界区互斥靠的就是 value 的"加减"：P1 占着时 value=0，谁再 wait 就变负、被挂进等待队列；</text>
  <text class="n" x="18" y="348">图里 value 到 <tspan font-weight="600">−1</tspan> 的那一段，<tspan font-weight="600">|−1| = 1 就是排队进程数</tspan>（只有 P2 在等）——这是"信号量取值含义"题的读图依据。</text>
  <text class="n" x="18" y="370">只把 value 当计数器、忘了"阻塞/唤醒"，就会把互斥写成忙等（整型信号量）；记录型信号量靠等待队列实现让权等待。</text>
</svg>
