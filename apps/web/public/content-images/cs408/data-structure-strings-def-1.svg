<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13"><style>.title{font-weight:600;font-size:14px;text-anchor:middle}.lbl{font-size:11px;fill:#555}.cell{fill:#fff;stroke:#333}.ptr{fill:none;stroke:#333;stroke-width:1.5;marker-end:url(#arr)}.meta{fill:#eef3ff;stroke:#3a5bd9}.heap{fill:#fff5e6;stroke:#cc7a00}.block{fill:#eef9ee;stroke:#2e8b57}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#333"/></marker></defs><text class="title" x="125" y="28">定长顺序存储</text><text class="lbl" x="125" y="46" text-anchor="middle">char data[MAX_SIZE]; int length;</text><g transform="translate(20,70)"><rect class="meta" x="0" y="0" width="210" height="28"/><text x="105" y="18" text-anchor="middle">length = 5</text><text class="lbl" x="105" y="46" text-anchor="middle">定长数组（容量预先固定）</text><g transform="translate(0,60)"><rect class="cell" x="0" y="0" width="30" height="30"/><text x="15" y="20" text-anchor="middle">H</text><rect class="cell" x="30" y="0" width="30" height="30"/><text x="45" y="20" text-anchor="middle">e</text><rect class="cell" x="60" y="0" width="30" height="30"/><text x="75" y="20" text-anchor="middle">l</text><rect class="cell" x="90" y="0" width="30" height="30"/><text x="105" y="20" text-anchor="middle">l</text><rect class="cell" x="120" y="0" width="30" height="30"/><text x="135" y="20" text-anchor="middle">o</text><rect class="cell" x="150" y="0" width="30" height="30" fill="#f4f4f4"/><rect class="cell" x="180" y="0" width="30" height="30" fill="#f4f4f4"/><text class="lbl" x="195" y="20" text-anchor="middle">…</text></g><text class="lbl" x="105" y="130" text-anchor="middle">↑ 已用 5 / 容量 MAX_SIZE</text><text class="lbl" x="105" y="150" text-anchor="middle">缺点：超出容量需截断或重建</text></g><text class="title" x="380" y="28">堆分配存储</text><text class="lbl" x="380" y="46" text-anchor="middle">char *data; int length;</text><g transform="translate(275,70)"><rect class="meta" x="0" y="0" width="210" height="28"/><text x="60" y="18" text-anchor="middle">data ●</text><text x="155" y="18" text-anchor="middle">length = 5</text><path class="ptr" d="M75 28c0 27-15 32-40 47"/><text class="lbl" x="105" y="46" text-anchor="middle">栈上结构体 + 堆上动态数组</text><g transform="translate(0,80)"><rect class="heap" x="20" y="0" width="170" height="30"/><text x="35" y="20" text-anchor="middle">H</text><text x="55" y="20" text-anchor="middle">e</text><text x="75" y="20" text-anchor="middle">l</text><text x="95" y="20" text-anchor="middle">l</text><text x="115" y="20" text-anchor="middle">o</text><text x="135" y="20" text-anchor="middle">\0</text><line x1="45" y1="0" x2="45" y2="30" stroke="#cc7a00"/><line x1="65" y1="0" x2="65" y2="30" stroke="#cc7a00"/><line x1="85" y1="0" x2="85" y2="30" stroke="#cc7a00"/><line x1="105" y1="0" x2="105" y2="30" stroke="#cc7a00"/><line x1="125" y1="0" x2="125" y2="30" stroke="#cc7a00"/></g><text class="lbl" x="105" y="130" text-anchor="middle">长度按需 malloc，可动态扩展</text><text class="lbl" x="105" y="150" text-anchor="middle">特点：连续存储，需手动 free</text></g><text class="title" x="635" y="28">块链存储</text><text class="lbl" x="635" y="46" text-anchor="middle">char data[k]; Block *next;</text><g transform="translate(530,70)"><rect class="meta" x="0" y="0" width="210" height="28"/><text x="60" y="18" text-anchor="middle">head ●</text><text x="155" y="18" text-anchor="middle">length = 5</text><path class="ptr" d="M75 28c0 27-25 32-45 52"/><text class="lbl" x="105" y="46" text-anchor="middle">头指针 + 字符块链表</text><g transform="translate(0,75)"><rect class="block" x="10" y="0" width="80" height="28"/><text x="22" y="18" text-anchor="middle">H</text><text x="38" y="18" text-anchor="middle">e</text><text x="54" y="18" text-anchor="middle">l</text><text x="70" y="18" text-anchor="middle">l</text><line x1="30" y1="0" x2="30" y2="28" stroke="#2e8b57"/><line x1="46" y1="0" x2="46" y2="28" stroke="#2e8b57"/><line x1="62" y1="0" x2="62" y2="28" stroke="#2e8b57"/><rect class="block" x="90" y="0" width="20" height="28"/><circle cx="100" cy="14" r="3" fill="#2e8b57"/><path class="ptr" d="M110 14h20"/><rect class="block" x="130" y="0" width="80" height="28"/><text x="142" y="18" text-anchor="middle">o</text><text x="158" y="18" text-anchor="middle">#</text><text x="174" y="18" text-anchor="middle">#</text><text x="190" y="18" text-anchor="middle">#</text><line x1="150" y1="0" x2="150" y2="28" stroke="#2e8b57"/><line x1="166" y1="0" x2="166" y2="28" stroke="#2e8b57"/><line x1="182" y1="0" x2="182" y2="28" stroke="#2e8b57"/></g><text class="lbl" x="105" y="125" text-anchor="middle">每块容量 k=4；末块用 # 填充</text><text class="lbl" x="105" y="145" text-anchor="middle">特点：易插入删除，存在内碎片</text></g><line x1="250" y1="55" x2="250" y2="225" stroke="#ddd"/><line x1="505" y1="55" x2="505" y2="225" stroke="#ddd"/><text x="380" y="248" text-anchor="middle" font-size="12" fill="#666">空间利用率：定长 ≤ 堆分配；插入/删除灵活度：块链 &gt; 堆分配 &gt; 定长</text></svg>