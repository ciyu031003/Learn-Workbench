<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392" role="img" aria-label="扩展操作码：16 位指令、4 位基本操作码，靠每级留一个编码逐级扩展成二地址、一地址、零地址指令">
  <style>
    .b{fill:#fff;stroke:#2b2b2b;stroke-width:1.4}
    .y{fill:#eef4fb;stroke:#2b2b2b;stroke-width:1.5}
    .g{fill:#f3f7f1;stroke:#2b2b2b;stroke-width:1.3}
    .t{font:600 13.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .v{font:600 11.5px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .l{stroke:#2b2b2b;stroke-width:1.3;fill:none}
    .o{stroke:#b06a00;stroke-width:1.5;fill:none}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b06a00"/></marker>
  </defs>

  <text class="t" x="18" y="26">扩展操作码：16 位指令、4 位基本操作码，每级「留一个编码」继续往下扩</text>

  <!-- 三地址 -->
  <text class="s" x="18" y="70">三地址</text>
  <text class="n" x="18" y="88">15 条</text>
  <rect class="y" x="150" y="56" width="90" height="34"/>
  <text class="n" x="162" y="78">OP 4 位</text>
  <rect class="b" x="240" y="56" width="90" height="34"/>
  <text class="n" x="262" y="78">A1 4 位</text>
  <rect class="b" x="330" y="56" width="90" height="34"/>
  <text class="n" x="352" y="78">A2 4 位</text>
  <rect class="b" x="420" y="56" width="90" height="34"/>
  <text class="n" x="442" y="78">A3 4 位</text>
  <text class="v" x="530" y="70">0000 ~ 1110</text>
  <text class="n" x="530" y="88">（1111 留着扩）</text>

  <!-- 二地址 -->
  <text class="s" x="18" y="140">二地址</text>
  <text class="n" x="18" y="158">15 条</text>
  <rect class="y" x="150" y="126" width="180" height="34"/>
  <text class="n" x="162" y="148">OP 8 位（1111 + 4 位）</text>
  <rect class="b" x="330" y="126" width="90" height="34"/>
  <text class="n" x="352" y="148">A1 4 位</text>
  <rect class="b" x="420" y="126" width="90" height="34"/>
  <text class="n" x="442" y="148">A2 4 位</text>
  <text class="v" x="530" y="140">1111 0000 ~ 1111 1110</text>
  <text class="n" x="530" y="158">（1111 1111 留着扩）</text>

  <!-- 一地址 -->
  <text class="s" x="18" y="210">一地址</text>
  <text class="n" x="18" y="228">15 条</text>
  <rect class="y" x="150" y="196" width="270" height="34"/>
  <text class="n" x="162" y="218">OP 12 位（1111 1111 + 4 位）</text>
  <rect class="b" x="420" y="196" width="90" height="34"/>
  <text class="n" x="442" y="218">A1 4 位</text>
  <text class="v" x="530" y="210">1111 1111 0000 ~</text>
  <text class="v" x="530" y="228">1111 1111 1110</text>

  <!-- 零地址 -->
  <text class="s" x="18" y="280">零地址</text>
  <text class="n" x="18" y="298">16 条</text>
  <rect class="g" x="150" y="266" width="360" height="34"/>
  <text class="n" x="162" y="288">OP 16 位（前 12 位全 1）</text>
  <text class="v" x="530" y="280">1111 1111 1111 0000 ~</text>
  <text class="v" x="530" y="298">1111 1111 1111 1111</text>

  <!-- 右侧扩展箭头 -->
  <path class="o" d="M118 90 L118 176" marker-end="url(#ao)"/>
  <path class="o" d="M118 160 L118 246" marker-end="url(#ao)"/>
  <path class="o" d="M118 230 L118 316" marker-end="url(#ao)"/>

  <!-- 结论 -->
  <text class="n" x="18" y="336">铁律：短操作码不能是任何长操作码的前缀 —— 否则译码时无法判断这 4 位该单独解释、还是该和后面的位一起解释</text>
  <text class="n" x="18" y="358">算法：先按「字段总长 = 指令字长」倒推每级可用的编码数；每留 1 个编码，下一级就多出 2⁴=16 个编码</text>
  <text class="n" x="18" y="380">验算：15+15+15+16 条恰好把 4 位到 8 位、12 位、16 位的编码全部用尽，一条不剩、也不越界</text>
</svg>
