<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="存储系统层次结构：寄存器、Cache、主存、SSD、磁盘，自上而下容量增大、速度降低、单位成本降低">
  <style>
    .t{font:600 15px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .s{font:600 12.5px "Microsoft YaHei",system-ui,sans-serif;fill:#1d1d1d}
    .n{font:400 11.5px "Microsoft YaHei",system-ui,sans-serif;fill:#3f3f3f}
    .c{font:600 11.5px "Consolas","Microsoft YaHei",monospace;fill:#1d1d1d}
    .l1{fill:#fbe0e0;stroke:#b23a3a;stroke-width:1.3}
    .l2{fill:#fde3c8;stroke:#b06a00;stroke-width:1.3}
    .l3{fill:#cfe3f7;stroke:#2563eb;stroke-width:1.3}
    .l4{fill:#d8ecd0;stroke:#3f7a34;stroke-width:1.3}
    .l5{fill:#e6dcf5;stroke:#6b3fa0;stroke-width:1.3}
    .ar{stroke:#2b2b2b;stroke-width:1.4;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <text class="t" x="18" y="26">存储系统的层次：用便宜的存储，"作出"接近最快的效果</text>
  <text class="n" x="18" y="46">条越宽 = 容量越大；自上而下：容量递增、速度递减、每字节成本递减</text>

  <text class="s" x="100" y="88" text-anchor="end">寄存器</text>
  <rect class="l1" x="120" y="68" width="130" height="36" rx="5"/>
  <text class="c" x="132" y="91">KB 级，&lt;1 ns</text>

  <text class="s" x="100" y="140" text-anchor="end">Cache</text>
  <rect class="l2" x="120" y="120" width="230" height="36" rx="5"/>
  <text class="c" x="132" y="143">MB 级，1~10 ns</text>

  <text class="s" x="100" y="192" text-anchor="end">主存</text>
  <rect class="l3" x="120" y="172" width="330" height="36" rx="5"/>
  <text class="c" x="132" y="195">GB 级，50~100 ns</text>

  <text class="s" x="100" y="244" text-anchor="end">SSD（辅存）</text>
  <rect class="l4" x="120" y="224" width="430" height="36" rx="5"/>
  <text class="c" x="132" y="247">TB 级，0.05~0.2 ms</text>

  <text class="s" x="100" y="296" text-anchor="end">磁盘（辅存）</text>
  <rect class="l5" x="120" y="276" width="530" height="36" rx="5"/>
  <text class="c" x="132" y="299">TB 级，5~10 ms</text>

  <!-- 右侧三个箭头 -->
  <path class="ar" d="M690 66 V318" marker-end="url(#a)"/>
  <text class="n" x="700" y="150">容量 ↑</text>
  <text class="n" x="700" y="190">速度 ↓</text>
  <text class="n" x="700" y="230">成本 ↓</text>

  <!-- 说明 -->
  <text class="n" x="18" y="340">两级配合：<tspan font-weight="600">Cache–主存</tspan>解决"速度差"（由硬件管理），<tspan font-weight="600">主存–辅存（虚拟存储器）</tspan>解决"容量差"（OS + MMU 共同管理）。</text>
  <text class="n" x="18" y="362">两者的前提都是<tspan font-weight="600">局部性原理</tspan>：时间局部性（刚用过的还会用）与空间局部性（附近的数据也可能用）。</text>
  <text class="n" x="18" y="384">答题别写反：自上而下是"容量变大、速度变慢、成本变低"；越靠上层越快越贵、容量越小。</text>
  <text class="n" x="18" y="406">数字是量级参考，具体题目以题给参数为准，别把上表的纳秒数当成定值背。</text>
</svg>
