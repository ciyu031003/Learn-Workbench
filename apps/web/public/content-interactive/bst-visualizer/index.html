<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二叉搜索树（BST）可视化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; }
  .wrap { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .head { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
  .head h1 { font-size: 16px; font-weight: 600; }
  .head .info { font-size: 12px; opacity: .9; }
  .controls { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid #eef2f7; }
  .controls label { font-size: 12px; color: #64748b; }
  input[type=number] { width: 90px; padding: 5px 8px; border-radius: 8px; border: 1px solid #e2e8f0; outline: none; font-size: 13px; }
  button { padding: 6px 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all .15s; font-size: 13px; }
  .btn-insert { background: #6366f1; color: #fff; }
  .btn-insert:hover { background: #4f46e5; }
  .btn-delete { background: #ef4444; color: #fff; }
  .btn-delete:hover { background: #dc2626; }
  .btn-find { background: #10b981; color: #fff; }
  .btn-find:hover { background: #059669; }
  .btn-ghost { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .btn-ghost:hover { background: #e2e8f0; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .speed-group { display: flex; gap: 4px; }
  .speed-group button { padding: 4px 10px; font-size: 12px; }
  .speed-group .active { background: #6366f1; color: #fff; border-color: #6366f1; }
  .msg { padding: 8px 16px; font-size: 12px; color: #475569; border-bottom: 1px solid #eef2f7; min-height: 28px; }
  .msg b { color: #334155; }
  .msg .ok { color: #059669; }
  .msg .bad { color: #dc2626; }
  .stage { padding: 20px 16px; overflow-x: auto; min-height: 320px; display: flex; justify-content: center; align-items: flex-start; }
  .tree { display: flex; justify-content: center; }
  .node { position: relative; display: flex; flex-direction: column; align-items: center; margin: 0 4px; }
  .node .circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: #6366f1; color: #fff; border: 3px solid #6366f1; transition: all .2s; position: relative; z-index: 2; }
  .node .circle.empty { background: #fff; border: 3px dashed #cbd5e1; color: #cbd5e1; }
  .node .children { display: flex; justify-content: center; }
  .node .branch { display: flex; flex-direction: column; align-items: center; position: relative; padding-top: 18px; }
  .node .branch::before { content: ""; position: absolute; top: 0; left: 50%; width: 2px; height: 18px; background: #cbd5e1; }
  .node .child { position: relative; }
  .node .child::before { content: ""; position: absolute; top: 0; width: 50%; height: 2px; background: #cbd5e1; }
  .node .child.left::before { left: 50%; }
  .node .child.right::before { right: 50%; }
  .node.highlight .circle { background: #f59e0b; border-color: #f59e0b; transform: scale(1.15); box-shadow: 0 0 12px rgba(245,158,11,.5); }
  .node.found .circle { background: #10b981; border-color: #10b981; }
  .node.removed .circle { background: #ef4444; border-color: #ef4444; text-decoration: line-through; }
  .legend { padding: 6px 16px 12px; display: flex; gap: 14px; font-size: 11px; color: #64748b; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .desc { padding: 10px 16px 16px; border-top: 1px solid #eef2f7; font-size: 12px; color: #475569; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🌳 二叉搜索树（BST）可视化</h1>
    <span class="info">插入 O(logn) · 查找 O(logn) · 中序遍历有序</span>
  </div>
  <div class="controls">
    <label>值</label>
    <input type="number" id="valInput" value="50" min="-999" max="999">
    <button class="btn-insert" id="btnInsert">＋ 插入</button>
    <button class="btn-delete" id="btnDelete">－ 删除</button>
    <button class="btn-find" id="btnFind">🔍 查找</button>
    <button class="btn-ghost" id="btnRandom">🎲 随机生成</button>
    <button class="btn-ghost" id="btnClear">清空</button>
    <div class="speed-group">
      <button class="btn-ghost" data-speed="900">慢</button>
      <button class="btn-ghost active" data-speed="500">中</button>
      <button class="btn-ghost" data-speed="220">快</button>
    </div>
    <button class="btn-primary" id="btnPlay">▶ 播放</button>
    <button class="btn-ghost" id="btnStep">单步</button>
    <button class="btn-ghost" id="btnReset">↺ 重置</button>
  </div>
  <div class="msg" id="msg">输入数值，点击插入/删除/查找</div>
  <div class="stage" id="stage"></div>
  <div class="legend">
    <span><i style="background:#6366f1"></i>结点</span>
    <span><i style="background:#f59e0b"></i>路径/比较</span>
    <span><i style="background:#10b981"></i>查找成功</span>
    <span><i style="background:#ef4444"></i>被删除</span>
  </div>
  <div class="desc">
    <b>性质：</b>左子树所有结点 &lt; 根 &lt; 右子树所有结点；中序遍历得到递增序列。<br>
    <b>插入：</b>从根开始比较，小往左、大往右，找到空位挂上。<br>
    <b>删除：</b>①叶结点直接删 ②单孩子用孩子顶替 ③双孩子用<b>右子树最小（或左子树最大）</b>替代。
  </div>
</div>

<script>
"use strict";
let root = null;

const $ = (id) => document.getElementById(id);
const stage = $("stage");

/* ── 动画调度器（可暂停 / 可单步 / 可变速 / 可重置）──────────────
   此前动画时长写死在 setTimeout(…, 350/600) 里：点一下就只能看它自己演完，
   既不能停、不能一步步看、也不能调速。现在把"每一步"做成入队的函数，
   由播放/单步/重置统一驱动。 */
let steps = [], cursor = 0, playing = false, animTimer = null, speed = 500;

function updatePlayBtn() { const b = $("btnPlay"); if (b) b.textContent = playing ? "⏸ 暂停" : "▶ 播放"; }
function stopTimer() { if (animTimer) { clearTimeout(animTimer); animTimer = null; } }
function loadSteps(list) { stopTimer(); playing = false; steps = list || []; cursor = 0; updatePlayBtn(); }
function runOne() { if (cursor >= steps.length) return false; steps[cursor++](); return true; }
function tick() {
  animTimer = null;
  if (!playing) return;
  if (!runOne() || cursor >= steps.length) { playing = false; updatePlayBtn(); return; }
  animTimer = setTimeout(tick, speed);
}
function play() {
  if (playing) { playing = false; stopTimer(); updatePlayBtn(); return; }
  if (cursor >= steps.length) return;   // 已演完就不再重播（重播会重复改树）
  playing = true; updatePlayBtn(); tick();
}
function stepOnce() {
  stopTimer(); playing = false; updatePlayBtn();
  runOne();
}

function Node(val) {
  this.val = val;
  this.left = null;
  this.right = null;
}

// ---- 树渲染 ----
function renderNode(node, highlight, found, removed) {
  if (!node) {
    const d = document.createElement("div");
    d.className = "node";
    d.innerHTML = '<div class="circle empty">·</div>';
    return d;
  }
  const d = document.createElement("div");
  d.className = "node";
  if (highlight) d.classList.add("highlight");
  if (found) d.classList.add("found");
  if (removed) d.classList.add("removed");

  const circle = document.createElement("div");
  circle.className = "circle";
  circle.textContent = node.val;
  d.appendChild(circle);

  if (node.left || node.right) {
    const children = document.createElement("div");
    children.className = "children";
    const bl = document.createElement("div");
    bl.className = "branch";
    bl.style.marginRight = "6px";
    const lc = document.createElement("div");
    lc.className = "child left";
    lc.appendChild(renderNode(node.left, highlight === node.left ? "hl" : null, found === node.left, removed === node.left));
    bl.appendChild(lc);
    const br = document.createElement("div");
    br.className = "branch";
    br.style.marginLeft = "6px";
    const rc = document.createElement("div");
    rc.className = "child right";
    rc.appendChild(renderNode(node.right, highlight === node.right ? "hl" : null, found === node.right, removed === node.right));
    br.appendChild(rc);
    children.appendChild(bl);
    children.appendChild(br);
    d.appendChild(children);
  }
  return d;
}

function render(highlightPath = [], foundNode = null, removedNode = null) {
  stage.innerHTML = "";
  if (!root) {
    stage.innerHTML = '<div style="color:#94a3b8;font-size:13px;padding-top:80px">树为空，请插入结点</div>';
    return;
  }
  stage.appendChild(renderNode(root, null, foundNode, removedNode));
}

// ---- 插入（可暂停 / 可单步演示：沿路径高亮）----
function insertVal(val) {
  const newNode = new Node(val);
  if (!root) {
    root = newNode;
    loadSteps([]);
    render();
    msg(`✅ 插入 ${val}（根结点）`);
    return;
  }
  let cur = root;
  const path = [cur];
  while (true) {
    if (val < cur.val) {
      if (!cur.left) { cur.left = newNode; break; }
      cur = cur.left;
    } else if (val > cur.val) {
      if (!cur.right) { cur.right = newNode; break; }
      cur = cur.right;
    } else {
      loadSteps([]);
      msg(`⚠️ ${val} 已存在`);
      render();
      return;
    }
    path.push(cur);
  }
  const list = [];
  path.forEach((node, k) => {
    list.push(() => {
      render(path.slice(0, k + 1));
      msg(`🔍 比较：${val} vs ${node.val}（${val < node.val ? "向左" : "向右"}）`);
    });
  });
  list.push(() => {
    render(null, null, null);
    msg(`✅ 插入 ${val} 完成`);
  });
  loadSteps(list);
  play();   // 保留"点一下就开演"的手感，但随时可暂停 / 单步 / 调速
}

// ---- 查找（可暂停 / 可单步演示）----
function findVal(val) {
  if (!root) { msg("树为空"); return; }
  const list = [];
  const path = [];
  let cur = root;
  while (true) {
    if (!cur) {
      list.push(() => { render(path); msg(`❌ 查找 ${val}：不存在（到达空位置）`); });
      break;
    }
    path.push(cur);
    const snap = path.slice();
    if (cur.val === val) {
      const node = cur;
      list.push(() => { render(snap, node); msg(`✅ 查找 ${val}：找到！（比较了 ${snap.length} 次）`); });
      break;
    }
    const node = cur;
    list.push(() => { render(snap); msg(`🔍 比较：${node.val}（${val < node.val ? "向左" : "向右"}）`); });
    cur = val < cur.val ? cur.left : cur.right;
  }
  loadSteps(list);
  play();
}

// ---- 删除 ----
function deleteVal(val) {
  if (!root) { msg("树为空"); return; }
  // 找结点及父结点
  let parent = null, cur = root, dir = "";
  while (cur && cur.val !== val) {
    parent = cur;
    if (val < cur.val) { dir = "left"; cur = cur.left; }
    else { dir = "right"; cur = cur.right; }
  }
  if (!cur) { loadSteps([]); render(); msg(`❌ 删除 ${val}：不存在`); return; }

  const node = cur;
  const list = [];
  // 第 1 步：高亮被删结点
  list.push(() => { render([], null, node); msg(`🗑️ 准备删除 ${val}...`); });
  // 第 2 步：真正删除
  list.push(() => {
    if (!node.left && !node.right) {
      // 叶结点
      if (!parent) root = null;
      else parent[dir] = null;
    } else if (!node.left || !node.right) {
      // 单孩子
      const child = node.left || node.right;
      if (!parent) root = child;
      else parent[dir] = child;
    } else {
      // 双孩子：用右子树最小替代
      let minParent = node, minNode = node.right;
      while (minNode.left) { minParent = minNode; minNode = minNode.left; }
      node.val = minNode.val;
      if (minParent === node) minParent.right = minNode.right;
      else minParent.left = minNode.right;
    }
    render();
    msg(`✅ 删除 ${val} 完成`);
  });
  loadSteps(list);
  play();
}

// ---- 重置：回到初始示例树 ----
function resetDemo() {
  loadSteps([]);
  root = null;
  [50, 30, 70, 20, 40, 60, 80, 35, 45].forEach((v) => {
    const n = new Node(v);
    if (!root) root = n;
    else {
      let c = root;
      while (true) {
        if (v < c.val) { if (!c.left) { c.left = n; break; } c = c.left; }
        else { if (!c.right) { c.right = n; break; } c = c.right; }
      }
    }
  });
  render();
  msg("示例 BST 已就绪：试试插入 55、查找 45、删除 30（双孩子情况）");
}

// ---- 事件 ----
$("btnInsert").onclick = () => {
  const v = parseInt($("valInput").value);
  if (isNaN(v)) return;
  insertVal(v);
};
$("btnFind").onclick = () => {
  const v = parseInt($("valInput").value);
  if (isNaN(v)) return;
  findVal(v);
};
$("btnDelete").onclick = () => {
  const v = parseInt($("valInput").value);
  if (isNaN(v)) return;
  deleteVal(v);
};
$("btnRandom").onclick = () => {
  loadSteps([]);
  root = null;
  const vals = [];
  while (vals.length < 12) {
    const v = Math.floor(Math.random() * 180) - 40;
    if (!vals.includes(v)) vals.push(v);
  }
  vals.forEach((v) => {
    const n = new Node(v);
    if (!root) root = n;
    else {
      let c = root;
      while (true) {
        if (v < c.val) { if (!c.left) { c.left = n; break; } c = c.left; }
        else { if (!c.right) { c.right = n; break; } c = c.right; }
      }
    }
  });
  render();
  msg("🎲 已生成随机 BST（中序遍历即有序）——点「↺ 重置」可回到示例树");
};
$("btnClear").onclick = () => {
  loadSteps([]);
  root = null;
  render();
  msg("已清空（点「↺ 重置」可回到初始示例树）");
};
$("btnPlay").onclick = play;
$("btnStep").onclick = stepOnce;
$("btnReset").onclick = resetDemo;
document.querySelectorAll(".speed-group button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".speed-group button").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    speed = +b.dataset.speed;
  };
});
$("valInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnInsert").onclick(); });

function msg(t) { $("msg").innerHTML = t; }

// init：装载初始示例树（与「↺ 重置」完全一致）
resetDemo();
updatePlayBtn();
</script>
</body>
</html>
