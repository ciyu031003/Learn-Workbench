<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSMA/CD 与二进制指数退避可视化</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; }
  .wrap { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .head { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .head h1 { font-size: 16px; font-weight: 600; }
  .head .info { font-size: 12px; opacity: .92; }
  .controls { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; border-bottom: 1px solid #eef2f7; }
  .controls label { font-size: 12px; color: #64748b; }
  select, input[type=range], button { font-size: 13px; }
  select { padding: 4px 6px; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; outline: none; }
  button { padding: 5px 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all .15s; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-ghost { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .btn-ghost:hover { background: #e2e8f0; }
  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .stats { padding: 7px 16px; display: flex; gap: 16px; font-size: 12px; color: #64748b; border-bottom: 1px solid #eef2f7; flex-wrap: wrap; }
  .stats b { color: #1e293b; font-variant-numeric: tabular-nums; }
  .stage { padding: 10px 16px 6px; }
  .stations { display: flex; align-items: flex-end; padding: 0 6%; }
  .stwrap { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .st { width: 96%; border: 1px solid #e2e8f0; border-top: 3px solid #94a3b8; border-radius: 8px; background: #fbfcfe; padding: 5px 6px; text-align: center; transition: border-top-color .15s, background .15s, box-shadow .15s; }
  .st.c-idle    { border-top-color: #94a3b8; }
  .st.c-sense   { border-top-color: #f59e0b; background: #fffbeb; }
  .st.c-tx      { border-top-color: #10b981; background: #ecfdf5; box-shadow: 0 0 0 2px #10b98122; }
  .st.c-jam     { border-top-color: #ef4444; background: #fef2f2; box-shadow: 0 0 0 2px #ef444422; }
  .st.c-backoff { border-top-color: #8b5cf6; background: #f5f3ff; }
  .st.c-wait    { border-top-color: #6366f1; background: #eef2ff; }
  .st.c-fail    { border-top-color: #ef4444; background: #fef2f2; opacity: .75; }
  .stname { font-size: 12px; font-weight: 600; color: #334155; }
  .ststate { font-size: 11px; margin-top: 1px; }
  .stmeta { font-size: 10px; color: #94a3b8; margin-top: 1px; line-height: 1.35; min-height: 26px; }
  .stub { width: 2px; height: 16px; background: #cbd5e1; }
  .stub.on { background: #10b981; }
  .stub.jam { background: #ef4444; }
  .bustrack { position: relative; height: 54px; margin: 0; }
  .busline { position: absolute; left: 6%; right: 6%; top: 14px; height: 10px; border-radius: 5px; background: linear-gradient(180deg, #cbd5e1, #94a3b8); transition: background .15s, box-shadow .15s; }
  .busline.busy { background: linear-gradient(180deg, #6ee7b7, #10b981); box-shadow: 0 0 10px #10b98166; }
  .busline.jam { background: linear-gradient(180deg, #fca5a5, #ef4444); box-shadow: 0 0 10px #ef444466; }
  .buscap { position: absolute; top: 12px; font-size: 9px; color: #94a3b8; }
  .buscap.l { left: 6%; transform: translateX(-100%); padding-right: 4px; }
  .buscap.r { right: 6%; transform: translateX(100%); padding-left: 4px; }
  .pulse { position: absolute; top: 11px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #6366f1; box-shadow: 0 0 8px #6366f199; transition: left .25s linear, opacity .25s linear; }
  .pulse.jam { background: #ef4444; box-shadow: 0 0 10px #ef4444aa; }
  .buslabel { position: absolute; top: 32px; left: 6%; font-size: 10px; color: #94a3b8; }
  .cwbox { margin: 2px 6% 0; }
  .cwbar { position: relative; height: 16px; border-radius: 8px; background: #f1f5f9; border: 1px solid #e2e8f0; overflow: hidden; }
  .cwfill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #a5b4fc, #6366f1); transition: width .2s linear; }
  .cwfill.bad { background: linear-gradient(90deg, #fca5a5, #ef4444); }
  .cwmark { position: absolute; top: 0; bottom: 0; width: 2px; background: #ef4444; }
  .cwlabel { font-size: 10px; color: #64748b; margin-top: 2px; display: flex; justify-content: space-between; }
  .status { margin: 6px 16px 0; padding: 7px 10px; border-radius: 8px; background: #f8fafc; border: 1px solid #eef2f7; font-size: 12px; color: #334155; min-height: 32px; line-height: 1.5; }
  .status b { color: #6366f1; }
  .legend { padding: 6px 16px 4px; display: flex; gap: 14px; font-size: 11px; color: #64748b; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .desc { padding: 8px 16px 14px; border-top: 1px solid #eef2f7; margin-top: 6px; font-size: 12px; color: #475569; line-height: 1.75; }
  .desc b { color: #334155; }
  .desc code { background: #f1f5f9; border-radius: 4px; padding: 0 4px; font-size: 11px; }
  .speed-group { display: flex; gap: 4px; }
  .speed-group button { padding: 4px 9px; font-size: 12px; }
  .speed-group .active { background: #6366f1; color: #fff; }
  input[type=range] { width: 84px; accent-color: #6366f1; vertical-align: middle; }
  .hint { font-size: 10px; color: #94a3b8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>📡 CSMA/CD 与二进制指数退避</h1>
    <span class="info" id="headInfo">载波监听多路访问 / 冲突检测</span>
  </div>

  <div class="controls">
    <label>站点数</label>
    <select id="selN">
      <option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option>
    </select>
    <label>传播时延 τ</label>
    <input type="range" id="rngTau" min="1" max="5" value="2">
    <span class="hint" id="tauVal">2 时隙</span>
    <label>帧长</label>
    <input type="range" id="rngFrame" min="4" max="20" value="10">
    <span class="hint" id="frameVal">10 时隙</span>
    <label>协议</label>
    <select id="selProto">
      <option value="p1" selected>1-坚持 CSMA</option>
      <option value="np">非坚持 CSMA</option>
      <option value="pp">p-坚持 CSMA</option>
    </select>
    <label>p</label>
    <input type="range" id="rngP" min="1" max="9" value="5">
    <span class="hint" id="pVal">0.5</span>
    <button class="btn-danger" id="btnForce">⚡ 制造同时发送</button>
    <div class="speed-group">
      <button data-speed="700" class="btn-ghost">慢</button>
      <button data-speed="250" class="btn-ghost active">中</button>
      <button data-speed="60" class="btn-ghost">快</button>
    </div>
    <button class="btn-primary" id="btnPlay">▶ 播放</button>
    <button class="btn-ghost" id="btnStep">单步</button>
    <button class="btn-ghost" id="btnReset">↺ 重置</button>
  </div>

  <div class="stats">
    <span>仿真时间 <b id="statT">0</b> 时隙</span>
    <span>冲突 <b id="statCol">0</b> 次</span>
    <span>成功发送 <b id="statOk">0</b> 帧</span>
    <span>信道利用率 <b id="statUtil">0%</b></span>
    <span>冲突浪费 <b id="statWaste">0 时隙</b></span>
    <span>状态 <b id="statState">就绪</b></span>
  </div>

  <div class="stage">
    <div class="stations" id="stations"></div>
    <div class="bustrack">
      <div class="busline" id="busline"></div>
      <span class="buscap l">◀</span><span class="buscap r">▶</span>
      <div id="pulses"></div>
      <div class="buslabel" id="buslabel">共享总线（广播信道，信号双向传播，单程传播时延 τ）</div>
    </div>
    <div class="cwbox">
      <div class="cwbar"><div class="cwfill" id="cwfill" style="width:0"></div></div>
      <div class="cwlabel">
        <span id="cwLeft">争用期 2τ：发送方必须在 2τ 内仍能听到冲突</span>
        <span id="cwRight">—</span>
      </div>
    </div>
  </div>

  <div class="status" id="statusLine">点击 <b>播放</b> 或 <b>单步</b> 开始仿真：各站点随机产生帧，先监听信道再决定发送。</div>

  <div class="legend">
    <span><i style="background:#94a3b8"></i>空闲</span>
    <span><i style="background:#f59e0b"></i>监听信道（载波监听）</span>
    <span><i style="background:#10b981"></i>正在发送（边发边听）</span>
    <span><i style="background:#ef4444"></i>冲突 / 强化干扰信号 Jamming</span>
    <span><i style="background:#8b5cf6"></i>二进制指数退避等待</span>
    <span><i style="background:#6366f1"></i>非坚持/p-坚持随机等待</span>
  </div>

  <div class="desc" id="desc"></div>
</div>

<script>
"use strict";

/* ============================ 全局状态 ============================ */
var $ = function (id) { return document.getElementById(id); };

var CFG = {
  n: 4,            // 站点数
  tau: 2,          // 单程传播时延（时隙）
  frame: 10,       // 帧发送时延（时隙）
  proto: "p1",     // p1 / np / pp
  p: 0.5           // p-坚持概率
};

var S = {
  t: 0,
  stations: [],
  pulses: [],
  collisions: 0,
  successes: 0,
  busyTicks: 0,
  jamTicks: 0,
  misdetect: 0,        // 帧太短导致未检测到冲突的次数
  lastTxStart: -999,
  lastTxJam: false,
  cwCollide: -1,       // 争用期内发生冲突的相对时刻
  finished: false,
  log: []
};

var speed = 250;
var timer = null;
var playing = false;
var NAMES = ["A", "B", "C", "D", "E", "F"];

function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function posOf(i, n) { return (i + 0.5) / n; }   // 站点在总线上的相对位置 0~1

/* ============================ 初始化 ============================ */
function makeStation(i) {
  return {
    id: i,
    name: "站点 " + NAMES[i],
    x: posOf(i, CFG.n),
    state: "idle",       // idle | sense | wait | tx | jam | backoff | fail
    pending: false,
    nextArrival: randInt(2, 10),
    txStart: 0, txEnd: 0, jamStart: 0, jamUntil: 0,
    collisionAt: null,
    warnShort: false,
    collisions: 0,
    backoff: null,       // {i, slots, k, until}
    wakeT: 0,
    sent: 0,
    note: ""
  };
}

function reset() {
  stopTimer();
  playing = false;
  S.t = 0;
  S.pulses = [];
  S.collisions = 0;
  S.successes = 0;
  S.busyTicks = 0;
  S.jamTicks = 0;
  S.misdetect = 0;
  S.lastTxStart = -999;
  S.lastTxJam = false;
  S.cwCollide = -1;
  S.finished = false;
  S.stations = [];
  for (var i = 0; i < CFG.n; i++) S.stations.push(makeStation(i));
  buildStations();
  $("btnPlay").textContent = "▶ 播放";
  $("statState").textContent = "就绪";
  updateStats();
  render();
  setStatus("已重置：共 " + CFG.n + " 个站点共享一条总线，τ = " + CFG.tau +
            " 时隙，争用期 2τ = " + (2 * CFG.tau) + " 时隙，帧发送时延 = " + CFG.frame + " 时隙。");
  updateDesc();
}

function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }

/* ============================ 仿真核心 ============================ */
// 站点 i 在 t 时刻"能感知到"的信道是否忙（考虑传播时延：别的站点的信号要 τ 后才到达）
function visibleBusy(st, t) {
  for (var i = 0; i < S.stations.length; i++) {
    var o = S.stations[i];
    if (o === st) continue;
    if (o.state === "tx" && o.txStart + CFG.tau <= t && t <= o.txEnd + CFG.tau) return true;
    if (o.state === "jam" && o.jamStart + CFG.tau <= t && t <= o.jamUntil + CFG.tau) return true;
  }
  return false;
}
// 总线上真实是否有信号
function busRealBusy() {
  for (var i = 0; i < S.stations.length; i++) {
    var o = S.stations[i];
    if (o.state === "tx" || o.state === "jam") return o.state === "jam" ? 2 : 1;
  }
  return 0;
}

function startTx(st) {
  st.state = "tx";
  st.txStart = S.t;
  st.txEnd = S.t + CFG.frame;
  st.collisionAt = null;
  st.warnShort = false;
  st.note = CFG.proto === "p1" ? "信道空闲，立即发送" : "信道空闲，开始发送";
  S.lastTxStart = S.t;
  S.lastTxJam = false;
  S.cwCollide = -1;
  S.pulses.push({ x: st.x, t0: S.t, dir: 1, jam: false });
  S.pulses.push({ x: st.x, t0: S.t, dir: -1, jam: false });
  // 与正在发送的站点发生冲突：双方最多 2τ 后都能检测到
  for (var i = 0; i < S.stations.length; i++) {
    var o = S.stations[i];
    if (o === st) continue;
    if (o.state === "tx") {
      var d = S.t + CFG.tau;
      if (st.collisionAt === null) st.collisionAt = d;
      if (o.collisionAt === null) o.collisionAt = d;
    } else if (o.state === "jam" && o.jamStart + CFG.tau > S.t) {
      // 干扰信号还在路上、自己没听到 → 发送后 τ 才发现信道早就不干净
      if (st.collisionAt === null) st.collisionAt = S.t + CFG.tau;
    }
  }
}

function startJam(st) {
  st.state = "jam";
  st.jamStart = S.t;
  st.jamUntil = S.t + 2 * CFG.tau;
  st.collisions++;
  st.txEnd = 0;
  st.collisionAt = null;
  S.collisions++;
  S.lastTxJam = true;
  S.cwCollide = S.t - S.lastTxStart;
  st.note = "检测到冲突！立即停止发送 → 发强化干扰信号";
  S.pulses.push({ x: st.x, t0: S.t, dir: 1, jam: true });
  S.pulses.push({ x: st.x, t0: S.t, dir: -1, jam: true });
  if (st.collisions >= 16) st.pendingFail = true;
}

function startBackoff(st) {
  if (st.pendingFail) {
    st.state = "fail";
    st.pending = false;
    st.note = "连续冲突 16 次，放弃发送并向上层报错";
    return;
  }
  var i = Math.min(st.collisions, 10);        // 2^10 = 1024 个时隙后不再翻倍
  var slots = Math.pow(2, i);
  var k = randInt(0, slots - 1);
  var wait = k * 2 * CFG.tau;
  st.backoff = { i: i, slots: slots, k: k, until: S.t + wait, wait: wait };
  st.state = "backoff";
  st.note = "第 " + i + " 次冲突：" + (i >= 10 ? "从 {0…1023}" : "从 {0…" + (slots - 1) + "}") +
            " 中取 k = " + k + "，退避 " + k + "×2τ = " + wait + " 时隙";
}

function step() {
  if (S.finished) return;
  S.t++;

  // 1) 新帧到达
  for (var i = 0; i < S.stations.length; i++) {
    var st = S.stations[i];
    if (st.state === "idle" && !st.pending && S.t >= st.nextArrival) {
      st.pending = true;
      st.state = "sense";
      st.note = "有帧要发送，开始监听信道";
    }
  }

  // 2) 退避 / 随机等待结束 → 重新监听
  for (i = 0; i < S.stations.length; i++) {
    st = S.stations[i];
    if (st.state === "backoff" && S.t >= st.backoff.until) {
      st.state = "sense";
      st.note = "退避结束，重新监听信道";
    } else if (st.state === "wait" && S.t >= st.wakeT) {
      st.state = "sense";
      st.note = "等待结束，重新监听信道";
    }
  }

  // 3) 干扰信号结束 → 进入退避
  for (i = 0; i < S.stations.length; i++) {
    st = S.stations[i];
    if (st.state === "jam" && S.t >= st.jamUntil) {
      st.state = "backoff";
      startBackoff(st);
    }
  }

  // 4) 发送完成
  for (i = 0; i < S.stations.length; i++) {
    st = S.stations[i];
    if (st.state === "tx" && S.t >= st.txEnd) {
      if (st.collisionAt !== null && st.collisionAt > S.t) {
        // 帧在冲突信号返回之前就发完了 → 发送方误认为成功
        st.warnShort = true;
        S.misdetect++;
      }
      st.state = "idle";
      st.pending = false;
      st.collisions = 0;
      st.sent++;
      st.backoff = null;
      S.successes++;
      st.nextArrival = S.t + randInt(2, 10);
      st.note = st.warnShort
        ? "⚠️ 帧长 < 2τ，冲突信号还没回来就发完了，误判为成功"
        : "发送完成（未检测到冲突）";
      st.collisionAt = null;
    }
  }

  // 5) 冲突检测：发送中检测到冲突 → 立即停发并发送干扰信号
  for (i = 0; i < S.stations.length; i++) {
    st = S.stations[i];
    if (st.state === "tx" && st.collisionAt !== null && S.t >= st.collisionAt) {
      startJam(st);
    }
  }

  // 6) 监听信道并决策
  for (i = 0; i < S.stations.length; i++) {
    st = S.stations[i];
    if (st.state !== "sense" || !st.pending) continue;
    var busy = visibleBusy(st, S.t);
    if (!busy) {
      if (CFG.proto === "pp") {
        if (Math.random() < CFG.p) {
          startTx(st);
        } else {
          st.state = "wait";
          st.wakeT = S.t + 2 * CFG.tau;   // 推迟一个时隙（2τ）再监听
          st.note = "p-坚持：本时隙以概率 p 未命中（1-p），推迟 2τ 再听";
        }
      } else {
        startTx(st);
      }
    } else {
      if (CFG.proto === "np") {
        var w = randInt(1, 2 * CFG.tau);
        st.state = "wait";
        st.wakeT = S.t + w;
        st.note = "非坚持：信道忙，随机等待 " + w + " 时隙后再监听";
      } else {
        st.note = CFG.proto === "pp"
          ? "p-坚持：信道忙，继续监听（等到空闲的时隙再按 p 决定）"
          : "1-坚持：信道忙，持续监听，一空闲就立即发送";
      }
    }
  }

  // 7) 统计与时序推进
  var busyNow = busRealBusy();
  if (busyNow === 1) S.busyTicks++;        // 成功发送占用信道的时间
  else if (busyNow === 2) S.jamTicks++;    // 冲突 + Jamming 浪费的时间
  S.pulses = S.pulses.filter(function (p) { return S.t - p.t0 <= CFG.tau + 1; });

  render();
  updateStats();
  renderStatus();
}

/* ============================ 渲染 ============================ */
function buildStations() {
  var box = $("stations");
  box.innerHTML = "";
  for (var i = 0; i < S.stations.length; i++) {
    var w = document.createElement("div");
    w.className = "stwrap";
    var d = document.createElement("div");
    d.className = "st c-idle";
    d.id = "st" + i;
    d.innerHTML = '<div class="stname">' + S.stations[i].name + '</div>' +
                  '<div class="ststate" id="ss' + i + '">空闲</div>' +
                  '<div class="stmeta" id="sm' + i + '">冲突 0 次</div>';
    var sb = document.createElement("div");
    sb.className = "stub";
    sb.id = "sb" + i;
    w.appendChild(d); w.appendChild(sb);
    box.appendChild(w);
  }
}

var STATE_TEXT = {
  idle: ["空闲", "#94a3b8"],
  sense: ["监听信道", "#f59e0b"],
  wait: ["随机等待", "#6366f1"],
  tx: ["发送中（边发边听）", "#10b981"],
  jam: ["冲突！发干扰信号", "#ef4444"],
  backoff: ["退避等待", "#8b5cf6"],
  fail: ["已丢弃（报错）", "#ef4444"]
};

function render() {
  for (var i = 0; i < S.stations.length; i++) {
    var st = S.stations[i];
    var card = $("st" + i);
    if (!card) continue;
    card.className = "st c-" + st.state;
    var t = STATE_TEXT[st.state] || ["", "#64748b"];
    var sse = $("ss" + i);
    sse.textContent = t[0];
    sse.style.color = t[1];
    var meta = "冲突 " + st.collisions + " 次·成功 " + st.sent + " 帧";
    if (st.state === "backoff" && st.backoff) {
      meta = "第 " + st.backoff.i + " 次冲突 · 可选 {0…" + (st.backoff.slots - 1) + "} · 取 k=" +
             st.backoff.k + " · 等待 " + st.backoff.wait + " 时隙";
    }
    $("sm" + i).textContent = meta;
    var sb = $("sb" + i);
    sb.className = "stub" + (st.state === "tx" ? " on" : st.state === "jam" ? " jam" : "");
  }
  renderPulses();
  renderCW();
}

function renderPulses() {
  var box = $("pulses");
  box.innerHTML = "";
  for (var i = 0; i < S.pulses.length; i++) {
    var p = S.pulses[i];
    var frac = Math.min(1, (S.t - p.t0) / Math.max(1, CFG.tau));
    var posBase = 0.06 + p.x * 0.88;
    var pos = p.dir > 0
      ? posBase + (0.94 - posBase) * frac
      : posBase - (posBase - 0.06) * frac;
    var el = document.createElement("div");
    el.className = "pulse" + (p.jam ? " jam" : "");
    el.style.left = (pos * 100) + "%";
    if (frac >= 1) el.style.opacity = "0.15";
    box.appendChild(el);
  }
  var bus = $("busline");
  var b = busRealBusy();
  bus.className = "busline" + (b === 2 ? " jam" : b === 1 ? " busy" : "");
}

function renderCW() {
  var box = 2 * CFG.tau;
  var el = S.t - S.lastTxStart;
  var fill = $("cwfill");
  if (S.lastTxStart < 0 || el > box) {
    fill.style.width = "0%";
    fill.className = "cwfill";
    $("cwRight").textContent = "—";
    $("cwLeft").textContent = "争用期 2τ = " + box + " 时隙：最近一次发送开始后的往返传播时延窗口";
    return;
  }
  var w = Math.max(0, Math.min(1, el / box)) * 100;
  fill.className = "cwfill" + (S.cwCollide >= 0 ? " bad" : "");
  fill.style.width = w + "%";
  $("cwLeft").textContent = "争用期 2τ = " + box + " 时隙（信号往返传播的时间）";
  $("cwRight").textContent = "第 " + Math.max(0, el) + " / " + box + " 时隙" +
    (S.cwCollide >= 0 ? " · ⚠️ 第 " + S.cwCollide + " 时隙发生冲突" : "");
}

function updateStats() {
  $("statT").textContent = S.t;
  $("statCol").textContent = S.collisions;
  $("statOk").textContent = S.successes;
  // 信道利用率 = 成功发送占用信道的时间 / 总时间（冲突+Jamming 属于浪费）
  var util = S.t > 0 ? (S.busyTicks / S.t * 100) : 0;
  $("statUtil").textContent = util.toFixed(1) + "%";
  $("statWaste").textContent = S.jamTicks + " 时隙" + (S.misdetect > 0 ? "（漏检 " + S.misdetect + "）" : "");
}

function setStatus(html) { $("statusLine").innerHTML = html; }

function renderStatus() {
  var msgs = [];
  for (var i = 0; i < S.stations.length; i++) {
    var st = S.stations[i];
    if (st.note && (st.state === "backoff" || st.state === "jam" ||
        (st.state === "tx" && st.collisionAt === null && S.t - st.txStart <= 1))) {
      msgs.push("<b>" + st.name + "</b>：" + st.note);
    }
  }
  if (msgs.length === 0) {
    var acting = null;
    for (i = 0; i < S.stations.length; i++) {
      if (S.stations[i].state === "tx") { acting = S.stations[i]; break; }
    }
    if (acting) msgs.push("<b>" + acting.name + "</b> 正在发送，其余站点监听到的信道状态会晚 τ = " + CFG.tau + " 时隙才更新——这正是冲突可能发生的原因。");
    else msgs.push("第 <b>" + S.t + "</b> 时隙：总线上无信号，各站点按协议规则监听/等待/退避。");
  }
  setStatus("⏱ 第 <b>" + S.t + "</b> 时隙 &nbsp;|&nbsp; " + msgs.slice(0, 3).join(" &nbsp;·&nbsp; "));
}

/* ============================ 说明区 ============================ */
function updateDesc() {
  var minFrame = 2 * CFG.tau;
  var protoName = CFG.proto === "p1" ? "1-坚持 CSMA" : CFG.proto === "np" ? "非坚持 CSMA" : "p-坚持 CSMA";
  $("headInfo").textContent = protoName + " · 争用期 2τ = " + minFrame + " 时隙";
  var warn = CFG.frame < minFrame
    ? '<br><b style="color:#ef4444">⚠️ 当前帧长 ' + CFG.frame + ' 时隙 < 2τ = ' + minFrame +
      ' 时隙：</b>发送方可能在冲突信号返回之前就把整帧发完，从而误认为发送成功（观察统计区的"漏检"）。' +
      '所以以太网规定 <code>最小帧长 = 2τ × 数据率</code>。'
    : '<br><b style="color:#10b981">✓ 当前帧长 ' + CFG.frame + ' 时隙 ≥ 2τ = ' + minFrame +
      ' 时隙：</b>发送方在整帧发完前一定能收到冲突信号，保证冲突可被检测到。10 Mbps 以太网取 2τ = 51.2 μs，' +
      '故最小帧长 = 51.2 μs × 10 Mbps = 512 bit = <b>64 字节</b>。';
  $("desc").innerHTML =
    '<b>为什么"边发边听"：</b>CSMA 只在发送前监听一次，若两个站点几乎同时开始发送，信号在总线上叠加就产生冲突；' +
    '总线型以太网没有集中控制，发送方只能靠<b>边发送边检测</b>（比较自己发出的信号与总线上的信号）来发现冲突，' +
    '一旦发现立即停发，避免白白占用信道。<br>' +
    '<b>强化干扰信号（Jamming）：</b>发现冲突的站点再发送 32~48 bit 的干扰信号（本演示为 2τ 时长），' +
    '让总线上所有站点都能确认发生了冲突，而不是收到一个可能被误判为合法的残帧。<br>' +
    '<b>为什么有最小帧长：</b>信号单程传播时延为 τ，最坏情况（A 刚发出、B 在 A 的信号到达前 τ 内开始发送）下，' +
    'A 要在 <b>2τ</b>（争用期 / 冲突窗口）之后才能确认自己没有遇到冲突。因此帧长必须 ≥ 2τ × 数据率；' +
    '短于此长度的帧一定是冲突产生的残帧，直接丢弃。' + warn + '<br>' +
    '<b>二进制指数退避（BEB）：</b>第 i 次冲突后，从 {0, 1, …, 2<sup>i</sup>−1} 中随机取 k，等待 k×2τ 后重试；' +
    '即 <code>退避时间 = k × 2τ，k = random(0, 2^i − 1)</code>。i 越大可选时隙越多、平均等待越长，' +
    '冲突次数少的站点能更快抢到信道，网络负载越高退避越久，从而自适应地降低再次冲突的概率。' +
    '连续冲突 16 次后丢弃该帧并向上层报错（本演示中站点会变为"已丢弃"）。<br>' +
    '<b>CSMA/CD 与 CSMA/CA 的区别：</b>CSMA/CD 用于<b>有线总线</b>，可以边发边听、靠冲突检测停发，' +
    '所以冲突只会浪费一小段争用期；无线信道因<b>隐藏站</b>问题、无法边发边收（收发共用天线、信号强度差异大），' +
    '不能做冲突检测，于是 802.11 改用 <b>CSMA/CA</b>：用 ACK 确认代替冲突检测，' +
    '并配合<b>帧间间隔 IFS、退避计数器、RTS/CTS 握手</b>尽量<b>避免</b>冲突（把冲突消灭在发送之前），' +
    '而不是等冲突发生后再停发。';
}

/* ============================ 交互 ============================ */
function startPlay() {
  if (S.finished) return;
  playing = true;
  $("btnPlay").textContent = "⏸ 暂停";
  $("statState").textContent = "仿真中…";
  loop();
}
function loop() {
  stopTimer();
  if (!playing) return;
  step();
  if (S.finished) { playing = false; return; }
  timer = setTimeout(loop, speed);
}

$("btnPlay").onclick = function () {
  if (playing) {
    playing = false;
    stopTimer();
    $("btnPlay").textContent = "▶ 播放";
    $("statState").textContent = "已暂停";
  } else {
    startPlay();
  }
};
$("btnStep").onclick = function () {
  playing = false;
  stopTimer();
  $("btnPlay").textContent = "▶ 播放";
  $("statState").textContent = "单步";
  step();
};
$("btnReset").onclick = function () { reset(); };

$("btnForce").onclick = function () {
  // 让所有空闲站点在同一时刻一起开始发送 → 必然冲突
  var cnt = 0;
  for (var i = 0; i < S.stations.length; i++) {
    var st = S.stations[i];
    if (st.state === "fail") continue;
    st.state = "sense";
    st.pending = true;
    st.backoff = null;
    st.note = "被人为设为同时发送";
    cnt++;
  }
  if (cnt < 2) { setStatus("至少需要 2 个可用站点才能制造冲突。"); return; }
  setStatus("⚡ 已让 <b>" + cnt + "</b> 个站点在同一时刻开始发送 —— 单步或播放，观察它们如何在 2τ 争用期内检测到冲突、发出 Jamming 信号并各自退避。");
};

$("selN").onchange = function () { CFG.n = +this.value; reset(); };
$("rngTau").oninput = function () {
  CFG.tau = +this.value;
  $("tauVal").textContent = CFG.tau + " 时隙";
  reset();
};
$("rngFrame").oninput = function () {
  CFG.frame = +this.value;
  $("frameVal").textContent = CFG.frame + " 时隙";
  reset();
};
$("selProto").onchange = function () { CFG.proto = this.value; reset(); };
$("rngP").oninput = function () {
  CFG.p = +this.value / 10;
  $("pVal").textContent = CFG.p.toFixed(1);
};
var speedBtns = document.querySelectorAll(".speed-group button");
for (var bi = 0; bi < speedBtns.length; bi++) {
  speedBtns[bi].onclick = function () {
    for (var k = 0; k < speedBtns.length; k++) speedBtns[k].classList.remove("active");
    this.classList.add("active");
    speed = +this.dataset.speed;
    if (playing) loop();
  };
}

/* 启动 */
reset();
</script>
</body>
</html>
