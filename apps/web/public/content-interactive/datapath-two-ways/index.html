<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据通路两种方式：专用数据通路 与 CPU 内部总线</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .head { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; padding: 13px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .head h1 { font-size: 16px; font-weight: 600; }
  .head .info { font-size: 12px; opacity: .95; background: rgba(255,255,255,.18); padding: 3px 10px; border-radius: 20px; }
  .controls { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid #eef2f7; }
  .controls label { font-size: 12px; color: #64748b; }
  button { font-size: 13px; font-family: inherit; padding: 6px 13px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all .15s; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-ghost { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  .btn-ghost:hover { background: #e2e8f0; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .seg { display: inline-flex; background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 9px; padding: 2px; gap: 2px; }
  .seg button { padding: 5px 12px; font-size: 12.5px; background: transparent; color: #475569; }
  .seg button.active { background: #6366f1; color: #fff; }
  .speed-group { display: flex; gap: 4px; }
  .speed-group button { padding: 4px 10px; font-size: 12px; }
  .speed-group .active { background: #6366f1; color: #fff; border-color: #6366f1; }
  .stats { padding: 7px 16px; display: flex; gap: 16px; font-size: 12px; color: #64748b; border-bottom: 1px solid #eef2f7; flex-wrap: wrap; align-items: center; }
  .stats b { color: #1e293b; font-variant-numeric: tabular-nums; }
  .stats .pill { background: #eef2ff; color: #4338ca; border-radius: 20px; padding: 2px 9px; font-size: 11.5px; }
  .msg { margin: 0 16px 8px; padding: 7px 11px; border-radius: 8px; font-size: 12px; background: #fef3c7; color: #92400e; border: 1px solid #fde68a; display: none; }
  .msg.warn { display: block; }
  .msg.err { display: block; background: #fef2f2; color: #991b1b; border-color: #fecaca; }
  .stage { padding: 8px 12px 2px; overflow-x: auto; }
  svg#dp { width: 100%; height: auto; display: block; }
  .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.6; }
  .box.q { fill: #fff; }
  .nm { font: 600 18px "Microsoft YaHei", system-ui, sans-serif; fill: #334155; }
  .val { font: 600 18px Consolas, monospace; fill: #0f172a; }
  .wire { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .wire.on { stroke: #6366f1; stroke-width: 2.6; stroke-dasharray: 9 6; animation: flow .7s linear infinite; }
  .wire.err { stroke: #ef4444; stroke-width: 2.8; stroke-dasharray: 9 6; animation: flow .5s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -30; } }
  .busbar { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.6; }
  .buslbl { font: 600 16px "Microsoft YaHei", system-ui, sans-serif; fill: #4338ca; }
  .bus.on { fill: #c7d2fe; }
  .bus.err { fill: #fecaca; stroke: #ef4444; }
  .blk.on .box { fill: #eef2ff; stroke: #6366f1; stroke-width: 2.2; }
  .blk.done .box { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
  .blk.on .nm { fill: #3730a3; }
  .blk.done .nm { fill: #047857; }
  .gate { fill: #fff; stroke: #94a3b8; stroke-width: 1.3; }
  .gate.on { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; }
  .glbl { font: 500 14px Consolas, monospace; fill: #64748b; }
  .alu { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.6; }
  .alu.on { fill: #eef2ff; stroke: #6366f1; stroke-width: 2.2; }
  .alut { font: 600 19px "Microsoft YaHei", system-ui, sans-serif; fill: #334155; }
  .pin { font: 500 14.5px Consolas, monospace; fill: #64748b; }
  .arrowhead { fill: #cbd5e1; }
  .on + .arrowhead, .arrowhead.on { fill: #6366f1; }
  .bottom { display: flex; gap: 14px; padding: 8px 16px 14px; border-top: 1px solid #eef2f7; flex-wrap: wrap; }
  .ops { flex: 1 1 46%; min-width: 240px; }
  .desc { flex: 1 1 50%; min-width: 240px; }
  .panel-t { font-size: 11px; color: #94a3b8; margin-bottom: 5px; letter-spacing: .5px; }
  ol#opList { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  ol#opList li { font-size: 12.5px; color: #475569; background: #f8fafc; border: 1px solid #eef2f7; border-radius: 8px; padding: 6px 10px; display: flex; gap: 8px; align-items: baseline; }
  ol#opList li .n { font: 600 11px Consolas, monospace; color: #94a3b8; }
  ol#opList li.cur { background: #eef2ff; border-color: #c7d2fe; color: #3730a3; font-weight: 600; }
  ol#opList li.done { color: #94a3b8; }
  ol#opList li.done .n { color: #10b981; }
  #descBox { font-size: 12.5px; color: #475569; line-height: 1.75; background: #f8fafc; border: 1px solid #eef2f7; border-radius: 9px; padding: 9px 12px; min-height: 64px; }
  #descBox b { color: #4338ca; }
  .swipe-hint { display: none; }
  .hintbar { font-size: 11.5px; color: #94a3b8; padding: 0 16px 12px; }
  @media (max-width: 560px) {
    body { padding: 8px; }
    .head h1 { font-size: 14px; }
    .controls { gap: 6px; padding: 8px 10px; }
    .stats { gap: 10px; }
    .stage svg { min-width: 600px; }
    .swipe-hint { display: block; font-size: 11px; color: #94a3b8; padding: 0 12px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>🛣️ 数据通路两种方式：ADD R1, R2</h1>
    <span class="info" id="modeInfo">专用数据通路 · 2 拍</span>
  </div>

  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-mode="dedicated" class="active">专用数据通路</button>
      <button data-mode="bus">CPU 内部总线</button>
    </div>
    <button class="btn-primary" id="btnPlay">▶ 播放</button>
    <button class="btn-ghost" id="btnStep">单步</button>
    <button class="btn-ghost" id="btnReset">↺ 重置</button>
    <div class="speed-group" id="speedGroup">
      <button class="btn-ghost" data-speed="1400">慢</button>
      <button class="btn-ghost active" data-speed="900">中</button>
      <button class="btn-ghost" data-speed="550">快</button>
    </div>
    <button class="btn-ghost" id="btnConflict" disabled>试试“同时输出”</button>
  </div>

  <div class="stats">
    <span class="pill" id="statMode">专用数据通路</span>
    <span>当前拍 <b id="statBeat">0 / 2</b></span>
    <span>R1 = <b id="statR1">25</b></span>
    <span>R2 = <b>37</b></span>
    <span id="statHint">单步看每一拍谁在动</span>
  </div>

  <div class="msg" id="msg"></div>

  <div class="stage">
    <svg id="dp" viewBox="0 0 960 460" role="img" aria-label="数据通路演示：左侧为寄存器组，中间为 ALU，两种方式分别用专用连线或内部总线连接">
      <!-- 共用图形：寄存器（两套场景各一份，值同步） -->
      <g id="sceneDedicated">
        <!-- registers -->
        <g class="blk" data-reg="R0"><rect class="box" x="60" y="50" width="120" height="44" rx="8"/><text class="nm" x="72" y="78">R0</text><text class="val" x="150" y="78">12</text></g>
        <g class="blk" data-reg="R1"><rect class="box" x="200" y="50" width="120" height="44" rx="8"/><text class="nm" x="212" y="78">R1</text><text class="val" x="290" y="78" data-val="R1">25</text></g>
        <g class="blk" data-reg="R2"><rect class="box" x="340" y="50" width="120" height="44" rx="8"/><text class="nm" x="352" y="78">R2</text><text class="val" x="430" y="78">37</text></g>
        <g class="blk" data-reg="R3"><rect class="box" x="480" y="50" width="120" height="44" rx="8"/><text class="nm" x="492" y="78">R3</text><text class="val" x="570" y="78">8</text></g>
        <!-- ALU -->
        <polygon class="alu" id="d-alu" points="620,180 620,320 740,250"/>
        <text class="alut" x="648" y="256">ALU</text>
        <text class="pin" x="600" y="196">A</text>
        <text class="pin" x="600" y="288">B</text>
        <!-- 专用连线 -->
        <path class="wire" id="d-r1a" d="M260 94 V160 H580 V200 H620" marker-end="url(#arrow)"/>
        <path class="wire" id="d-r2b" d="M400 94 V280 H620" marker-end="url(#arrow)"/>
        <path class="wire" id="d-out" d="M740 250 H900 V20 H260 V50" marker-end="url(#arrow)"/>
        <text class="glbl" x="266" y="120">R1→A</text>
        <text class="glbl" x="406" y="120">R2→B</text>
        <text class="glbl" x="800" y="244">ALU→R1</text>
      </g>

      <g id="sceneBus" style="display:none">
        <g class="blk" data-reg="R0"><rect class="box" x="60" y="50" width="120" height="44" rx="8"/><text class="nm" x="72" y="78">R0</text><text class="val" x="150" y="78">12</text></g>
        <g class="blk" data-reg="R1"><rect class="box" x="200" y="50" width="120" height="44" rx="8"/><text class="nm" x="212" y="78">R1</text><text class="val" x="290" y="78" data-val="R1">25</text></g>
        <g class="blk" data-reg="R2"><rect class="box" x="340" y="50" width="120" height="44" rx="8"/><text class="nm" x="352" y="78">R2</text><text class="val" x="430" y="78">37</text></g>
        <g class="blk" data-reg="R3"><rect class="box" x="480" y="50" width="120" height="44" rx="8"/><text class="nm" x="492" y="78">R3</text><text class="val" x="570" y="78">8</text></g>

        <!-- 寄存器到总线的连接 + 三态门 -->
        <path class="wire" id="b-r0" d="M120 94 V390" />
        <rect class="gate" id="g-r0" x="109" y="330" width="22" height="14" rx="3"/><text class="glbl" x="134" y="341">R0out</text>
        <path class="wire" id="b-r1" d="M260 94 V390" />
        <rect class="gate" id="g-r1" x="249" y="330" width="22" height="14" rx="3"/><text class="glbl" x="274" y="341">R1out</text>
        <path class="wire" id="b-r2" d="M400 94 V390" />
        <rect class="gate" id="g-r2" x="389" y="330" width="22" height="14" rx="3"/><text class="glbl" x="414" y="341">R2out</text>
        <path class="wire" id="b-r3" d="M540 94 V390" />
        <rect class="gate" id="g-r3" x="529" y="330" width="22" height="14" rx="3"/><text class="glbl" x="554" y="341">R3out</text>

        <!-- 暂存器 Y、Z -->
        <g class="blk" id="blk-y"><rect class="box q" x="620" y="296" width="90" height="38" rx="8"/><text class="nm" x="632" y="320">Y</text><text class="val" x="668" y="320" data-val="Y">—</text></g>
        <path class="wire" id="b-y" d="M665 334 V390"/>
        <g class="blk" id="blk-z"><rect class="box q" x="820" y="120" width="90" height="38" rx="8"/><text class="nm" x="832" y="144">Z</text><text class="val" x="868" y="144" data-val="Z">—</text></g>
        <path class="wire" id="b-z" d="M880 158 V390"/>

        <!-- ALU + 两条输入、一条输出 -->
        <polygon class="alu" id="b-alu" points="760,240 760,360 860,300"/>
        <text class="alut" x="782" y="306">ALU</text>
        <text class="pin" x="742" y="286">A</text>
        <text class="pin" x="742" y="332">B</text>
        <path class="wire" id="b-ya" d="M710 315 H760" marker-end="url(#arrow)"/>
        <path class="wire" id="b-busb" d="M735 390 V330 H760" marker-end="url(#arrow)"/>
        <path class="wire" id="b-alz" d="M860 300 H900 V158" marker-end="url(#arrow)"/>

        <!-- 总线 -->
        <rect class="busbar" id="b-bus" x="40" y="390" width="880" height="18" rx="9"/>
        <text class="buslbl" x="46" y="384">内部总线</text>
      </g>

      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
        </marker>
      </defs>
    </svg>
  </div>

  <div class="swipe-hint">← 左右滑动查看完整数据通路 →</div>

  <div class="bottom">
    <div class="ops">
      <div class="panel-t">微操作序列（本方式共 <span id="opTotal">2</span> 拍）</div>
      <ol id="opList"></ol>
    </div>
    <div class="desc">
      <div class="panel-t">这一拍在做什么</div>
      <div id="descBox"></div>
    </div>
  </div>
  <div class="hintbar">快捷键：空格 播放/暂停 · → 单步 · R 重置　|　切换方式会重置进度</div>
</div>

<script>
(function () {
  "use strict";

  var MODES = {
    dedicated: {
      name: "专用数据通路",
      total: 2,
      steps: [
        {
          ops: ["R1out → ALU.A", "R2out → ALU.B", "ALUop = ADD"],
          wires: ["d-r1a", "d-r2b"],
          blocks: ["R1", "R2"],
          alu: "d-alu",
          desc: "两个操作数各自走<b>专用连线</b>，同时到达 ALU 的两个输入端——不用排队，一拍就把操作数备齐。"
        },
        {
          ops: ["ALUout → R1in（写回）"],
          wires: ["d-out"],
          blocks: ["R1"],
          alu: "d-alu",
          write: 62,
          desc: "结果沿专用连线写回 R1，<b>2 拍完成</b>。代价是连线数量随部件数增长、设计复杂。"
        }
      ]
    },
    bus: {
      name: "CPU 内部总线",
      total: 3,
      steps: [
        {
          ops: ["R1out, Yin"],
          wires: ["b-r1", "b-y"],
          bus: true,
          blocks: ["R1"],
          gates: ["g-r1"],
          temps: { Y: 25 },
          desc: "总线同一时刻<b>只能有一个输出</b>：先把 R1 经总线送进暂存器 Y 存着，否则下一步 R2 上路时会冲突。"
        },
        {
          ops: ["R2out, ALUop = ADD, Zin"],
          wires: ["b-r2", "b-busb", "b-ya", "b-alz"],
          bus: true,
          blocks: ["R2"],
          gates: ["g-r2"],
          alu: "b-alu",
          temps: { Z: 62 },
          desc: "R2 经总线送到 ALU 的 B 口，Y 里的 R1 直接送 A 口；结果先存进 Z——因为这一拍总线正被 R2 占着，ALU 的输出不能同时上线。"
        },
        {
          ops: ["Zout, R1in（写回）"],
          wires: ["b-z", "b-r1"],
          bus: true,
          blocks: ["Z", "R1"],
          gates: ["g-r1"],
          write: 62,
          desc: "Z 把结果放回总线，再写入 R1，<b>3 拍完成</b>。多出来的这一拍，就是“等总线”的代价。"
        }
      ]
    }
  };

  var state = { mode: "dedicated", step: 0, playing: false, speed: 900, timer: null, conflictTimer: null };

  var els = {
    modeInfo: document.getElementById("modeInfo"),
    modeSeg: document.getElementById("modeSeg"),
    btnPlay: document.getElementById("btnPlay"),
    btnStep: document.getElementById("btnStep"),
    btnReset: document.getElementById("btnReset"),
    btnConflict: document.getElementById("btnConflict"),
    speedGroup: document.getElementById("speedGroup"),
    statMode: document.getElementById("statMode"),
    statBeat: document.getElementById("statBeat"),
    statR1: document.getElementById("statR1"),
    statHint: document.getElementById("statHint"),
    msg: document.getElementById("msg"),
    opList: document.getElementById("opList"),
    opTotal: document.getElementById("opTotal"),
    descBox: document.getElementById("descBox"),
    sceneDedicated: document.getElementById("sceneDedicated"),
    sceneBus: document.getElementById("sceneBus")
  };

  function $(id) { return document.getElementById(id); }

  function setMsg(text, kind) {
    els.msg.textContent = text;
    els.msg.className = "msg" + (text ? " " + (kind || "warn") : "");
  }

  function clearHighlights() {
    Array.prototype.forEach.call(document.querySelectorAll(".wire.on, .wire.err"), function (w) {
      w.classList.remove("on", "err");
    });
    Array.prototype.forEach.call(document.querySelectorAll(".blk.on, .blk.done"), function (b) {
      b.classList.remove("on", "done");
    });
    Array.prototype.forEach.call(document.querySelectorAll(".gate.on"), function (g) {
      g.classList.remove("on");
    });
    Array.prototype.forEach.call(document.querySelectorAll(".alu.on"), function (a) {
      a.classList.remove("on");
    });
    var bus = $("b-bus");
    if (bus) bus.classList.remove("on", "err");
  }

  function resetValues() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-val='R1']"), function (n) { n.textContent = "25"; });
    var y = document.querySelector("[data-val='Y']");
    var z = document.querySelector("[data-val='Z']");
    if (y) y.textContent = "—";
    if (z) z.textContent = "—";
    els.statR1.textContent = "25";
  }

  function renderOps() {
    var m = MODES[state.mode];
    var html = "";
    for (var i = 0; i < m.steps.length; i++) {
      var finished = state.step >= m.total;
      var cur = state.step - 1;
      var cls = finished ? "done" : (i < cur ? "done" : (i === cur ? "cur" : ""));
      html += '<li class="' + cls + '"><span class="n">' + (i + 1) + "</span><span>" + m.steps[i].ops.join("；") + "</span></li>";
    }
    els.opList.innerHTML = html;
    els.opTotal.textContent = String(m.total);
  }

  function applyStep(done) {
    var m = MODES[state.mode];
    clearHighlights();
    if (done <= 0) {
      els.descBox.innerHTML = "点「单步」或「播放」开始：先看<b>专用方式</b>两条操作数连线如何并行，再切到<b>总线方式</b>对比多出来的那一拍。";
      els.statHint.textContent = "第 0 拍：准备";
      return;
    }
    var s = m.steps[done - 1];
    s.wires.forEach(function (id) {
      var el = $(id);
      if (el) el.classList.add("on");
    });
    (s.blocks || []).forEach(function (name) {
      Array.prototype.forEach.call(document.querySelectorAll('.blk[data-reg="' + name + '"], #blk-' + name.toLowerCase()), function (b) { b.classList.add("on"); });
    });
    (s.gates || []).forEach(function (id) {
      var g = $(id);
      if (g) g.classList.add("on");
    });
    if (s.alu) { var a = $(s.alu); if (a) a.classList.add("on"); }
    if (s.bus) { var bus = $("b-bus"); if (bus) bus.classList.add("on"); }
    if (s.temps) {
      Object.keys(s.temps).forEach(function (k) {
        var n = document.querySelector("[data-val='" + k + "']");
        if (n) n.textContent = String(s.temps[k]);
      });
    }
    if (s.write != null) {
      Array.prototype.forEach.call(document.querySelectorAll("[data-val='R1']"), function (n) { n.textContent = String(s.write); });
      els.statR1.textContent = String(s.write);
    }
    if (done >= m.total) {
      Array.prototype.forEach.call(document.querySelectorAll('.blk[data-reg="R1"]'), function (b) { b.classList.add("done"); });
      els.descBox.innerHTML = s.desc + " <b>已完成：共 " + m.total + " 拍。</b>";
      els.statHint.textContent = "已完成，点“重置”重来";
    } else {
      els.descBox.innerHTML = s.desc;
      els.statHint.textContent = state.mode === "dedicated" ? "专用：操作数并行上路" : "总线：一拍只传一个来源";
    }
  }

  function updateStats() {
    var m = MODES[state.mode];
    els.statMode.textContent = m.name;
    els.modeInfo.textContent = m.name + " · " + m.total + " 拍";
    els.statBeat.textContent = Math.min(state.step, m.total) + " / " + m.total;
  }

  function render() {
    var m = MODES[state.mode];
    els.sceneDedicated.style.display = state.mode === "dedicated" ? "" : "none";
    els.sceneBus.style.display = state.mode === "bus" ? "" : "none";
    els.btnConflict.disabled = state.mode !== "bus";
    var svg = document.getElementById("dp");
    if (svg) svg.setAttribute("viewBox", state.mode === "dedicated" ? "0 0 960 350" : "0 0 960 430");
    Array.prototype.forEach.call(els.modeSeg.querySelectorAll("button"), function (b) {
      b.classList.toggle("active", b.getAttribute("data-mode") === state.mode);
    });
    renderOps();
    updateStats();
    applyStep(state.step);
    els.btnStep.disabled = state.step >= m.total;
    if (state.step >= m.total) els.btnPlay.textContent = "▶ 播放";
  }

  function reset(keepMode) {
    stopPlay();
    state.step = 0;
    clearHighlights();
    resetValues();
    setMsg("");
    if (!keepMode) { /* 模式不变 */ }
    render();
  }

  function step() {
    var m = MODES[state.mode];
    if (state.step >= m.total) { stopPlay(); return; }
    state.step += 1;
    render();
    if (state.step >= m.total) stopPlay();
  }

  function play() {
    var m = MODES[state.mode];
    if (state.step >= m.total) reset(true);
    state.playing = true;
    els.btnPlay.textContent = "⏸ 暂停";
    stopTimer();
    state.timer = setInterval(function () {
      if (state.step >= MODES[state.mode].total) { stopPlay(); return; }
      step();
    }, state.speed);
  }

  function stopTimer() {
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
  }

  function stopPlay() {
    state.playing = false;
    stopTimer();
    els.btnPlay.textContent = "▶ 播放";
  }

  function togglePlay() {
    if (state.playing) stopPlay();
    else play();
  }

  function switchMode(mode) {
    if (mode === state.mode) return;
    state.mode = mode;
    reset(true);
  }

  function conflictDemo() {
    if (state.mode !== "bus") return;
    stopPlay();
    if (state.conflictTimer) { clearTimeout(state.conflictTimer); state.conflictTimer = null; }
    clearHighlights();
    ["b-r1", "b-r2"].forEach(function (id) {
      var el = $(id);
      if (el) el.classList.add("err");
    });
    ["g-r1", "g-r2"].forEach(function (id) {
      var g = $(id);
      if (g) g.classList.add("on");
    });
    $("b-bus").classList.add("err");
    setMsg("总线冲突：R1 和 R2 同时想把数据放上总线。真实电路里必须让其中一个置为高阻（关掉三态门），否则数据会「打架」。", "err");
    state.conflictTimer = setTimeout(function () {
      clearHighlights();
      setMsg("");
      applyStep(state.step);
      state.conflictTimer = null;
    }, 2400);
  }

  // 事件绑定
  els.modeSeg.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-mode]");
    if (b) switchMode(b.getAttribute("data-mode"));
  });
  els.btnPlay.addEventListener("click", togglePlay);
  els.btnStep.addEventListener("click", function () { stopPlay(); step(); });
  els.btnReset.addEventListener("click", function () { reset(true); });
  els.btnConflict.addEventListener("click", conflictDemo);
  els.speedGroup.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-speed]");
    if (!b) return;
    state.speed = Number(b.getAttribute("data-speed"));
    Array.prototype.forEach.call(els.speedGroup.querySelectorAll("button"), function (x) { x.classList.toggle("active", x === b); });
    if (state.playing) play();
  });
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.code === "ArrowRight") { e.preventDefault(); stopPlay(); step(); }
    else if (e.key === "r" || e.key === "R") { e.preventDefault(); reset(true); }
  });

  // 初始渲染
  reset(true);
})();
</script>
</body>
</html>
