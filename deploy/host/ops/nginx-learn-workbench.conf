# Learn-Workbench nginx server config.
# This file is copied to /etc/nginx/sites-available/learn-workbench on the server.

# Port 8080: keep the legacy named-domain proxy, but stop serving the product under the IP.
server {
    listen 8080;
    listen [::]:8080;
    server_name www.yuanabd.cn;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Port 8080 + IP: redirect to the canonical login page and never serve the app.
server {
    listen 8080;
    listen [::]:8080;
    server_name 106.55.2.197;
    return 301 https://learn.yuanabd.cn/login;
}

# HTTP + IP: redirect to the canonical login page.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 106.55.2.197;
    return 301 https://learn.yuanabd.cn/login;
}

# HTTP + learn subdomain: force HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name learn.yuanabd.cn;
    return 301 https://$host$request_uri;
}

# HTTPS + IP: the IP should not host the product; send all IP traffic to the login page.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 106.55.2.197;

    ssl_certificate /etc/nginx/ssl/travel-notes-ip/chain.crt;
    ssl_certificate_key /etc/nginx/ssl/travel-notes-ip/server.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://learn.yuanabd.cn/login;
}

# HTTPS + learn subdomain: serve the landing page and proxy application routes.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learn.yuanabd.cn;

    ssl_certificate /etc/letsencrypt/live/learn.yuanabd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.yuanabd.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /data/learn-workbench/landing;
    index learn.html;

    client_max_body_size 32m;

    # 根路径 = 门户首页（公开地址）。用 try_files 内部取文件，**不能** return 301
    # （那会与下面的 /learn.html → / 形成循环）。
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files /learn.html =404;
    }

    # 同一份内容只保留一个公开地址：/learn.html 永久跳回根。
    location = /learn.html {
        return 301 /;
    }
    # 2026-10-01：根路径改回门户（root + index learn.html）。
    # 此前此处 proxy_pass 到 :3001 的 Next 落地页，导致从首页卡片点进来
    # 直接落到 Web 端、门户不可达。应用自身仍由 @app 与其余 location 提供。


    # ---- OTA 更新清单：必须实时（2026-09-16 事故修复）----------------------
    # 正则 location 里的 `expires 30d` 会让 RN(OkHttp) 把清单缓存 30 天，
    # App 端 fetch 的 cache:"no-store" 在 RN 上无效 → 用户永远升级不了。
    # 精确匹配 location 优先级高于正则，这里显式禁缓存。
    location = /mobile-update.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # ---- 下载页：版本号要能立刻反映最新包 ---------------------------------
    location = /download.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location ~* \.bak {
        deny all;
    }

    location ~* \.(css|js|mjs|webp|jpe?g|png|gif|svg|ico|woff2?|ttf|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @app;
    }

    location / {
        try_files $uri @app;
    }

    location /download/ {
        alias /data/learn-workbench/releases/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # 用户上传图片（COS 桶直出；文件名是 uuid，可长缓存）
    location ^~ /uploads/ {
        alias /data/learn-workbench/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 装备图库（品牌官方白底商品图，COS 桶直出）
    location ^~ /equipment/ {
        alias /data/learn-workbench/equipment/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @app {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
