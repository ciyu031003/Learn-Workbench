# =============================================================================
# Learn-Workbench · 匿名接口缓存区（P2）—— http 上下文配置
# proxy_cache_path 必须在 http 层，站点 conf（sites-enabled 内）引用不了，单独放这里。
#
# 部署（服务器一次性）：
#   sudo cp deploy/nginx/conf.d/lwb-cache.conf /etc/nginx/conf.d/lwb-cache.conf
#   sudo cp deploy/nginx/snippets/lwb-cache-location.conf /etc/nginx/snippets/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# 10MB 索引区 ≈ 可挂 ~8 万个键；磁盘上限 100MB，60 分钟无访问回收
proxy_cache_path /var/cache/nginx/lwb-anon levels=1:2 keys_zone=lwb_anon:10m
                 max_size=100m inactive=60m use_temp_path=off;
