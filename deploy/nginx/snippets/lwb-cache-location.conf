# =============================================================================
# Learn-Workbench · 匿名只读接口缓存 location（P2）—— server 块内 include
# 依赖 /etc/nginx/conf.d/lwb-cache.conf 定义的 lwb_anon 缓存区。
#
# 适用范围：无会话、按日变化的只读接口（公开统计/市场分析/运动目录/壁纸图/技能目录）。
# 应用侧已带 Cache-Control: s-maxage=600（nginx 优先遵循上游头），
# proxy_cache_valid 仅兜底无缓存头的 200 响应；非 200 一律不缓存。
# 命中时 X-Cache-Status: HIT，可在 nginx 日志观察命中率。
# =============================================================================

location ~ ^/api/(public/stats|market|sports|background/img|jobs/skills)$ {
    proxy_cache lwb_anon;
    proxy_cache_valid 200 10m;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$request_method$scheme$host$request_uri";
    proxy_ignore_headers Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
