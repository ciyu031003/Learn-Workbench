# Learn-Workbench nginx server config.
# This file is copied to /etc/nginx/sites-available/learn-workbench on the server.

# Port 8080: keep the legacy named-domain proxy, but stop serving the product under the IP.
server {
    listen 8080;
    listen [::]:8080;
    server_name www.yuanabd.cn;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Port 8080 + IP: redirect to the canonical login page and never serve the app.
server {
    listen 8080;
    listen [::]:8080;
    server_name 106.55.2.197;
    return 301 https://learn.yuanabd.cn/login;
}

# HTTP + IP: redirect to the canonical login page.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 106.55.2.197;
    return 301 https://learn.yuanabd.cn/login;
}

# HTTP + learn subdomain: force HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name learn.yuanabd.cn;
    return 301 https://$host$request_uri;
}

# HTTPS + IP: the IP should not host the product; send all IP traffic to the login page.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 106.55.2.197;

    ssl_certificate /etc/nginx/ssl/travel-notes-ip/chain.crt;
    ssl_certificate_key /etc/nginx/ssl/travel-notes-ip/server.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://learn.yuanabd.cn/login;
}

# HTTPS + learn subdomain: serve the landing page and proxy application routes.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name learn.yuanabd.cn;

    ssl_certificate /etc/letsencrypt/live/learn.yuanabd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.yuanabd.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /data/learn-workbench/landing;
    index learn.html;

    client_max_body_size 10m;

    location = / {
        try_files /learn.html =404;
    }

    # ---- OTA 更新清单：必须实时（2026-09-16 线上事故修复）-------------------
    # 下面那条正则 location 给 .json 加了 30 天强缓存；RN(Android) 的 fetch 走 OkHttp，
    # OkHttpClientProvider 自带 10MB 磁盘缓存并严格按 max-age 复用（fetch 的 cache:"no-store"
    # 是浏览器语义，RN 不认）→ 已安装用户的「检查更新」永远读到旧清单、无法升级。
    # nginx 精确匹配 location 优先级高于正则，这里显式禁缓存。
    location = /mobile-update.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # ---- 下载页：版本号要能立刻反映最新包 ----------------------------------
    location = /download.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location ~* \.bak {
        deny all;
    }

    location ~* \.(css|js|mjs|webp|jpe?g|png|gif|svg|ico|woff2?|ttf|json)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @app;
    }

    location / {
        try_files $uri @app;
    }

    location /download/ {
        alias /data/learn-workbench/releases/;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    # 用户上传的图片（COS 桶直出；文件名是 uuid，可长缓存）
    # ⚠️ 必须用 ^~：否则会被下面的正则 location（\.webp 等）抢走，落到 Next 变 404
    location ^~ /uploads/ {
        alias /data/learn-workbench/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 装备图库（品牌官方白底商品图；同样必须 ^~）
    location ^~ /equipment/ {
        alias /data/learn-workbench/equipment/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @app {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
