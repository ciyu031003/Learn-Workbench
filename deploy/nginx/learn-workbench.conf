# Learn-Workbench · nginx 站点配置（learn.yuanabd.cn）
# 部署位置：/etc/nginx/sites-available/learn-workbench → sites-enabled 软链
# 说明：
#  - 备案通过前：80/443 按 IP（未知 Host）直达本站，域名 80 跳转 HTTPS
#  - 备案通过后：https://learn.yuanabd.cn 正常访问（证书已就绪）
#  - 需在 travel-notes 的 80 listen 去掉 default_server，避免默认站点冲突
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.yuanabd.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name learn.yuanabd.cn;

    ssl_certificate /etc/letsencrypt/live/learn.yuanabd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.yuanabd.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}