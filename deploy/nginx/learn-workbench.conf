# Learn-Workbench · nginx 站点配置
# 部署位置：/etc/nginx/sites-available/learn-workbench → sites-enabled 软链
#
# 2026-08-31 调整：www.yuanabd.cn 的 80/443 让给门户网站（其他项目），
# 本项目改走端口访问：
#   - http://www.yuanabd.cn:8080（或 IP:8080）→ 127.0.0.1:3001
#   - https://learn.yuanabd.cn 继续可用（保留，且不再占 default_server，避免抢占 www.yuanabd.cn）
# 注意：云安全组需放行 8080（服务器 ufw 未启用，由腾讯云安全组控制）。

# ---- 端口访问：www.yuanabd.cn:8080 / IP:8080 → 本项目（127.0.0.1:3001）----
server {
    listen 8080;
    listen [::]:8080;
    server_name www.yuanabd.cn _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---- 保留：learn.yuanabd.cn 80 → HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name learn.yuanabd.cn;
    return 301 https://$host$request_uri;
}

# ---- 保留：learn.yuanabd.cn 443 SSL（不再作为 default_server）----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name learn.yuanabd.cn;

    ssl_certificate /etc/letsencrypt/live/learn.yuanabd.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.yuanabd.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}