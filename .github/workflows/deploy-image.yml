name: Deploy Image (GHCR)

# S4-4：在 CI 构建不可变镜像并推送 GHCR；服务器只 pull + up（不再现场构建）
# 触发：打 tag（v*）或手动指定 ref。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "构建的 git ref（默认当前分支 HEAD）"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version
        id: version
        run: |
          SHA=$(git rev-parse --short HEAD)
          TAG=$(git describe --tags --always 2>/dev/null || echo "$SHA")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/learn-workbench-web:${{ steps.version.outputs.sha }}
            ghcr.io/${{ github.repository_owner }}/learn-workbench-web:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/learn-workbench-web:latest
