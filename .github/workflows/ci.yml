name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # E2E/Playwright 相关依赖在 install 阶段不下载浏览器（e2e 作业按需安装）
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # H4：结构门禁与回滚演练需要真库 —— 门禁只在本地能跑就不算门禁。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # 库侧内容门禁（fail-closed）要连的库：由下面的 Prepare 步骤用 schema.sql + 全部迁移造出来。
      PGDATABASE: lwb_content_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # v1.44.0：check-content-quality.mjs 改为 fail-closed（拿不到库即失败），
      # 而 pnpm test:scripts 会以无参数方式调用它。CI 的质量作业虽有 postgres service，
      # 但默认库里没有业务表 —— 所以先造一个「schema.sql + 全部迁移」的真实库并保留
      # （专用库名 lwb_content_ci，绝不复用/覆盖 Learn-Workbench），
      # 让库侧内容门禁在 CI 里真正生效，而不是靠「跳过」混过去。
      - name: Prepare content DB (schema.sql + all migrations, kept)
        run: node scripts/check-schema-fresh.mjs --db=lwb_content_ci --keep

      - name: Script checks (normalize + migrations)
        run: pnpm test:scripts

      # v1.44.0：三套移动端门禁此前只在本地手跑，CI 完全没覆盖 —— 门禁不进 CI 就不算门禁。
      # 三个脚本都是纯静态分析（读 apps/mobile/src 源码 + docs/*-baseline.json 棘轮基线），
      # 不依赖 Android SDK / 模拟器，可在 ubuntu-latest 直接跑。
      - name: Mobile font-scale gate (裸写数字字号不得增加)
        run: node scripts/check-font-scale.mjs

      - name: Mobile UI matrix gate (hitSlop / tab 安全区 / 钉桩)
        run: node scripts/check-mobile-ui-matrix.mjs

      - name: Mobile motion budget gate (动效点预算棘轮)
        run: node scripts/check-motion-budget.mjs

      # 注意：name 里的 ": " 会被 YAML 当成嵌套映射键 —— 必须加引号，
      # 否则整个 ci.yml 解析失败、workflow 直接不触发（HEAD 上这个坑一直存在，见 PR 说明）。
      - name: "DB schema gate (empty DB: schema.sql + all migrations)"
        run: node scripts/check-schema-fresh.mjs

      # 质量作业本身带 postgres service，所以库侧内容门禁必须真连库（fail-closed）。
      - name: Content quality gate (DB-backed, fail-closed)
        run: node scripts/check-content-quality.mjs --strict --require-db

      - name: Migration rollback drill (up -> down -> up)
        run: node scripts/migration-drill.mjs

      - name: Dependency audit (high and above)
        run: node scripts/check-deps-audit.mjs

      - name: Coverage gate (ratchet thresholds)
        run: pnpm test:coverage

      - name: Build (web)
        run: pnpm --filter web build

  e2e:
    name: E2E (Playwright · Docker 全栈)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # compose 全栈：web 监听宿主机 3001
      PG_PASSWORD: ci-pg-pass
      NPM_REGISTRY: https://registry.npmjs.org
      E2E_BASE_URL: http://localhost:3001
      E2E_USERNAME: admin
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'ci-e2e-password' }}
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies (skip browser download)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium (E2E)
        run: pnpm --filter @learn-workbench/e2e exec playwright install --with-deps chromium

      - name: Build & start stack (db + init + web)
        run: docker compose up -d --build

      - name: Wait for web ready
        run: |
          for i in $(seq 1 72); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/login || true)
            if [ "$code" = "200" ] || [ "$code" = "307" ]; then
              echo "web ready (HTTP $code) after ${i}x5s"
              exit 0
            fi
            sleep 5
          done
          echo "web 未就绪，最近日志："
          docker compose logs web --tail 60
          exit 1

      - name: Create admin account (E2E login)
        run: docker exec -w /app learn-workbench-web-1 node scripts/create-admin.mjs --username "$E2E_USERNAME" --password "$E2E_PASSWORD"

      - name: Run E2E
        run: pnpm --filter @learn-workbench/e2e test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
